<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="figtitle figdesc" width="170mm" height="141.6667mm" id="element-0">
<title id="figtitle">The cerebellar loop in anatomy</title>
<desc id="figdesc">A selected recurrent limb-control loop. Motor cortex influences spinal circuits and motor neurons and supplies motor-related input through pontine nuclei. Proprioceptive information reaches cerebellar cortex through ascending relays. Mossy fibers influence Purkinje cells through granule and parallel fibers and also excite cerebellar nuclear neurons. Purkinje cells inhibit nuclear output, which returns through motor thalamus to cortex. Computational annotations are proposed forward-model roles. Intervening relays and crossings are omitted.</desc>
