<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="figtitle figdesc" width="170mm" height="141.6667mm" id="element-0">
<title id="figtitle">The cerebellar loop with olivocerebellar instruction</title>
<desc id="figdesc">A selected cerebrocerebellar limb-control loop with sensory relays, pontine mossy-fiber input through granule and parallel fibers, inhibitory Purkinje output, excitatory nuclear output, and the classical inhibitory nucleo-olivary pathway. Distinct nuclear populations supply excitatory motor output and inhibitory olivary feedback. The comparator annotation is a model interpretation. Climbing fibers return instructive signals to the cortex. The additional route includes the parvocellular red nucleus. Intervening relays and crossings are omitted.</desc>
