<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" role="img" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Corticospinal origins, functional bias, and convergence on spinal circuits</title>
<desc>Panel A: lateral and medial views of the cerebral hemisphere showing that corticospinal axons arise from motor areas and from somatosensory and parietal cortex. Panel B: overlapping bias gradients from axial and postural control to distal fractionated control for each descending tract. Panel C: descending pathways act mainly through spinal interneurons, with a direct cortico-motoneuronal route to lateral motor pools in primates.</desc>

<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#F1EFFC"/>
<line x1="0" y1="0" x2="0" y2="8" stroke="#5B4BC4" stroke-width="2.2"/>
</pattern>
<clipPath id="hemi">
<path d="M68 230 C68 176 130 140 210 134 C300 128 400 146 448 186 C484 216 480 252 448 272 C400 294 320 300 262 296 C200 292 140 288 108 276 C78 264 68 250 68 230 Z"/>
</clipPath>
<linearGradient id="gLCST" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#5B4BC4" stop-opacity="0"/><stop offset="10%" stop-color="#5B4BC4" stop-opacity="0.18"/><stop offset="92%" stop-color="#5B4BC4" stop-opacity="0.85"/><stop offset="100%" stop-color="#5B4BC4" stop-opacity="0"/></linearGradient>
<linearGradient id="gACST" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#5B4BC4" stop-opacity="0"/><stop offset="18%" stop-color="#5B4BC4" stop-opacity="0.7"/><stop offset="82%" stop-color="#5B4BC4" stop-opacity="0.45"/><stop offset="100%" stop-color="#5B4BC4" stop-opacity="0"/></linearGradient>
<linearGradient id="gRSTp" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B8375F" stop-opacity="0"/><stop offset="14%" stop-color="#B8375F" stop-opacity="0.85"/><stop offset="84%" stop-color="#B8375F" stop-opacity="0.4"/><stop offset="100%" stop-color="#B8375F" stop-opacity="0"/></linearGradient>
<linearGradient id="gRSTm" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B8375F" stop-opacity="0"/><stop offset="10%" stop-color="#B8375F" stop-opacity="0.78"/><stop offset="88%" stop-color="#B8375F" stop-opacity="0.32"/><stop offset="100%" stop-color="#B8375F" stop-opacity="0"/></linearGradient>
<linearGradient id="gLVST" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#12816A" stop-opacity="0"/><stop offset="16%" stop-color="#12816A" stop-opacity="0.78"/><stop offset="84%" stop-color="#12816A" stop-opacity="0.4"/><stop offset="100%" stop-color="#12816A" stop-opacity="0"/></linearGradient>
<linearGradient id="gMVST" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#12816A" stop-opacity="0"/><stop offset="22%" stop-color="#12816A" stop-opacity="0.7"/><stop offset="78%" stop-color="#12816A" stop-opacity="0.5"/><stop offset="100%" stop-color="#12816A" stop-opacity="0"/></linearGradient>
<linearGradient id="gTST" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C8860D" stop-opacity="0"/><stop offset="22%" stop-color="#C8860D" stop-opacity="0.72"/><stop offset="78%" stop-color="#C8860D" stop-opacity="0.5"/><stop offset="100%" stop-color="#C8860D" stop-opacity="0"/></linearGradient>
<linearGradient id="gRUB" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C1502E" stop-opacity="0"/><stop offset="24%" stop-color="#C1502E" stop-opacity="0.34"/><stop offset="80%" stop-color="#C1502E" stop-opacity="0.28"/><stop offset="100%" stop-color="#C1502E" stop-opacity="0"/></linearGradient>
</defs>

<rect x="0" y="0" width="1000" height="1250" fill="#FFFFFF"/>

<text x="40" y="92" font-size="20" font-weight="700" fill="#1A1A1A">A</text>
<text x="66" y="92" font-size="16" font-weight="700" fill="#1A1A1A">Where corticospinal axons arise</text>

<path d="M68 230 C68 176 130 140 210 134 C300 128 400 146 448 186 C484 216 480 252 448 272 C400 294 320 300 262 296 C200 292 140 288 108 276 C78 264 68 250 68 230 Z" fill="#FAF9F6" stroke="#A8A49B" stroke-width="1.2"/>
<g clip-path="url(#hemi)">
<path d="M172 142 L218 136 L186 248 L150 240 Z" fill="#A9A1E4"/>
<path d="M218 136 L250 132 L216 250 L186 248 Z" fill="#8E85D8"/>
<path d="M250 132 L284 134 L250 252 L216 250 Z" fill="url(#hatch)"/>
<path d="M284 134 L380 150 L330 272 L250 252 Z" fill="url(#hatch)"/>
<path d="M110 256 C160 276 230 284 302 278" fill="none" stroke="#A8A49B" stroke-width="1.2"/>
</g>
<path d="M250 132 L216 250" fill="none" stroke="#1A1A1A" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="182" y="198" font-size="13" fill="#2E2870" text-anchor="middle">PM</text>
<text x="219" y="198" font-size="13" font-weight="700" fill="#241E5E" text-anchor="middle">M1</text>
<text x="251" y="200" font-size="13" fill="#2E2870" text-anchor="middle">S1</text>
<text x="312" y="208" font-size="13" fill="#2E2870" text-anchor="middle">Parietal</text>
<text x="258" y="122" font-size="12" fill="#4A4A4A" text-anchor="middle">central sulcus</text>

<line x1="228" y1="234" x2="500" y2="224" stroke="#9A968D" stroke-width="0.9" stroke-dasharray="3 3"/>
<text x="508" y="220" font-size="13" fill="#1A1A1A">caudal M1: cortico-motoneuronal</text>
<text x="508" y="238" font-size="13" fill="#1A1A1A">cells concentrated here</text>

<rect x="740" y="150" width="210" height="152" rx="6" fill="#FFFFFF" stroke="#CFCCC4" stroke-width="1"/>
<text x="754" y="172" font-size="12" fill="#4A4A4A">Medial surface (inset)</text>
<path d="M762 244 C762 212 800 192 850 192 C900 192 934 212 934 244 C934 268 900 284 850 284 C800 284 762 270 762 244 Z" fill="#FAF9F6" stroke="#A8A49B" stroke-width="1.2"/>
<path d="M838 194 L866 196 L861 220 L834 218 Z" fill="#8E85D8"/>
<text x="848" y="242" font-size="12" fill="#2E2870" text-anchor="middle">SMA</text>
<line x1="848" y1="220" x2="848" y2="230" stroke="#9A968D" stroke-width="0.9"/>

<rect x="60" y="332" width="16" height="12" fill="#8E85D8"/>
<text x="84" y="343" font-size="13" fill="#4A4A4A">solid = motor command origins</text>
<rect x="292" y="332" width="16" height="12" fill="url(#hatch)"/>
<text x="316" y="343" font-size="13" fill="#4A4A4A">hatched = origins terminating mainly in dorsal horn (sensory modulation)</text>

<line x1="40" y1="440" x2="960" y2="440" stroke="#E5E3DD" stroke-width="1"/>

<text x="40" y="492" font-size="20" font-weight="700" fill="#1A1A1A">B</text>
<text x="66" y="492" font-size="16" font-weight="700" fill="#1A1A1A">Functional bias, not exclusive ownership</text>

<text x="300" y="522" font-size="13" fill="#4A4A4A">axial, proximal, postural</text>
<text x="940" y="522" font-size="13" fill="#4A4A4A" text-anchor="end">distal, fractionated</text>
<line x1="300" y1="534" x2="940" y2="534" stroke="#8A867E" stroke-width="1" marker-end="url(#ah)"/>

<text x="40" y="571" font-size="14" fill="#1A1A1A">Lateral corticospinal</text>
<rect x="300" y="556" width="640" height="16" rx="8" fill="url(#gLCST)"/>
<text x="40" y="601" font-size="14" fill="#1A1A1A">Anterior corticospinal</text>
<rect x="300" y="586" width="230" height="16" rx="8" fill="url(#gACST)"/>
<text x="40" y="631" font-size="14" fill="#1A1A1A">Reticulospinal (pontine)</text>
<rect x="300" y="616" width="175" height="16" rx="8" fill="url(#gRSTp)"/>
<text x="40" y="661" font-size="14" fill="#1A1A1A">Reticulospinal (medullary)</text>
<rect x="300" y="646" width="345" height="16" rx="8" fill="url(#gRSTm)"/>
<text x="40" y="691" font-size="14" fill="#1A1A1A">Lateral vestibulospinal</text>
<rect x="300" y="676" width="175" height="16" rx="8" fill="url(#gLVST)"/>
<text x="40" y="721" font-size="14" fill="#1A1A1A">Medial vestibulospinal</text>
<rect x="300" y="706" width="115" height="16" rx="8" fill="url(#gMVST)"/>
<text x="40" y="751" font-size="14" fill="#1A1A1A">Tectospinal</text>
<rect x="300" y="736" width="115" height="16" rx="8" fill="url(#gTST)"/>
<text x="40" y="781" font-size="14" fill="#1A1A1A">Rubrospinal</text>
<text x="130" y="781" font-size="12" fill="#4A4A4A">(minor in humans)</text>
<rect x="560" y="766" width="300" height="16" rx="8" fill="url(#gRUB)"/>

<text x="40" y="816" font-size="13" font-style="italic" fill="#4A4A4A">Bar extents are schematic, not quantitative. Whole actions recruit several systems at once.</text>

<line x1="40" y1="852" x2="960" y2="852" stroke="#E5E3DD" stroke-width="1"/>

<text x="40" y="902" font-size="20" font-weight="700" fill="#1A1A1A">C</text>
<text x="66" y="902" font-size="16" font-weight="700" fill="#1A1A1A">Most descending influence is indirect</text>

<path d="M240 1000 C380 958 600 958 736 984" fill="none" stroke="#5B4BC4" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#ah)"/>
<text x="500" y="942" font-size="13" fill="#453C93" text-anchor="middle">direct cortico-motoneuronal route (primates)</text>

<rect x="60" y="990" width="180" height="48" rx="6" fill="#EEEDFE" stroke="#5B4BC4" stroke-width="1.2"/>
<text x="150" y="1019" font-size="14" fill="#2E2870" text-anchor="middle">Corticospinal</text>
<rect x="60" y="1080" width="180" height="48" rx="6" fill="#FBEAF0" stroke="#B8375F" stroke-width="1.2"/>
<text x="150" y="1109" font-size="14" fill="#7A2843" text-anchor="middle">Brainstem pathways</text>

<path d="M240 1014 C320 1020 360 1032 414 1050" fill="none" stroke="#5B4BC4" stroke-width="1.4"/>
<path d="M240 1016 C330 1026 400 1034 476 1048" fill="none" stroke="#5B4BC4" stroke-width="1.4"/>
<path d="M240 1018 C340 1030 440 1036 536 1048" fill="none" stroke="#5B4BC4" stroke-width="1.4"/>
<path d="M240 1104 C340 1098 450 1086 540 1072" fill="none" stroke="#B8375F" stroke-width="1.4"/>
<path d="M240 1106 C360 1102 500 1090 598 1074" fill="none" stroke="#B8375F" stroke-width="1.4"/>
<path d="M240 1108 C380 1106 560 1092 656 1074" fill="none" stroke="#B8375F" stroke-width="1.4"/>

<path d="M436 1046 C520 1010 640 992 738 992" fill="none" stroke="#7A766D" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M496 1046 C580 1016 660 1002 738 1000" fill="none" stroke="#7A766D" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M556 1074 C640 1096 690 1112 738 1122" fill="none" stroke="#7A766D" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M616 1074 C680 1098 706 1112 740 1130" fill="none" stroke="#7A766D" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M676 1074 C712 1094 726 1116 742 1138" fill="none" stroke="#7A766D" stroke-width="1.4" marker-end="url(#ah)"/>

<circle cx="430" cy="1060" r="16" fill="#DCD9D2" stroke="#A8A49B" stroke-width="1.2"/>
<circle cx="490" cy="1060" r="16" fill="#DCD9D2" stroke="#A8A49B" stroke-width="1.2"/>
<circle cx="550" cy="1060" r="16" fill="#DCD9D2" stroke="#A8A49B" stroke-width="1.2"/>
<circle cx="610" cy="1060" r="16" fill="#DCD9D2" stroke="#A8A49B" stroke-width="1.2"/>
<circle cx="670" cy="1060" r="16" fill="#DCD9D2" stroke="#A8A49B" stroke-width="1.2"/>
<text x="550" y="1104" font-size="13" fill="#4A4A4A" text-anchor="middle">spinal interneurons</text>

<ellipse cx="850" cy="990" rx="110" ry="38" fill="#EEEDFE" stroke="#5B4BC4" stroke-width="1.2"/>
<text x="850" y="985" font-size="13" font-weight="700" fill="#2E2870" text-anchor="middle">Lateral motor pools</text>
<text x="850" y="1004" font-size="13" fill="#453C93" text-anchor="middle">distal limb, hand</text>
<ellipse cx="850" cy="1130" rx="110" ry="38" fill="#FBEAF0" stroke="#B8375F" stroke-width="1.2"/>
<text x="850" y="1125" font-size="13" font-weight="700" fill="#7A2843" text-anchor="middle">Medial motor pools</text>
<text x="850" y="1144" font-size="13" fill="#993556" text-anchor="middle">axial, proximal</text>

<rect x="40" y="1176" width="470" height="54" rx="6" fill="#FFFFFF" stroke="#CFCCC4" stroke-width="1"/>
<text x="56" y="1200" font-size="12" fill="#1A1A1A">Direct does not mean one cell per muscle. Cortico-motoneuronal</text>
<text x="56" y="1218" font-size="12" fill="#1A1A1A">cells diverge onto several motor pools.</text>
</svg>
