<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="fig03-title fig03-desc" font-family="Georgia, 'Times New Roman', Times, serif">
<title id="fig03-title">Parallel routes through a recurrent hippocampal system</title>
<desc id="fig03-desc">Circuit schematic. Cortical networks send input to entorhinal layers II and III. Layer II projects to the dentate gyrus and, by a separate route that bypasses it, directly to CA3; layer III projects directly to CA1 and the subiculum. Mossy fibers run from the dentate gyrus to CA3, CA3 has a recurrent loop and sends Schaffer collaterals to CA1, and CA1 projects to the subiculum. CA1 and the subiculum each project separately to the deep entorhinal layers, which project to cortical networks.</desc>
