<rect x="46" y="242" width="176" height="516" rx="58" fill="#EEEAE2" stroke="#B5AB9C" stroke-width="1.5"/>
</g>
<rect x="56" y="252" width="176" height="516" rx="58" fill="#F1EDE5" stroke="#B5AB9C" stroke-width="1.8"/>
<text id="label-cortical-networks" x="144.0" y="503.6" font-size="32" font-weight="bold" text-anchor="middle" fill="#2A2A2A"><tspan x="144.0" dy="0">Cortical</tspan><tspan x="144.0" dy="35.8">networks</tspan></text>
</g>
