<g id="ec-layer-II">
<rect x="350" y="250" width="230" height="152" rx="22" fill="#E7E1D5" stroke="#9C9284" stroke-width="2"/>
<text id="label-ec-layer-II" x="465.0" y="337.2" font-size="31" text-anchor="middle" fill="#2A2A2A"><tspan x="465.0" dy="0">Layer II</tspan></text>
</g>
<g id="ec-layer-III">
<rect x="350" y="418" width="230" height="152" rx="22" fill="#E7E1D5" stroke="#9C9284" stroke-width="2"/>
<text id="label-ec-layer-III" x="465.0" y="505.2" font-size="31" text-anchor="middle" fill="#2A2A2A"><tspan x="465.0" dy="0">Layer III</tspan></text>
</g>
