      <circle cx="585" cy="760" r="28" fill="#E3ECEB" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="585" y="770" font-size="28" font-weight="bold" text-anchor="middle">F</text>
      <circle cx="585" cy="900" r="28" fill="#E3ECEB" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="585" y="910" font-size="28" font-weight="bold" text-anchor="middle">G</text>
    </g>
    <g id="start-ring">
      <circle cx="230" cy="830" r="37" fill="none" stroke="#C08A2B" stroke-width="4.5"/>
      <text x="181" y="838" font-size="24" font-weight="bold" fill="#8A5D12" text-anchor="end">Start</text>
    </g>
    <g id="occupancy-key">
      <text x="110" y="976" font-size="24">Expected future visits</text>
      <rect x="110" y="990" width="300" height="24" fill="url(#ev-key)" stroke="#8E8E8A" stroke-width="1.25"/>
      <text x="110" y="1044" font-size="24">Fewer</text>
      <text x="410" y="1044" font-size="24" text-anchor="end">More</text>
    </g>
    <text x="460" y="1010.0" font-size="24" font-style="italic" fill="#555555">Later visits count less.</text>
  </g>

  <!-- ===================== PANEL C ===================== -->
  <g id="panel-C">
    <text x="814" y="600" font-size="30" font-weight="bold">C: Communities with equally likely next steps</text>
