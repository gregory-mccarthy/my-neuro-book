    <text x="830" y="653" font-size="26" font-weight="bold">Separate illustrative graph</text>
    <!-- community enclosures: background only -->
    <ellipse cx="1050" cy="830" rx="130" ry="140" fill="#EFEFEB"/>
    <ellipse cx="1340" cy="830" rx="130" ry="140" fill="#EFEFEB"/>
    <g id="community-edges" stroke="#8E8E8A" stroke-width="3" stroke-linecap="round">
      <line x1="970" y1="830" x2="1130" y2="830"/>  <!-- 1–2 -->
      <line x1="970" y1="830" x2="1050" y2="735"/>  <!-- 1–3 -->
      <line x1="970" y1="830" x2="1050" y2="925"/>  <!-- 1–4 -->
      <line x1="1130" y1="830" x2="1050" y2="735"/>  <!-- 2–3 -->
      <line x1="1130" y1="830" x2="1050" y2="925"/>  <!-- 2–4 -->
      <line x1="1420" y1="830" x2="1260" y2="830"/>  <!-- 5–6 -->
      <line x1="1420" y1="830" x2="1340" y2="735"/>  <!-- 5–7 -->
      <line x1="1420" y1="830" x2="1340" y2="925"/>  <!-- 5–8 -->
      <line x1="1260" y1="830" x2="1340" y2="735"/>  <!-- 6–7 -->
      <line x1="1260" y1="830" x2="1340" y2="925"/>  <!-- 6–8 -->
      <line x1="1050" y1="735" x2="1340" y2="735"/>  <!-- 3–7 -->
      <line x1="1050" y1="925" x2="1340" y2="925"/>  <!-- 4–8 -->
    </g>
    <g id="community-nodes">
      <circle cx="970" cy="830" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="970" y="839" font-size="26" font-weight="bold" text-anchor="middle">1</text>
      <circle cx="1130" cy="830" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="1130" y="839" font-size="26" font-weight="bold" text-anchor="middle">2</text>
      <circle cx="1050" cy="735" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="1050" y="744" font-size="26" font-weight="bold" text-anchor="middle">3</text>
      <circle cx="1050" cy="925" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="1050" y="934" font-size="26" font-weight="bold" text-anchor="middle">4</text>
      <circle cx="1420" cy="830" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="1420" y="839" font-size="26" font-weight="bold" text-anchor="middle">5</text>
      <circle cx="1260" cy="830" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="1260" y="839" font-size="26" font-weight="bold" text-anchor="middle">6</text>
      <circle cx="1340" cy="735" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="1340" y="744" font-size="26" font-weight="bold" text-anchor="middle">7</text>
      <circle cx="1340" cy="925" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="1340" y="934" font-size="26" font-weight="bold" text-anchor="middle">8</text>
    </g>
    <text x="1050" y="1004" font-size="24" font-style="italic" fill="#555555" text-anchor="middle">Community</text>
    <text x="1340" y="1004" font-size="24" font-style="italic" fill="#555555" text-anchor="middle">Community</text>
    <text x="1195.0" y="1056" font-size="24" text-anchor="middle">Each available next step: <tspan font-size="20" dy="-8">1</tspan><tspan font-size="24" dy="8">/</tspan><tspan font-size="20">3</tspan>.</text>
  </g>
  </g>
</svg>
