<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-labelledby="fig04-title fig04-desc">
  <title id="fig04-title">Relations learned from a sequence</title>
  <desc id="fig04-desc">Three panels. A: an object sequence seen on day 1 was generated by an illustrative seven-node graph that was not shown to the participant; on day 2 a subset of the objects appears in random order during fMRI. B: on the same graph, a model example shades nodes by expected future visits from a start node. C: a separate eight-node graph with two communities in which each available next step has probability one third.</desc>
  <defs>
    <linearGradient id="ev-key" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4F8F7"/>
      <stop offset="1" stop-color="#2F6F6B"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1100" fill="#FFFFFF"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#2B2B2B">

  <!-- ===================== PANEL A ===================== -->
  <g id="panel-A">
    <text x="24" y="50" font-size="30" font-weight="bold">A: A sequence without a visible map</text>
    <!-- Day 1: exposure -->
    <rect x="24" y="74" width="806" height="446" rx="10" fill="none" stroke="#C9C9C4" stroke-width="1.5"/>
    <text x="48" y="112" font-size="26" font-weight="bold">Day 1: exposure</text>
    <text x="806" y="112" font-size="24" font-style="italic" fill="#555555" text-anchor="end">one object at a time</text>
    <g id="exposure-sequence">
      <g>
        <rect x="54.0" y="130" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="79.0" y="164.0" font-size="26" font-weight="bold" text-anchor="middle">A</text>
      </g>
      <g>
        <rect x="112.0" y="130" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="137.0" y="164.0" font-size="26" font-weight="bold" text-anchor="middle">B</text>
      </g>
      <g>
        <rect x="170.0" y="130" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="195.0" y="164.0" font-size="26" font-weight="bold" text-anchor="middle">D</text>
      </g>
      <g>
        <rect x="228.0" y="130" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="253.0" y="164.0" font-size="26" font-weight="bold" text-anchor="middle">C</text>
      </g>
      <g>
        <rect x="286.0" y="130" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="311.0" y="164.0" font-size="26" font-weight="bold" text-anchor="middle">A</text>
      </g>
      <g>
        <rect x="344.0" y="130" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="369.0" y="164.0" font-size="26" font-weight="bold" text-anchor="middle">C</text>
      </g>
      <g>
        <rect x="402.0" y="130" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="427.0" y="164.0" font-size="26" font-weight="bold" text-anchor="middle">D</text>
      </g>
      <g>
        <rect x="460.0" y="130" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="485.0" y="164.0" font-size="26" font-weight="bold" text-anchor="middle">E</text>
      </g>
      <g>
        <rect x="518.0" y="130" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="543.0" y="164.0" font-size="26" font-weight="bold" text-anchor="middle">F</text>
      </g>
      <g>
        <rect x="576.0" y="130" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="601.0" y="164.0" font-size="26" font-weight="bold" text-anchor="middle">G</text>
      </g>
      <g>
        <rect x="634.0" y="130" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="659.0" y="164.0" font-size="26" font-weight="bold" text-anchor="middle">E</text>
      </g>
      <g>
        <rect x="692.0" y="130" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="717.0" y="164.0" font-size="26" font-weight="bold" text-anchor="middle">D</text>
      </g>
      <g>
        <rect x="750.0" y="130" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="775.0" y="164.0" font-size="26" font-weight="bold" text-anchor="middle">B</text>
      </g>
    </g>
    <g id="time-arrow">
      <text x="54.0" y="212" font-size="24">Time</text>
      <line x1="124.0" y1="204" x2="786.0" y2="204" stroke="#555555" stroke-width="2.5"/>
      <polygon points="800.0,204 784.0,196.5 784.0,211.5" fill="#555555"/>
    </g>
    <!-- generating graph (hidden from participant) -->
    <rect x="48" y="232" width="758" height="274" rx="8" fill="none" stroke="#8E8E8A" stroke-width="1.75" stroke-dasharray="9 7"/>
    <text x="68" y="266" font-size="24" font-weight="bold">Illustrative generating graph</text>
    <text x="786" y="266" font-size="24" font-style="italic" fill="#555555" text-anchor="end">Not shown to participant</text>
    <g id="ag-edges-A" stroke="#8E8E8A" stroke-width="3" stroke-linecap="round">
      <line x1="100" y1="390" x2="185" y2="320"/>  <!-- A–B -->
      <line x1="100" y1="390" x2="185" y2="460"/>  <!-- A–C -->
      <line x1="185" y1="320" x2="270" y2="390"/>  <!-- B–D -->
      <line x1="185" y1="460" x2="270" y2="390"/>  <!-- C–D -->
      <line x1="270" y1="390" x2="370" y2="390"/>  <!-- D–E -->
      <line x1="370" y1="390" x2="455" y2="320"/>  <!-- E–F -->
      <line x1="370" y1="390" x2="455" y2="460"/>  <!-- E–G -->
      <line x1="455" y1="320" x2="455" y2="460"/>  <!-- F–G -->
    </g>
    <g id="ag-nodes-A">
      <circle cx="100" cy="390" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="100" y="400" font-size="28" font-weight="bold" text-anchor="middle">A</text>
      <circle cx="185" cy="320" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="185" y="330" font-size="28" font-weight="bold" text-anchor="middle">B</text>
      <circle cx="185" cy="460" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="185" y="470" font-size="28" font-weight="bold" text-anchor="middle">C</text>
      <circle cx="270" cy="390" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="270" y="400" font-size="28" font-weight="bold" text-anchor="middle">D</text>
      <circle cx="370" cy="390" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="370" y="400" font-size="28" font-weight="bold" text-anchor="middle">E</text>
      <circle cx="455" cy="320" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="455" y="330" font-size="28" font-weight="bold" text-anchor="middle">F</text>
      <circle cx="455" cy="460" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="455" y="470" font-size="28" font-weight="bold" text-anchor="middle">G</text>
    </g>
    <g id="link-key">
      <line x1="535" y1="390" x2="575" y2="390" stroke="#8E8E8A" stroke-width="3" stroke-linecap="round"/>
      <text x="587" y="398" font-size="24" font-style="italic" fill="#555555">allowed transition</text>
    </g>
    <!-- Day 2: fMRI test -->
    <rect x="866" y="74" width="710" height="446" rx="10" fill="none" stroke="#C9C9C4" stroke-width="1.5"/>
    <text x="890" y="112" font-size="26" font-weight="bold">Day 2: fMRI test</text>
    <text x="1221.0" y="250" font-size="24" font-style="italic" fill="#555555" text-anchor="middle">Previously seen objects; random order.</text>
    <g id="test-sequence">
      <g>
        <rect x="935.0" y="268" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="960.0" y="302.0" font-size="26" font-weight="bold" text-anchor="middle">G</text>
      </g>
      <g>
        <rect x="993.0" y="268" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="1018.0" y="302.0" font-size="26" font-weight="bold" text-anchor="middle">A</text>
      </g>
      <g>
        <rect x="1051.0" y="268" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="1076.0" y="302.0" font-size="26" font-weight="bold" text-anchor="middle">F</text>
      </g>
      <g>
        <rect x="1109.0" y="268" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="1134.0" y="302.0" font-size="26" font-weight="bold" text-anchor="middle">C</text>
      </g>
      <g>
        <rect x="1167.0" y="268" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="1192.0" y="302.0" font-size="26" font-weight="bold" text-anchor="middle">D</text>
      </g>
      <g>
        <rect x="1225.0" y="268" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="1250.0" y="302.0" font-size="26" font-weight="bold" text-anchor="middle">A</text>
      </g>
      <g>
        <rect x="1283.0" y="268" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="1308.0" y="302.0" font-size="26" font-weight="bold" text-anchor="middle">G</text>
      </g>
      <g>
        <rect x="1341.0" y="268" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="1366.0" y="302.0" font-size="26" font-weight="bold" text-anchor="middle">D</text>
      </g>
      <g>
        <rect x="1399.0" y="268" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="1424.0" y="302.0" font-size="26" font-weight="bold" text-anchor="middle">F</text>
      </g>
      <g>
        <rect x="1457.0" y="268" width="50" height="50" rx="8" fill="#EEEEEB" stroke="#8E8E8A" stroke-width="1.5"/>
        <text x="1482.0" y="302.0" font-size="26" font-weight="bold" text-anchor="middle">C</text>
      </g>
    </g>
    <!-- bracket marks one successive pair (preceding item, current item) -->
    <path d="M1171.0,330 V344 H1271.0 V330" fill="none" stroke="#2F6F6B" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="1221.0" y1="344" x2="1221.0" y2="356" stroke="#2F6F6B" stroke-width="2.5"/>
    <text x="1221.0" y="392" font-size="26" fill="#2F6F6B" text-anchor="middle">BOLD adaptation tests learned relations.</text>
  </g>

  <line id="divider-B-C" x1="792" y1="570" x2="792" y2="1080" stroke="#C9C9C4" stroke-width="1.5"/>

  <!-- ===================== PANEL B ===================== -->
  <!-- Fills are calculated model output (expected future visits from A, gamma = 0.7); not BOLD, reward, or firing. -->
  <g id="panel-B">
    <text x="24" y="600" font-size="30" font-weight="bold">B: Prediction extends beyond the next item</text>
    <rect x="24" y="622" width="236" height="44" rx="6" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
    <text x="40" y="653" font-size="26" font-weight="bold">Model example</text>
    <g id="ag-edges-B" stroke="#8E8E8A" stroke-width="3" stroke-linecap="round">
      <line x1="230" y1="830" x2="315" y2="760"/>  <!-- A–B -->
      <line x1="230" y1="830" x2="315" y2="900"/>  <!-- A–C -->
      <line x1="315" y1="760" x2="400" y2="830"/>  <!-- B–D -->
      <line x1="315" y1="900" x2="400" y2="830"/>  <!-- C–D -->
      <line x1="400" y1="830" x2="500" y2="830"/>  <!-- D–E -->
      <line x1="500" y1="830" x2="585" y2="760"/>  <!-- E–F -->
      <line x1="500" y1="830" x2="585" y2="900"/>  <!-- E–G -->
      <line x1="585" y1="760" x2="585" y2="900"/>  <!-- F–G -->
    </g>
    <g id="ag-nodes-B">
      <circle cx="230" cy="830" r="28" fill="#6A9895" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="230" y="840" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A</text>
      <circle cx="315" cy="760" r="28" fill="#2F6F6B" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="315" y="770" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">B</text>
      <circle cx="315" cy="900" r="28" fill="#2F6F6B" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="315" y="910" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">C</text>
      <circle cx="400" cy="830" r="28" fill="#5F918D" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="400" y="840" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">D</text>
      <circle cx="500" cy="830" r="28" fill="#C6D8D6" stroke="#2B2B2B" stroke-width="1.75"/>
