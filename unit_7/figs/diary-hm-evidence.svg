<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 2165" width="1800" height="2165" role="img" aria-labelledby="f04-title f04-desc">
  <title id="f04-title">Remote knowledge does not establish an intact remote autobiography</title>
  <desc id="f04-desc">Three panels separate H.M.'s anatomy, observations, and inference. A shows an original bilateral regional summary of broad anterior medial-temporal injury, residual posterior hippocampus, and substantial posterior parahippocampal sparing. A clinical strip contrasts profound new-event memory impairment with preserved immediate retention and established knowledge. B places an early report of apparently preserved older memories beside a later assessment distinguishing relatively spared remote personal semantic knowledge from severely impaired autobiographical episodic detail, with an airplane flight at age fifteen as a surviving example. The arrow marks publication order. C places questions about rich event-specific recollection and hippocampal independence between observed knowledge sparing and the stronger claim of detailed recollection without hippocampal support. A note identifies relevant findings in other patients and H.M.'s later pathology.</desc>
  <!-- All-vector figure. The medial-temporal drawing is an original nonquantitative bilateral regional summary informed by Annese et al. (2014); it is not a tracing, measurement, or reproduced section. -->
  <defs>
    <pattern id="f04-injury-hatch" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(45)"><rect id="f04-injury-hatch-ground" width="20" height="20" fill="#F5E8D5"/><line id="f04-injury-hatch-line" x1="0" y1="0" x2="0" y2="20" stroke="#B77A2B" stroke-width="2.2"/></pattern>
    <clipPath id="f04-region-clip"><path id="f04-region-clip-path" d="M128,478 C128,400 210,335 330,322 C470,308 620,312 760,318 C880,322 950,300 1000,250 C1035,212 1055,170 1090,168 C1125,166 1150,200 1152,250 C1155,330 1150,410 1110,465 C1060,530 970,565 860,575 C700,592 480,604 330,594 C210,586 128,552 128,478 Z"/></clipPath>
  </defs>
  <rect id="f04-page-background" width="1800" height="2165" fill="#FFFFFF"/>
  <g id="f04-figure-content" font-family="Georgia, 'Times New Roman', serif" fill="#2B2B2B">
    <g id="f04-panel-A">
    <text id="f04-A-heading" x="60" y="65" font-size="36" font-weight="bold">A: Broad injury, posterior tissue remaining</text>
    <text id="f04-A-schematic-label" x="60" y="112" font-size="28" font-style="italic" fill="#666663">Both medial temporal lobes — regional schematic</text>
    <g id="f04-A-anatomy">
      <path id="f04-A-region" d="M128,478 C128,400 210,335 330,322 C470,308 620,312 760,318 C880,322 950,300 1000,250 C1035,212 1055,170 1090,168 C1125,166 1150,200 1152,250 C1155,330 1150,410 1110,465 C1060,530 970,565 860,575 C700,592 480,604 330,594 C210,586 128,552 128,478 Z" fill="#FAFAF8" stroke="#BDBDB8" stroke-width="2.5"/>
      <g id="f04-A-injury" clip-path="url(#f04-region-clip)">
        <path id="f04-A-injury-zone" d="M100,140 L590,140 C600,250 588,330 600,420 C610,500 640,560 662,630 L100,630 Z" fill="url(#f04-injury-hatch)"/>
        <path id="f04-A-injury-edge" d="M590,140 C600,250 588,330 600,420 C610,500 640,560 662,630" fill="none" stroke="#B77A2B" stroke-width="2" stroke-dasharray="7 6"/>
      </g>
      <path id="f04-A-region-outline" d="M128,478 C128,400 210,335 330,322 C470,308 620,312 760,318 C880,322 950,300 1000,250 C1035,212 1055,170 1090,168 C1125,166 1150,200 1152,250 C1155,330 1150,410 1110,465 C1060,530 970,565 860,575 C700,592 480,604 330,594 C210,586 128,552 128,478 Z" fill="none" stroke="#BDBDB8" stroke-width="2.5"/>
      <g id="f04-A-parahippocampal" fill="none" stroke-linecap="round">
        <path id="f04-A-parahippocampal-outline" d="M668,508 C780,513 905,510 985,482 C1058,456 1098,404 1108,338" stroke="#2F6F6B" stroke-width="56"/>
        <path id="f04-A-parahippocampal-fill" d="M668,508 C780,513 905,510 985,482 C1058,456 1098,404 1108,338" stroke="#EDF4F3" stroke-width="51"/>
      </g>
      <g id="f04-A-hippocampus" fill="none" stroke-linecap="round">
        <path id="f04-A-hippocampus-outline" d="M652,420 C760,422 880,426 950,396 C1010,368 1045,300 1063,216" stroke="#2F6F6B" stroke-width="44"/>
        <path id="f04-A-hippocampus-fill" d="M652,420 C760,422 880,426 950,396 C1010,368 1045,300 1063,216" stroke="#CFE2DF" stroke-width="39"/>
      </g>
    </g>
    <text id="f04-A-orient-anterior" x="128" y="642" font-size="28" font-style="italic" fill="#666663">Anterior</text>
    <text id="f04-A-orient-posterior" x="1132" y="642" font-size="28" text-anchor="end" font-style="italic" fill="#666663">Posterior</text>
    <text id="f04-A-orient-dorsal" x="1090" y="150" font-size="28" text-anchor="middle" font-style="italic" fill="#666663">Dorsal</text>
    <text id="f04-A-injury-label" x="110" y="172" font-size="28" font-weight="bold">Broad bilateral medial-temporal injury</text>
    <text id="f04-A-injury-scope" x="110" y="208" font-size="28"><tspan id="f04-A-injury-scope-1" x="110">Medial temporal pole</tspan><tspan id="f04-A-injury-scope-2" x="110" dy="34">Much of amygdala and entorhinal cortex</tspan><tspan id="f04-A-injury-scope-3" x="110" dy="34">Anterior hippocampal formation</tspan></text>
    <g id="f04-A-leader-injury"><line id="f04-A-leader-injury-line" x1="330" y1="290" x2="330" y2="440" stroke="#8A8A85" stroke-width="2"/><circle id="f04-A-leader-injury-dot" cx="330" cy="440" r="4" fill="#8A8A85"/></g>
    <text id="f04-A-hippocampus-label" x="1185" y="262" font-size="28" font-weight="bold">Residual posterior hippocampus</text>
    <g id="f04-A-leader-hippocampus"><line id="f04-A-leader-hippocampus-line" x1="1175" y1="253" x2="1053" y2="261" stroke="#8A8A85" stroke-width="2"/><circle id="f04-A-leader-hippocampus-dot" cx="1053" cy="261" r="4" fill="#8A8A85"/></g>
    <text id="f04-A-parahippocampal-label" x="1185" y="432" font-size="28" font-weight="bold"><tspan id="f04-A-parahippocampal-label-1" x="1185">Substantial posterior</tspan><tspan id="f04-A-parahippocampal-label-2" x="1185" dy="34">parahippocampal sparing</tspan></text>
    <g id="f04-A-leader-parahippocampal"><line id="f04-A-leader-parahippocampal-line" x1="1175" y1="440" x2="1096" y2="391" stroke="#8A8A85" stroke-width="2"/><circle id="f04-A-leader-parahippocampal-dot" cx="1096" cy="391" r="4" fill="#8A8A85"/></g>
    <g id="f04-A-key">
      <rect id="f04-A-key-injury-swatch" x="60" y="668" width="46" height="30" fill="url(#f04-injury-hatch)" stroke="#B77A2B" stroke-width="1.5"/>
      <text id="f04-A-key-injury-text" x="120" y="692" font-size="26">Ochre hatching: broad injury region</text>
      <rect id="f04-A-key-tissue-swatch" x="600" y="668" width="46" height="30" rx="8" fill="#CFE2DF" stroke="#2F6F6B" stroke-width="2.5"/>
      <text id="f04-A-key-tissue-text" x="660" y="692" font-size="26">Teal outlines: tissue remaining</text>
    </g>
    <text id="f04-A-source-anatomy" x="1740" y="692" font-size="26" text-anchor="end" fill="#666663">Annese et al., 2014</text>
    <text id="f04-A-scope" x="60" y="734" font-size="28" font-style="italic">Schematic anatomy; remaining tissue does not establish normal function.</text>
    <g id="f04-A-dissociation">
      <rect id="f04-A-dissociation-band" x="60" y="770" width="1680" height="136" rx="8" fill="#F5F5F2"/>
      <text id="f04-A-dissociation-heading" x="90" y="814" font-size="28" font-weight="bold">Established dissociation</text>
      <text id="f04-A-dissociation-source" x="1710" y="814" font-size="26" text-anchor="end" fill="#666663">Scoville &amp; Milner, 1957</text>
      <text id="f04-A-dissociation-impaired" x="90" y="852" font-size="28">New event memory: profoundly impaired</text>
      <text id="f04-A-dissociation-retained" x="90" y="888" font-size="28">Immediate retention with sustained attention and much established knowledge remained.</text>
    </g>
    </g>
    <line id="f04-divider-AB" x1="60" y1="946" x2="1740" y2="946" stroke="#D9D9D4" stroke-width="2"/>
    <g id="f04-panel-B">
    <text id="f04-B-heading" x="60" y="1006" font-size="36" font-weight="bold">B: What did the reports measure?</text>
    <g id="f04-B-early-card">
      <rect id="f04-B-early-box" x="60" y="1068" width="730" height="437" rx="8" fill="#FFFFFF" stroke="#BDBDB8" stroke-width="2"/>
      <text id="f04-B-early-heading" x="90" y="1124" font-size="30" font-weight="bold">Early report · 1957</text>
      <text id="f04-B-early-main" x="90" y="1200" font-size="30"><tspan id="f04-B-early-main-1" x="90">Older memories described as</tspan><tspan id="f04-B-early-main-2" x="90" dy="40">apparently preserved</tspan></text>
      <text id="f04-B-early-descriptor" x="90" y="1304" font-size="28" font-style="italic" fill="#666663">Broad clinical observations</text>
      <text id="f04-B-early-source" x="90" y="1479" font-size="26" fill="#666663">Scoville &amp; Milner</text>
    </g>
    <g id="f04-B-later-card">
      <rect id="f04-B-later-box" x="1010" y="1068" width="730" height="437" rx="8" fill="#FFFFFF" stroke="#BDBDB8" stroke-width="2"/>
      <text id="f04-B-later-heading" x="1040" y="1124" font-size="30" font-weight="bold">Later assessment · reported 2005</text>
      <line id="f04-B-later-rule-top" x1="1040" y1="1152" x2="1710" y2="1152" stroke="#D9D9D4" stroke-width="1.5"/>
      <text id="f04-B-later-row1-label" x="1040" y="1192" font-size="28"><tspan id="f04-B-later-row1-label-1" x="1040">Remote personal</tspan><tspan id="f04-B-later-row1-label-2" x="1040" dy="34">semantic knowledge</tspan></text>
      <text id="f04-B-later-row1-finding" x="1420" y="1209" font-size="28" font-weight="bold">Relatively spared</text>
      <line id="f04-B-later-rule-mid" x1="1040" y1="1250" x2="1710" y2="1250" stroke="#D9D9D4" stroke-width="1.5"/>
      <text id="f04-B-later-row2-label" x="1040" y="1290" font-size="28"><tspan id="f04-B-later-row2-label-1" x="1040">Autobiographical</tspan><tspan id="f04-B-later-row2-label-2" x="1040" dy="34">episodic detail</tspan></text>
      <text id="f04-B-later-row2-finding" x="1420" y="1307" font-size="28" font-weight="bold">Severely impaired</text>
      <line id="f04-B-later-rule-bottom" x1="1040" y1="1348" x2="1710" y2="1348" stroke="#D9D9D4" stroke-width="1.5"/>
      <text id="f04-B-later-residual" x="1040" y="1396" font-size="28" font-style="italic"><tspan id="f04-B-later-residual-1" x="1040">Some specific recollection remained:</tspan><tspan id="f04-B-later-residual-2" x="1040" dy="34">an airplane flight at age fifteen.</tspan></text>
      <text id="f04-B-later-source" x="1040" y="1479" font-size="26" fill="#666663">Steinvorth, Levine &amp; Corkin</text>
    </g>
    <text id="f04-B-order-label" x="900" y="1246" font-size="28" text-anchor="middle"><tspan id="f04-B-order-label-1" x="900">Order of</tspan><tspan id="f04-B-order-label-2" x="900" dy="34">reports</tspan></text>
    <g id="f04-B-order-arrow"><line id="f04-B-order-arrow-line" x1="806" y1="1296" x2="979" y2="1296" stroke="#2B2B2B" stroke-width="2.5"/><polygon id="f04-B-order-arrow-head" points="994,1296 978,1288 978,1304" fill="#2B2B2B"/></g>
    <text id="f04-B-note" x="60" y="1561" font-size="28" font-style="italic">Publication sequence; the assessments used different measures.</text>
    </g>
    <line id="f04-divider-BC" x1="60" y1="1605" x2="1740" y2="1605" stroke="#D9D9D4" stroke-width="2"/>
    <g id="f04-panel-C">
    <text id="f04-C-heading" x="60" y="1665" font-size="36" font-weight="bold">C: What would justify the stronger inference?</text>
    <g id="f04-C-observed">
      <rect id="f04-C-observed-box" x="60" y="1721" width="440" height="240" rx="8" fill="#FFFFFF" stroke="#BDBDB8" stroke-width="2"/>
      <text id="f04-C-observed-heading" x="280" y="1827" font-size="30" text-anchor="middle" font-weight="bold">Observed sparing</text>
      <text id="f04-C-observed-main" x="280" y="1875" font-size="28" text-anchor="middle">Remote personal knowledge</text>
    </g>
    <g id="f04-C-gate">
      <rect id="f04-C-gate-box" x="620" y="1721" width="560" height="240" rx="10" fill="#FBF3E7" stroke="#B77A2B" stroke-width="2.5"/>
      <text id="f04-C-gate-heading" x="900" y="1769" font-size="30" text-anchor="middle" font-weight="bold">Additional evidence needed</text>
      <rect id="f04-C-gate-question-1-box" x="652" y="1791" width="496" height="66" rx="6" fill="#FFFFFF" stroke="#B77A2B" stroke-width="1.5"/>
      <text id="f04-C-gate-question-1" x="900" y="1834" font-size="28" text-anchor="middle">Rich, event-specific recollection?</text>
      <rect id="f04-C-gate-question-2-box" x="652" y="1871" width="496" height="66" rx="6" fill="#FFFFFF" stroke="#B77A2B" stroke-width="1.5"/>
      <text id="f04-C-gate-question-2" x="900" y="1914" font-size="28" text-anchor="middle">Hippocampal independence?</text>
    </g>
    <g id="f04-C-claim">
      <rect id="f04-C-claim-box" x="1300" y="1721" width="440" height="240" rx="8" fill="#FFFFFF" stroke="#BDBDB8" stroke-width="2"/>
      <text id="f04-C-claim-heading" x="1520" y="1807" font-size="30" text-anchor="middle" font-weight="bold">Stronger claim</text>
      <text id="f04-C-claim-main" x="1520" y="1855" font-size="28" text-anchor="middle"><tspan id="f04-C-claim-main-1" x="1520">Detailed remote recollection</tspan><tspan id="f04-C-claim-main-2" x="1520" dy="34">without hippocampal support</tspan></text>
    </g>
    <g id="f04-C-arrow-observed-to-gate"><line id="f04-C-arrow-observed-to-gate-line" x1="504" y1="1841" x2="599" y2="1841" stroke="#2B2B2B" stroke-width="2.5"/><polygon id="f04-C-arrow-observed-to-gate-head" points="614,1841 598,1833 598,1849" fill="#2B2B2B"/></g>
    <g id="f04-C-arrow-gate-to-claim"><line id="f04-C-arrow-gate-to-claim-line" x1="1186" y1="1841" x2="1279" y2="1841" stroke="#2B2B2B" stroke-width="2.5" stroke-dasharray="10 7"/><polygon id="f04-C-arrow-gate-to-claim-head" points="1294,1841 1278,1833 1278,1849" fill="#2B2B2B"/></g>
    <g id="f04-C-key"><line id="f04-C-key-line" x1="1101.3" y1="2000" x2="1156.3" y2="2000" stroke="#2B2B2B" stroke-width="2.5" stroke-dasharray="10 7"/><polygon id="f04-C-key-head" points="1171.3,2000 1155.3,1992 1155.3,2008" fill="#2B2B2B"/></g>
    <text id="f04-C-key-text" x="1740" y="2009" font-size="26" text-anchor="end">Dashed connector: inference requiring evidence</text>
    <text id="f04-C-comparison-note" x="60" y="2063" font-size="28"><tspan id="f04-C-comparison-note-1" x="60">Other patients retained detailed remote recollection.</tspan><tspan id="f04-C-comparison-note-2" x="60" dy="34">Later pathology also complicates H.M.’s interpretation.</tspan></text>
    <text id="f04-C-comparison-source" x="1740" y="2097" font-size="26" text-anchor="end" fill="#666663">Kirwan et al., 2008</text>
    </g>
  </g>
</svg>
