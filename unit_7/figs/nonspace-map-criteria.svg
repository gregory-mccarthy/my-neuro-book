<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1462" width="1600" height="1462" role="img" aria-labelledby="fig01-title fig01-desc">
  <title id="fig01-title">What the novel comparison tests</title>
  <desc id="fig01-desc">A: four trained pairs (A rewarded over B, B over C, C over D, D over E), shown as separate cards with reward signs attached to each pair, then a later novel comparison of B with D, and a table: sham-operated controls and hippocampal-pallium lesion fish both learned the premises; controls preferred B, while transfer was impaired after lesions. B: one candidate ordering A &gt; B &gt; C &gt; D &gt; E that predicts B over D, beside four separate pair-specific association cards. C: a two-column guide matching evidence types to the questions they address, with behavioral transfer and circuit perturbation highlighted.</desc>
  <rect id="page-background" width="1600" height="1462" fill="#FFFFFF"/>
  <g id="figure-content" font-family="Georgia, 'Times New Roman', serif" fill="#2B2B2B">

  <!-- ===================== PANEL A ===================== -->
  <g id="panel-A">
    <text id="A-heading" x="24" y="50" font-size="30" font-weight="bold">A: Trained choices and a new comparison</text>
    <g id="A-task-label">
      <rect x="692.91" y="19" width="193.55" height="44" rx="6" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="708.91" y="49" font-size="24" font-weight="bold">Goldfish task</text>
    </g>
    <g id="A-training-group">
      <rect id="A-training-frame" x="24" y="76" width="984" height="262" rx="10" fill="none" stroke="#C9C9C4" stroke-width="1.5"/>
      <text id="A-trained-heading" x="48" y="112" font-size="26" font-weight="bold">Trained pairs</text>
      <g id="A-card-1">  <!-- separate pair; not a sequence of steps -->
        <rect x="46" y="128" width="220" height="142" rx="8" fill="#FFFFFF" stroke="#C9C9C4" stroke-width="1.5"/>
        <g id="A-card1-token-A">
          <circle cx="106" cy="180" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
          <text x="106" y="190.5" font-size="30" font-weight="bold" text-anchor="middle">A</text>
        </g>
        <text id="A-card1-sign-A" x="106" y="251" font-size="32" font-weight="bold" text-anchor="middle">+</text>
        <g id="A-card1-token-B">
          <circle cx="206" cy="180" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
          <text x="206" y="190.5" font-size="30" font-weight="bold" text-anchor="middle">B</text>
        </g>
        <text id="A-card1-sign-B" x="206" y="251" font-size="32" font-weight="bold" text-anchor="middle">−</text>
      </g>
      <g id="A-card-2">  <!-- separate pair; not a sequence of steps -->
        <rect x="286" y="128" width="220" height="142" rx="8" fill="#FFFFFF" stroke="#C9C9C4" stroke-width="1.5"/>
        <g id="A-card2-token-C">
          <circle cx="346" cy="180" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
          <text x="346" y="190.5" font-size="30" font-weight="bold" text-anchor="middle">C</text>
        </g>
        <text id="A-card2-sign-C" x="346" y="251" font-size="32" font-weight="bold" text-anchor="middle">−</text>
        <g id="A-card2-token-B">
          <circle cx="446" cy="180" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
          <text x="446" y="190.5" font-size="30" font-weight="bold" text-anchor="middle">B</text>
        </g>
        <text id="A-card2-sign-B" x="446" y="251" font-size="32" font-weight="bold" text-anchor="middle">+</text>
      </g>
      <g id="A-card-3">  <!-- separate pair; not a sequence of steps -->
        <rect x="526" y="128" width="220" height="142" rx="8" fill="#FFFFFF" stroke="#C9C9C4" stroke-width="1.5"/>
        <g id="A-card3-token-C">
          <circle cx="586" cy="180" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
          <text x="586" y="190.5" font-size="30" font-weight="bold" text-anchor="middle">C</text>
        </g>
        <text id="A-card3-sign-C" x="586" y="251" font-size="32" font-weight="bold" text-anchor="middle">+</text>
        <g id="A-card3-token-D">
          <circle cx="686" cy="180" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
          <text x="686" y="190.5" font-size="30" font-weight="bold" text-anchor="middle">D</text>
        </g>
        <text id="A-card3-sign-D" x="686" y="251" font-size="32" font-weight="bold" text-anchor="middle">−</text>
      </g>
      <g id="A-card-4">  <!-- separate pair; not a sequence of steps -->
        <rect x="766" y="128" width="220" height="142" rx="8" fill="#FFFFFF" stroke="#C9C9C4" stroke-width="1.5"/>
        <g id="A-card4-token-E">
          <circle cx="826" cy="180" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
          <text x="826" y="190.5" font-size="30" font-weight="bold" text-anchor="middle">E</text>
        </g>
        <text id="A-card4-sign-E" x="826" y="251" font-size="32" font-weight="bold" text-anchor="middle">−</text>
        <g id="A-card4-token-D">
          <circle cx="926" cy="180" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
          <text x="926" y="190.5" font-size="30" font-weight="bold" text-anchor="middle">D</text>
        </g>
        <text id="A-card4-sign-D" x="926" y="251" font-size="32" font-weight="bold" text-anchor="middle">+</text>
      </g>
      <text id="A-sign-key" x="48" y="312" font-size="24"><tspan font-weight="bold">+</tspan> rewarded in this pair; <tspan font-weight="bold">−</tspan> not rewarded</text>
    </g>
    <g id="A-later-test-arrow">
      <line x1="1016" y1="180" x2="1110" y2="180" stroke="#4A4A4A" stroke-width="2.5"/>
      <polygon points="1124,180 1108,172.5 1108,187.5" fill="#4A4A4A"/>
      <text id="A-later-test-label" x="1070" y="166" font-size="24" font-style="italic" text-anchor="middle">Later test</text>
    </g>
    <g id="A-novel-card">  <!-- no reward signs, winner marks or food symbols -->
      <rect x="1132" y="96" width="444" height="174" rx="8" fill="#FFFFFF" stroke="#B77A2B" stroke-width="2.5"/>
      <text id="A-novel-heading" x="1354" y="134" font-size="24" font-weight="bold" fill="#8A5D12" text-anchor="middle">Novel comparison</text>
      <g id="A-novel-token-B">
        <circle cx="1279" cy="200" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
        <text x="1279" y="210.5" font-size="30" font-weight="bold" text-anchor="middle">B</text>
      </g>
      <g id="A-novel-token-D">
        <circle cx="1429" cy="200" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
        <text x="1429" y="210.5" font-size="30" font-weight="bold" text-anchor="middle">D</text>
      </g>
    </g>
    <text id="A-novel-note-1" x="1354" y="304" font-size="24" font-style="italic" fill="#555555" text-anchor="middle">Both items have rewarded and</text>
    <text id="A-novel-note-2" x="1354" y="334" font-size="24" font-style="italic" fill="#555555" text-anchor="middle">unrewarded training roles.</text>
    <g id="A-outcome-table">
      <text id="A-outcome-heading" x="24" y="400" font-size="26" font-weight="bold">Reported outcome</text>
      <line x1="24" y1="418" x2="1576" y2="418" stroke="#2B2B2B" stroke-width="2"/>
      <text x="40" y="452" font-size="24" font-weight="bold">Group</text>
      <text x="560" y="452" font-size="24" font-weight="bold">Premise learning</text>
      <text x="900" y="452" font-size="24" font-weight="bold">Novel B–D comparison</text>
      <line x1="24" y1="468" x2="1576" y2="468" stroke="#2B2B2B" stroke-width="1.5"/>
      <g id="A-outcome-row-1">
        <text x="40" y="503" font-size="24">Sham-operated controls</text>
        <text x="560" y="503" font-size="24">Learned</text>
        <text x="900" y="503" font-size="24">B preferred</text>
      </g>
      <line x1="24" y1="520" x2="1576" y2="520" stroke="#C9C9C4" stroke-width="1.25"/>
      <g id="A-outcome-row-2">
        <text x="40" y="555" font-size="24">Hippocampal-pallium lesions</text>
        <text x="560" y="555" font-size="24">Learned</text>
        <text x="900" y="555" font-size="24">Transfer impaired</text>
      </g>
      <line x1="24" y1="572" x2="1576" y2="572" stroke="#2B2B2B" stroke-width="2"/>
    </g>
  </g>

  <!-- ===================== PANEL B ===================== -->
  <!-- Explanatory drawings, not neural measurements. -->
  <g id="panel-B">
    <text id="B-heading" x="24" y="650" font-size="30" font-weight="bold">B: What representation could support transfer?</text>
    <g id="B-candidate-ordering">
      <text id="B-ordering-heading" x="48" y="704" font-size="26" font-weight="bold">One candidate ordering</text>
      <g id="B-order-token-A">
        <circle cx="110" cy="776" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
        <text x="110" y="786.5" font-size="30" font-weight="bold" text-anchor="middle">A</text>
      </g>
      <text id="B-order-gt-1" x="175" y="788" font-size="36" text-anchor="middle">&gt;</text>
      <g id="B-order-token-B">
        <circle cx="240" cy="776" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
        <text x="240" y="786.5" font-size="30" font-weight="bold" text-anchor="middle">B</text>
      </g>
      <text id="B-order-gt-2" x="305" y="788" font-size="36" text-anchor="middle">&gt;</text>
      <g id="B-order-token-C">
        <circle cx="370" cy="776" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
        <text x="370" y="786.5" font-size="30" font-weight="bold" text-anchor="middle">C</text>
      </g>
      <text id="B-order-gt-3" x="435" y="788" font-size="36" text-anchor="middle">&gt;</text>
      <g id="B-order-token-D">
        <circle cx="500" cy="776" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
        <text x="500" y="786.5" font-size="30" font-weight="bold" text-anchor="middle">D</text>
      </g>
      <text id="B-order-gt-4" x="565" y="788" font-size="36" text-anchor="middle">&gt;</text>
      <g id="B-order-token-E">
        <circle cx="630" cy="776" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
        <text x="630" y="786.5" font-size="30" font-weight="bold" text-anchor="middle">E</text>
      </g>
      <path id="B-bracket-B-to-D" d="M240,822 V836 H500 V822" fill="none" stroke="#555555" stroke-width="2.25" stroke-linejoin="round"/>
      <line id="B-bracket-tick" x1="370" y1="836" x2="370" y2="846" stroke="#555555" stroke-width="2.25"/>
      <text id="B-ordering-prediction" x="370" y="876" font-size="24" text-anchor="middle">Predicts B over D</text>
    </g>
    <line id="B-group-divider" x1="800" y1="676" x2="800" y2="900" stroke="#C9C9C4" stroke-width="1.5"/>
    <g id="B-pair-records">  <!-- unconnected pair records; not a fitted associative model -->
      <text id="B-pairs-heading" x="840" y="704" font-size="26" font-weight="bold">Pair-specific associations</text>
      <g id="B-pair-AB">
        <rect x="840" y="724" width="340" height="80" rx="8" fill="#FFFFFF" stroke="#C9C9C4" stroke-width="1.5"/>
        <g id="B-pairAB-token-A">
          <circle cx="904" cy="764" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
          <text x="904" y="774.5" font-size="30" font-weight="bold" text-anchor="middle">A</text>
        </g>
        <text id="B-pairAB-over" x="1010" y="772" font-size="24" font-style="italic" text-anchor="middle">over</text>
        <g id="B-pairAB-token-B">
          <circle cx="1116" cy="764" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
          <text x="1116" y="774.5" font-size="30" font-weight="bold" text-anchor="middle">B</text>
        </g>
      </g>
      <g id="B-pair-BC">
        <rect x="1200" y="724" width="340" height="80" rx="8" fill="#FFFFFF" stroke="#C9C9C4" stroke-width="1.5"/>
        <g id="B-pairBC-token-B">
          <circle cx="1264" cy="764" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
          <text x="1264" y="774.5" font-size="30" font-weight="bold" text-anchor="middle">B</text>
        </g>
        <text id="B-pairBC-over" x="1370" y="772" font-size="24" font-style="italic" text-anchor="middle">over</text>
        <g id="B-pairBC-token-C">
          <circle cx="1476" cy="764" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
          <text x="1476" y="774.5" font-size="30" font-weight="bold" text-anchor="middle">C</text>
        </g>
      </g>
      <g id="B-pair-CD">
        <rect x="840" y="820" width="340" height="80" rx="8" fill="#FFFFFF" stroke="#C9C9C4" stroke-width="1.5"/>
        <g id="B-pairCD-token-C">
          <circle cx="904" cy="860" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
          <text x="904" y="870.5" font-size="30" font-weight="bold" text-anchor="middle">C</text>
        </g>
        <text id="B-pairCD-over" x="1010" y="868" font-size="24" font-style="italic" text-anchor="middle">over</text>
        <g id="B-pairCD-token-D">
          <circle cx="1116" cy="860" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
          <text x="1116" y="870.5" font-size="30" font-weight="bold" text-anchor="middle">D</text>
        </g>
      </g>
      <g id="B-pair-DE">
        <rect x="1200" y="820" width="340" height="80" rx="8" fill="#FFFFFF" stroke="#C9C9C4" stroke-width="1.5"/>
        <g id="B-pairDE-token-D">
          <circle cx="1264" cy="860" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
          <text x="1264" y="870.5" font-size="30" font-weight="bold" text-anchor="middle">D</text>
        </g>
        <text id="B-pairDE-over" x="1370" y="868" font-size="24" font-style="italic" text-anchor="middle">over</text>
        <g id="B-pairDE-token-E">
          <circle cx="1476" cy="860" r="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
          <text x="1476" y="870.5" font-size="30" font-weight="bold" text-anchor="middle">E</text>
        </g>
      </g>
    </g>
    <text id="B-format-note" x="800" y="952" font-size="24" font-style="italic" fill="#555555" text-anchor="middle">The internal format remains an explanatory question.</text>
  </g>

  <!-- ===================== PANEL C ===================== -->
  <!-- A guide to evidence types, not an inventory of methods used or absent in the study; rows are not a ladder. -->
  <g id="panel-C">
    <text id="C-heading" x="24" y="1030" font-size="30" font-weight="bold">C: Different evidence, different questions</text>
    <g id="C-evidence-matrix">
      <line x1="24" y1="1052" x2="1576" y2="1052" stroke="#2B2B2B" stroke-width="2"/>
      <text x="48" y="1086" font-size="24" font-weight="bold">Evidence</text>
      <text x="560" y="1086" font-size="24" font-weight="bold">Question addressed</text>
      <line x1="24" y1="1102" x2="1576" y2="1102" stroke="#2B2B2B" stroke-width="1.5"/>
      <g id="C-row-behavioral-transfer">
        <rect x="24" y="1102" width="1552" height="54" fill="#E6EFEE"/>
        <rect x="24" y="1102" width="7" height="54" fill="#2F6F6B"/>
        <text x="48" y="1138" font-size="24">Behavioral transfer</text>
        <text x="560" y="1138" font-size="24">Can learning support a new comparison?</text>
      </g>
      <line x1="24" y1="1156" x2="1576" y2="1156" stroke="#C9C9C4" stroke-width="1.25"/>
      <g id="C-row-direct-neural-recording">
        <text x="48" y="1192" font-size="24">Direct neural recording</text>
        <text x="560" y="1192" font-size="24">What activity distinguishes the relevant states?</text>
      </g>
      <line x1="24" y1="1210" x2="1576" y2="1210" stroke="#C9C9C4" stroke-width="1.25"/>
      <g id="C-row-population-or-fmri-geometry">
        <text x="48" y="1246" font-size="24">Population or fMRI geometry</text>
        <text x="560" y="1246" font-size="24">Does activity follow a specified relational model?</text>
      </g>
      <line x1="24" y1="1264" x2="1576" y2="1264" stroke="#C9C9C4" stroke-width="1.25"/>
      <g id="C-row-computational-model">
        <text x="48" y="1300" font-size="24">Computational model</text>
        <text x="560" y="1300" font-size="24">Which assumptions generate the predictions?</text>
      </g>
      <line x1="24" y1="1318" x2="1576" y2="1318" stroke="#C9C9C4" stroke-width="1.25"/>
      <g id="C-row-circuit-perturbation">
        <rect x="24" y="1318" width="1552" height="54" fill="#E6EFEE"/>
        <rect x="24" y="1318" width="7" height="54" fill="#2F6F6B"/>
        <text x="48" y="1354" font-size="24">Circuit perturbation</text>
        <text x="560" y="1354" font-size="24">Does disrupting a circuit impair that use?</text>
      </g>
      <line x1="24" y1="1372" x2="1576" y2="1372" stroke="#2B2B2B" stroke-width="2"/>
    </g>
    <g id="C-highlight-key">
      <rect x="24" y="1404" width="44" height="28" fill="#E6EFEE"/>
      <rect x="24" y="1404" width="7" height="28" fill="#2F6F6B"/>
      <text x="82" y="1426" font-size="24">Highlighted: the behavioral and lesion contrasts summarized in A.</text>
    </g>
  </g>
  </g>
</svg>
