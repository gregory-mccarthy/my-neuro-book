      <text x="712" y="1144" font-size="24">Compare N’s attack with A’s defense</text>
      <text x="712" y="1184" font-size="24" font-weight="bold">Worked answer: N wins.</text>
    </g>
  </g>

  <!-- ===================== PANEL C ===================== -->
  <!-- Across-participant associations only: undirected lines, no coefficients, no causal order. -->
  <g id="panel-C">
    <text x="24" y="1414" font-size="30" font-weight="bold">C: Age, inference, and neural organization</text>
    <g id="association-lines" stroke="#8E8E8A" stroke-width="2.5" stroke-linecap="round">
      <line x1="680" y1="1513.0" x2="510" y2="1557.0"/>
      <line x1="920" y1="1513.0" x2="1090" y2="1557.0"/>
      <line x1="610.0" y1="1598" x2="990.0" y2="1598"/>
    </g>
    <g id="box-age">
      <rect x="610" y="1431" width="380" height="82" rx="8" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="800" y="1466" font-size="24" font-weight="bold" text-anchor="middle">Participant age</text>
      <text x="800" y="1498" font-size="24" text-anchor="middle">8–25 years</text>
    </g>
    <g id="box-inference">
      <rect x="230" y="1557" width="380" height="82" rx="8" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="420" y="1592" font-size="24" font-weight="bold" text-anchor="middle">Inference performance</text>
      <text x="420" y="1624" font-size="24" text-anchor="middle">Accuracy on new comparisons</text>
    </g>
    <g id="box-entorhinal">
      <rect x="990" y="1557" width="380" height="82" rx="8" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="1180" y="1592" font-size="24" font-weight="bold" text-anchor="middle">Entorhinal fMRI</text>
      <text x="1180" y="1624" font-size="24" text-anchor="middle">Sixfold model fit (RSA)</text>
    </g>
    <text x="800" y="1582" font-size="24" font-style="italic" text-anchor="middle">Across-participant associations</text>
    <text x="800" y="1683" font-size="24" font-style="italic" fill="#555555" text-anchor="middle">Different people compared across ages</text>
  </g>
  </g>
</svg>
