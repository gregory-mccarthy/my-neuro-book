      </g>
      <g id="B-plane-token-B">
        <circle cx="350" cy="1048" r="15" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2"/>
        <text x="350" y="1056.5" font-size="24" font-weight="bold" text-anchor="middle">B</text>
      </g>
      <g id="B-plane-token-E">
