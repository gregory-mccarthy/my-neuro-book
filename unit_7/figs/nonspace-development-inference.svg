      <circle cx="526" cy="1136" r="5"/>
      <circle cx="526" cy="1048" r="5"/>
      <circle cx="526" cy="960" r="5"/>
      <circle cx="526" cy="872" r="5"/>
    </g>
    <g id="relations-B">
      <line id="learned-N-E" x1="294.94" y1="1103.06" x2="273.67" y2="1124.33" stroke="#2F6F6B" stroke-width="4" stroke-linecap="butt"/>
