      <text x="115" y="1232" font-size="24" text-anchor="end">1</text>
      <text x="262" y="1304" font-size="24" text-anchor="middle">2</text>
      <text x="115" y="1144" font-size="24" text-anchor="end">2</text>
      <text x="350" y="1304" font-size="24" text-anchor="middle">3</text>
      <text x="115" y="1056" font-size="24" text-anchor="end">3</text>
      <text x="438" y="1304" font-size="24" text-anchor="middle">4</text>
      <text x="115" y="968" font-size="24" text-anchor="end">4</text>
      <text x="526" y="1304" font-size="24" text-anchor="middle">5</text>
      <text x="115" y="880" font-size="24" text-anchor="end">5</text>
      <text x="350" y="1340" font-size="24" text-anchor="middle">Attack rank</text>
      <text x="84" y="1048" font-size="24" text-anchor="middle" transform="rotate(-90 84 1048)">Defense rank</text>
    </g>
