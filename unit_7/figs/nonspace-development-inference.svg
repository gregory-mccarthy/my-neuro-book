<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1699" width="1600" height="1699" role="img" aria-labelledby="fig06-title fig06-desc">
  <title id="fig06-title">Learning relations, making new inferences, and age-related associations</title>
  <desc id="fig06-desc">A: a five-by-five arrangement of objects by attack rank and defense rank, with two learned one-rank relations (A over C in attack, B over D in defense) and an untrained comparison between A and B, beside training cards, a presentation-order strip (A, then B, then the rule A attacks B) and a worked answer. B: a new item N learned relative to four nearby items, then compared with distant item A. C: three measures, participant age, inference accuracy and an entorhinal sixfold model fit, joined by undirected lines as across-participant associations.</desc>
  <rect width="1600" height="1699" fill="#FFFFFF"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#2B2B2B">

  <g id="line-key">
    <line x1="999.66" y1="42" x2="1047.66" y2="42" stroke="#2F6F6B" stroke-width="4"/>
    <text x="1059.66" y="50" font-size="24">Learned relation</text>
    <line x1="1275.89" y1="42" x2="1323.89" y2="42" stroke="#B77A2B" stroke-width="3.5" stroke-dasharray="10 7"/>
    <text x="1335.89" y="50" font-size="24">Untrained comparison</text>
  </g>

  <!-- ===================== PANEL A ===================== -->
  <g id="panel-A">
    <text x="24" y="50" font-size="30" font-weight="bold">A: Learned relations, new comparisons</text>
    <text x="48" y="100" font-size="26" font-weight="bold">Underlying rank arrangement</text>
    <text x="48" y="130" font-size="24" font-style="italic" fill="#555555">Explanatory view; not shown during learning.</text>
    <g id="plane-A-axes">
      <rect x="130" y="150" width="440" height="440" fill="none" stroke="#C9C9C4" stroke-width="1.5"/>
      <g stroke="#2B2B2B" stroke-width="2" stroke-linecap="square">
        <path d="M130,150 V590 H570" fill="none"/>
        <line x1="174" y1="590" x2="174" y2="599"/>
        <line x1="121" y1="546" x2="130" y2="546"/>
        <line x1="262" y1="590" x2="262" y2="599"/>
        <line x1="121" y1="458" x2="130" y2="458"/>
        <line x1="350" y1="590" x2="350" y2="599"/>
        <line x1="121" y1="370" x2="130" y2="370"/>
        <line x1="438" y1="590" x2="438" y2="599"/>
        <line x1="121" y1="282" x2="130" y2="282"/>
        <line x1="526" y1="590" x2="526" y2="599"/>
        <line x1="121" y1="194" x2="130" y2="194"/>
      </g>
      <text x="174" y="626" font-size="24" text-anchor="middle">1</text>
      <text x="115" y="554" font-size="24" text-anchor="end">1</text>
      <text x="262" y="626" font-size="24" text-anchor="middle">2</text>
      <text x="115" y="466" font-size="24" text-anchor="end">2</text>
      <text x="350" y="626" font-size="24" text-anchor="middle">3</text>
      <text x="115" y="378" font-size="24" text-anchor="end">3</text>
      <text x="438" y="626" font-size="24" text-anchor="middle">4</text>
      <text x="115" y="290" font-size="24" text-anchor="end">4</text>
      <text x="526" y="626" font-size="24" text-anchor="middle">5</text>
      <text x="115" y="202" font-size="24" text-anchor="end">5</text>
      <text x="350" y="662" font-size="24" text-anchor="middle">Attack rank</text>
      <text x="84" y="370" font-size="24" text-anchor="middle" transform="rotate(-90 84 370)">Defense rank</text>
    </g>
    <g id="positions-A" fill="#C4C4BF">  <!-- the 25 object positions (object identities, not neurons) -->
      <circle cx="174" cy="546" r="5"/>
      <circle cx="174" cy="370" r="5"/>
      <circle cx="174" cy="282" r="5"/>
      <circle cx="174" cy="194" r="5"/>
      <circle cx="262" cy="546" r="5"/>
      <circle cx="262" cy="458" r="5"/>
      <circle cx="262" cy="370" r="5"/>
      <circle cx="262" cy="282" r="5"/>
      <circle cx="262" cy="194" r="5"/>
      <circle cx="350" cy="546" r="5"/>
      <circle cx="350" cy="458" r="5"/>
      <circle cx="350" cy="282" r="5"/>
      <circle cx="350" cy="194" r="5"/>
      <circle cx="438" cy="546" r="5"/>
      <circle cx="438" cy="458" r="5"/>
      <circle cx="438" cy="370" r="5"/>
      <circle cx="438" cy="282" r="5"/>
      <circle cx="526" cy="458" r="5"/>
      <circle cx="526" cy="370" r="5"/>
      <circle cx="526" cy="282" r="5"/>
      <circle cx="526" cy="194" r="5"/>
    </g>
    <g id="relations-A">
