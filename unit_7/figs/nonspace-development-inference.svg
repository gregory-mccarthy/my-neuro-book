      <line id="learned-B-D" x1="335.24" y1="377.38" x2="188.76" y2="450.62" stroke="#2F6F6B" stroke-width="4" stroke-linecap="butt"/>
      <path id="untrained-A-B" d="M511.44,538.24 Q412.78,483.22 357.76,384.56" fill="none" stroke="#B77A2B" stroke-width="3.5" stroke-dasharray="10 7"/>
    </g>
    <g id="tokens-A">
      <g id="A-plane-token-A">
        <circle cx="526" cy="546" r="15" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2"/>
        <text x="526" y="554.5" font-size="24" font-weight="bold" text-anchor="middle">A</text>
      </g>
      <g id="A-plane-token-B">
        <circle cx="350" cy="370" r="15" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2"/>
        <text x="350" y="378.5" font-size="24" font-weight="bold" text-anchor="middle">B</text>
      </g>
      <g id="A-plane-token-C">
        <circle cx="438" cy="194" r="15" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2"/>
        <text x="438" y="202.5" font-size="24" font-weight="bold" text-anchor="middle">C</text>
      </g>
      <g id="A-plane-token-D">
        <circle cx="174" cy="458" r="15" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2"/>
        <text x="174" y="466.5" font-size="24" font-weight="bold" text-anchor="middle">D</text>
      </g>
    </g>
    <text x="690" y="100" font-size="26" font-weight="bold">Examples from training</text>
    <text x="1026.62" y="100" font-size="24" font-style="italic" fill="#555555">(two of many training pairs)</text>
    <g id="card-attack-A-C">
      <rect x="690" y="118" width="300" height="90" rx="6" fill="#FFFFFF" stroke="#C9C9C4" stroke-width="1.5"/>
      <rect x="690" y="118" width="7" height="90" rx="2" fill="#2F6F6B"/>
      <text x="714" y="156" font-size="24" font-weight="bold">Attack: A &gt; C</text>
      <text x="714" y="192" font-size="24" font-style="italic" fill="#555555">One rank apart</text>
    </g>
    <g id="card-defense-B-D">
      <rect x="1020" y="118" width="300" height="90" rx="6" fill="#FFFFFF" stroke="#C9C9C4" stroke-width="1.5"/>
      <rect x="1020" y="118" width="7" height="90" rx="2" fill="#2F6F6B"/>
      <text x="1044" y="156" font-size="24" font-weight="bold">Defense: B &gt; D</text>
      <text x="1044" y="192" font-size="24" font-style="italic" fill="#555555">One rank apart</text>
    </g>
    <text x="690" y="266" font-size="26" font-weight="bold">Later question</text>
    <g id="presentation-order">  <!-- presentation order only: object, object, then rule -->
      <rect x="690" y="284" width="64" height="64" rx="6" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <g id="A-strip-token-A">
        <circle cx="722" cy="316" r="15" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2"/>
        <text x="722" y="324.5" font-size="24" font-weight="bold" text-anchor="middle">A</text>
      </g>
      <line x1="766" y1="316" x2="797" y2="316" stroke="#555555" stroke-width="2.5"/><polygon points="810,316 795,309 795,323" fill="#555555"/>
      <rect x="822" y="284" width="64" height="64" rx="6" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <g id="A-strip-token-B">
        <circle cx="854" cy="316" r="15" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2"/>
        <text x="854" y="324.5" font-size="24" font-weight="bold" text-anchor="middle">B</text>
      </g>
      <line x1="898" y1="316" x2="929" y2="316" stroke="#555555" stroke-width="2.5"/><polygon points="942,316 927,309 927,323" fill="#555555"/>
      <rect x="954" y="284" width="216.72" height="64" rx="6" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.75"/>
      <text x="972" y="324" font-size="24">Rule: A attacks B</text>
    </g>
    <g id="worked-answer-A">  <!-- explanation for the reader; not information shown to participants -->
      <rect x="690" y="378" width="660" height="142" rx="4" fill="#F4F3EF"/>
      <text x="712" y="412" font-size="24">Compare A’s attack with B’s defense</text>
      <text x="712" y="452" font-size="24" font-weight="bold">Worked answer: 5 &gt; 3, so A wins</text>
      <text x="712" y="492" font-size="24">Reverse the roles: B attacks A; 3 &gt; 1, so B wins.</text>
    </g>
  </g>

  <!-- ===================== PANEL B ===================== -->
  <!-- N at (2.5, 2.5) is an original illustrative placement; half-rank values are not shown to participants. -->
  <g id="panel-B">
    <text x="24" y="730" font-size="30" font-weight="bold">B: Add a new item, infer a distant relation</text>
    <text x="48" y="780" font-size="26" font-weight="bold">Same arrangement, one new item</text>
    <text x="48" y="810" font-size="24" font-style="italic" fill="#555555">One of four new items illustrated.</text>
    <g id="plane-B-axes">
      <rect x="130" y="828" width="440" height="440" fill="none" stroke="#C9C9C4" stroke-width="1.5"/>
      <g stroke="#2B2B2B" stroke-width="2" stroke-linecap="square">
        <path d="M130,828 V1268 H570" fill="none"/>
        <line x1="174" y1="1268" x2="174" y2="1277"/>
