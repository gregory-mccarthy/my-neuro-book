<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 890" width="1800" height="890" font-family="Georgia, 'Times New Roman', Times, serif" role="img" aria-labelledby="fig6-title fig6-desc">
<title id="fig6-title">Goldfish hippocampal-pallium lesions: delay versus trace conditioning, and trained premise pairs versus a novel comparison</title>
<desc id="fig6-desc">Panel A shows two aligned timing diagrams with separate tracks for the conditioned stimulus (CS, teal) and the unconditioned stimulus (US, ochre). In delay conditioning the CS is still on when the US begins, so they overlap briefly. In trace conditioning the CS ends and a bracketed stimulus-free interval passes before the US begins. Timing is schematic and not to scale. A table shows that sham fish learned both tasks, while fish with Dlv lesions were spared on delay conditioning and impaired on trace conditioning. Panel B shows four trained pairs of visual stimuli, A plus with B minus, B plus with C minus, C plus with D minus, and D plus with E minus, where plus marks the rewarded choice and minus the unrewarded choice within that pair. One arrow leads to a novel test of B versus D. A table shows that both groups learned the trained pairs; sham fish preferred B in the novel test, while lesioned fish were impaired. A note states that B and D each have rewarded and unrewarded roles in training.</desc>
