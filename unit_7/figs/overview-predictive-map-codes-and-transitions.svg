<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1314" viewBox="0 0 1600 1314" role="img" aria-labelledby="fig04-title fig04-desc" font-family="Georgia, 'Times New Roman', Times, serif">
<title id="fig04-title">From spatial signals to expected occupancy</title>
<desc id="fig04-desc">Two panels. A: four square arenas show idealized tuning examples in teal: a place field as a single soft spot; a grid pattern of round fields on a triangular lattice; head-direction tuning as several arrowheads all pointing the same way, labeled preferred facing direction; and a boundary field running along one wall. B: two matching views of an arena with a barrier rising from the bottom wall. Seven states form a route up the left side, through a passage above the barrier, and down the right side, with two-way transitions between neighbors and none through the barrier. The current state, at the bottom left, is ringed and left unshaded in both views. The left view states the policy: choose equally among available transitions. The right view shades the other states from darker to lighter along the route: a state farther up the left side is darker than the state just across the barrier, which is nearby but reached only by a detour. Later visits contribute less.</desc>
