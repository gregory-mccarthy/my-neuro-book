<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
<title id="title">The HPA Axis as a Feedback-Control Loop</title>
<desc id="desc">Focused HPA-axis diagram showing forebrain and circadian inputs to PVN CRH neurons, CRH release to the median eminence and portal circulation, ACTH release from the anterior pituitary, cortisol release from the adrenal cortex, body-wide cortisol effects, mineralocorticoid and glucocorticoid receptor signaling, and negative feedback to hypothalamic, pituitary, hippocampal, and prefrontal regulatory circuitry.</desc>
<rect width="1400" height="780" fill="#ffffff"/>
<defs><style>
.title{font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:700;fill:#0a3f4a}
.subtitle{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#526970}
.header{font-family:Arial,Helvetica,sans-serif;font-size:12.5px;font-weight:700;letter-spacing:1.25px;fill:#687b81}
.bt{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#103f48}
.bt13{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;fill:#103f48}
.bs{font-family:Arial,Helvetica,sans-serif;font-size:11.7px;fill:#50666c}
.bs2{font-family:Arial,Helvetica,sans-serif;font-size:10.8px;fill:#50666c}
.note{font-family:Arial,Helvetica,sans-serif;font-size:10.7px;fill:#6c7376}
.route{font-family:Arial,Helvetica,sans-serif;font-size:10.8px;font-weight:600;fill:#7a5b55}
.input{fill:#f7f1df;stroke:#87999d;stroke-width:1.7}
.brake{fill:#edf7f2;stroke:#5a9b77;stroke-width:1.9}
.pvn{fill:#fff4dd;stroke:#c45b2b;stroke-width:2.7}
.axis{fill:#f7f1df;stroke:#c99336;stroke-width:2.0}
.cortisol{fill:#fff7e7;stroke:#c45b2b;stroke-width:2.2}
.mr{fill:#edf7f2;stroke:#5a9b77;stroke-width:2.0}
.gr{fill:#fdf0e7;stroke:#c96b4c;stroke-width:2.0}
.feedbackbox{fill:#f7f5ef;stroke:#8a979a;stroke-width:1.8}
.effect{fill:#f3f8f5;stroke:#5a9b77;stroke-width:2.0}
.line{fill:none;stroke:#5d747b;stroke-width:2.15;stroke-linecap:round;stroke-linejoin:round}
.hormone{fill:none;stroke:#9b6d62;stroke-width:2.15;stroke-linecap:round;stroke-linejoin:round}
.mod{fill:none;stroke:#9b6d62;stroke-width:1.9;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.feedback{fill:none;stroke:#b84f4a;stroke-width:1.9;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
</style></defs>
<text class="title" x="700" y="34" text-anchor="middle">The HPA Axis as a Feedback-Control Loop</text>
<text class="subtitle" x="700" y="57" text-anchor="middle">Cortisol is both a body-wide output signal and an input that helps regulate basal tone and terminate the response.</text>
<text class="header" x="142.5" y="105" text-anchor="middle">FOREBRAIN + CLOCK INPUTS</text>
<text class="header" x="877.5" y="105" text-anchor="middle">ENDOCRINE CASCADE</text>
<rect class="input" x="35" y="150" width="215" height="88" rx="9" ry="9"/>
<text class="bt" x="142.5" y="183" text-anchor="middle">Amygdala / BNST</text>
<text class="bs2" x="142.5" y="208" text-anchor="middle">threat · ambiguity · sustained uncertainty</text>
<rect class="input" x="35" y="310" width="215" height="88" rx="9" ry="9"/>
<text class="bt" x="142.5" y="343" text-anchor="middle">SCN / Circadian Timing</text>
<text class="bs2" x="142.5" y="368" text-anchor="middle">daily phase · anticipatory drive</text>
<rect class="brake" x="35" y="470" width="215" height="88" rx="9" ry="9"/>
<text class="bt" x="142.5" y="503" text-anchor="middle">Hippocampus / vmPFC</text>
<text class="bs2" x="142.5" y="528" text-anchor="middle">context · safety · controllability</text>
<rect class="pvn" x="385" y="142" width="158" height="104" rx="9" ry="9"/>
<text class="bt" x="464.0" y="175" text-anchor="middle">PVN CRH neurons</text>
<text class="bs2" x="464.0" y="200" text-anchor="middle">parvocellular neurosecretory</text>
<text class="bs2" x="464.0" y="216" text-anchor="middle">hypothalamic output</text>
<rect class="axis" x="587" y="142" width="158" height="104" rx="9" ry="9"/>
<text class="bt" x="666.0" y="175" text-anchor="middle">Median eminence</text>
<text class="bs2" x="666.0" y="200" text-anchor="middle">CRH enters hypophyseal</text>
<text class="bs2" x="666.0" y="216" text-anchor="middle">portal circulation</text>
<rect class="axis" x="789" y="142" width="158" height="104" rx="9" ry="9"/>
<text class="bt" x="868.0" y="175" text-anchor="middle">Anterior pituitary</text>
<text class="bs2" x="868.0" y="200" text-anchor="middle">corticotropes release</text>
<text class="bs2" x="868.0" y="216" text-anchor="middle">ACTH</text>
<rect class="axis" x="995" y="142" width="158" height="104" rx="9" ry="9"/>
<text class="bt" x="1074.0" y="175" text-anchor="middle">Adrenal cortex</text>
<text class="bs2" x="1074.0" y="200" text-anchor="middle">ACTH target</text>
<text class="bs2" x="1074.0" y="216" text-anchor="middle">cortisol synthesis</text>
<rect class="cortisol" x="1212" y="142" width="158" height="104" rx="9" ry="9"/>
<text class="bt" x="1291.0" y="175" text-anchor="middle">Circulating cortisol</text>
<text class="bs2" x="1291.0" y="200" text-anchor="middle">steroid signal to</text>
<text class="bs2" x="1291.0" y="216" text-anchor="middle">brain + body</text>
<line class="hormone" x1="543" y1="194" x2="576" y2="194"/>
<polygon points="587.0,194.0 576.0,197.6 576.0,190.4" fill="#9b6d62"/>
<text class="route" x="565.0" y="181" text-anchor="middle">CRH</text>
<line class="hormone" x1="745" y1="194" x2="778" y2="194"/>
<polygon points="789.0,194.0 778.0,197.6 778.0,190.4" fill="#9b6d62"/>
<text class="route" x="767.0" y="181" text-anchor="middle">CRH</text>
<line class="hormone" x1="947" y1="194" x2="984" y2="194"/>
<polygon points="995.0,194.0 984.0,197.6 984.0,190.4" fill="#9b6d62"/>
<text class="route" x="971.0" y="181" text-anchor="middle">ACTH</text>
<line class="hormone" x1="1153" y1="194" x2="1201" y2="194"/>
<polygon points="1212.0,194.0 1201.0,197.6 1201.0,190.4" fill="#9b6d62"/>
<text class="route" x="1182.5" y="181" text-anchor="middle">cortisol</text>
<path class="mod" d="M 250 194.0 C 312.0 194.0, 312.0 178, 374 178"/>
<polygon points="385.0,178.0 374.0,181.6 374.0,174.4" fill="#9b6d62"/>
<text class="route" x="305" y="168" text-anchor="middle">net facilitates</text>
<path class="mod" d="M 250 354.0 L 330 354.0 L 330 204 L 374 204"/>
<polygon points="385.0,204.0 374.0,207.6 374.0,200.4" fill="#9b6d62"/>
<text class="route" x="292" y="340.0" text-anchor="middle">timing / gain</text>
<path class="feedback" d="M 250 514.0 L 345 514.0 L 345 230 L 381 230"/>
<polygon points="385.0,238.0 385.0,222.0 381.0,222.0 381.0,238.0" fill="#b84f4a"/>
<text class="route" x="297" y="487.0" text-anchor="middle">net restraint</text>
<text class="route" x="297" y="500.0" text-anchor="middle">when safe</text>
<text class="header" x="930.0" y="316" text-anchor="middle">CORTISOL RECEPTOR STATE</text>
<rect class="mr" x="700" y="330" width="200" height="104" rx="9" ry="9"/>
<text class="bt13" x="800.0" y="363" text-anchor="middle">MR — high affinity</text>
<text class="bs2" x="800.0" y="388" text-anchor="middle">substantially occupied at baseline</text>
<text class="bs2" x="800.0" y="404" text-anchor="middle">basal / circadian regulation</text>
<rect class="gr" x="950" y="330" width="210" height="104" rx="9" ry="9"/>
<text class="bt13" x="1055.0" y="363" text-anchor="middle">GR — lower affinity</text>
<text class="bs2" x="1055.0" y="388" text-anchor="middle">increasingly engaged as cortisol rises</text>
<text class="bs2" x="1055.0" y="404" text-anchor="middle">recovery / negative feedback</text>
<rect class="effect" x="1212" y="545" width="158" height="104" rx="9" ry="9"/>
<text class="bt13" x="1291.0" y="578" text-anchor="middle">Body-wide effects</text>
<text class="bs2" x="1291.0" y="603" text-anchor="middle">metabolism · immunity</text>
<text class="bs2" x="1291.0" y="619" text-anchor="middle">cardiovascular + brain state</text>
<path class="hormone" d="M 1291.0 246 L 1291.0 534"/>
<polygon points="1291.0,545.0 1287.4,534.0 1294.6,534.0" fill="#9b6d62"/>
<path class="hormone" d="M 1291.0 290 L 800.0 290 L 800.0 319"/>
<polygon points="800.0,330.0 796.4,319.0 803.6,319.0" fill="#9b6d62"/>
<path class="hormone" d="M 1055.0 290 L 1055.0 319"/>
<polygon points="1055.0,330.0 1051.4,319.0 1058.6,319.0" fill="#9b6d62"/>
<text class="route" x="1045.5" y="280" text-anchor="middle">receptor occupancy depends on cortisol concentration</text>
<text class="route" x="1303.0" y="400" text-anchor="start">output signal</text>
<text class="header" x="920.0" y="527" text-anchor="middle">FEEDBACK CONTROL</text>
<rect class="feedbackbox" x="740" y="545" width="360" height="104" rx="9" ry="9"/>
<text class="bt13" x="920.0" y="578" text-anchor="middle">MR/GR-sensitive feedback network</text>
<text class="bs2" x="920.0" y="603" text-anchor="middle">PVN + pituitary + hippocampal / prefrontal circuitry</text>
<text class="bs2" x="920.0" y="619" text-anchor="middle">sets basal tone and helps terminate stress responses</text>
<path class="mod" d="M 800.0 434 L 800.0 534"/>
<polygon points="800.0,545.0 796.4,534.0 803.6,534.0" fill="#9b6d62"/>
<path class="mod" d="M 1055.0 434 L 1055.0 534"/>
<polygon points="1055.0,545.0 1051.4,534.0 1058.6,534.0" fill="#9b6d62"/>
<path class="feedback" d="M 740 580 L 640 580 L 640 268 L 868.0 268 L 868.0 250"/>
<polygon points="876.0,246.0 860.0,246.0 860.0,250.0 876.0,250.0" fill="#b84f4a"/>
<text class="route" x="628" y="420" text-anchor="end">pituitary feedback</text>
<path class="feedback" d="M 740 620 L 470 620 L 470 250"/>
<polygon points="478.0,246.0 462.0,246.0 462.0,250.0 478.0,250.0" fill="#b84f4a"/>
<text class="route" x="482" y="560" text-anchor="start">hypothalamic feedback</text>
<path class="mod" d="M 780 649 L 780 700 L 142 700 L 142 569"/>
<polygon points="142.0,558.0 145.6,569.0 138.4,569.0" fill="#9b6d62"/>
<text class="route" x="430" y="688" text-anchor="middle">glucocorticoid-sensitive forebrain feedback</text>
<text class="note" x="620" y="730" text-anchor="middle">The adrenal medulla belongs to the fast sympathetic arm, not the HPA cascade.</text>
<text class="note" x="620" y="752" text-anchor="middle">Feedback paths summarize net control; hippocampal and prefrontal influences reach the PVN largely through intervening relays rather than a single direct projection.</text>
<text class="note" x="1100" y="700" text-anchor="start">connection key</text>
<line class="hormone" x1="1102" y1="726" x2="1134" y2="726"/>
<polygon points="1144.0,726.0 1134.0,729.2 1134.0,722.8" fill="#9b6d62"/>
<text class="note" x="1153" y="730" text-anchor="start">signal / activation</text>
<line class="feedback" x1="1102" y1="750" x2="1142" y2="750"/>
<polygon points="1144.0,757.0 1144.0,743.0 1140.0,743.0 1140.0,757.0" fill="#b84f4a"/>
<text class="note" x="1153" y="754" text-anchor="start">net restraint</text>
</svg>