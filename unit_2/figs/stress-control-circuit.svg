<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
<title id="title">The Hypothalamic Stress-Control System</title>
<desc id="desc">A control diagram showing multiple bodily and environmental signals converging through brainstem, metabolic, and forebrain relays on PVN and related hypothalamic circuits, which coordinate a fast sympathetic arm and a slower HPA endocrine arm. Cortisol provides negative feedback and changed body state becomes new sensory evidence.</desc>
