<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="810" viewBox="0 0 1260 810" role="img" aria-labelledby="title desc">
  <title id="title">The Arcuate Melanocortin Circuit</title>
  <desc id="desc">A detailed circuit diagram showing ghrelin, leptin, insulin, nutrients, gut signals, and food cues acting on arcuate AgRP/NPY/GABA and POMC/CART neurons; inhibitory and excitatory projections to PVN MC4R neurons, lateral hypothalamic motivational circuits, and NTS/PBN satiety circuits; and the resulting effects on feeding, meal termination, and energy expenditure.</desc>

  <rect x="0" y="0" width="1260" height="810" rx="0" ry="0" fill="#ffffff" stroke="none" stroke-width="0" />

  <!-- Arcuate frame is painted first so wires can run over it -->
  <rect x="75" y="310" width="525" height="310" rx="10" ry="10" fill="#fffaf6" stroke="#c94f1d" stroke-width="2.5" />

  <!-- ===== Hormonal / nutrient / predictive signals into the ARC ===== -->
  <path d="M 145 174 L 145 332" fill="none" stroke="#7f5551" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" />
  <path d="M 145,344 L 140,332 L 150,332 Z" fill="#7f5551" />
  <text x="156" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7f5551" text-anchor="start">activates AgRP</text>
  <path d="M 350 174 C 350 210, 245 210, 245 340" fill="none" stroke="#7f5551" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" />
  <path d="M 237,344 L 253,344 L 253,340.5 L 237,340.5 Z" fill="#7f5551" />
  <text x="240" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7f5551" text-anchor="end">restrains AgRP</text>
  <path d="M 400 174 C 400 210, 445 210, 445 332" fill="none" stroke="#7f5551" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" />
  <path d="M 445,344 L 440,332 L 450,332 Z" fill="#7f5551" />
  <text x="410" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7f5551" text-anchor="end">supports POMC</text>
  <path d="M 615 174 C 615 210, 520 210, 520 332" fill="none" stroke="#7f5551" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" />
  <path d="M 520,344 L 515,332 L 525,332 Z" fill="#7f5551" />
  <text x="582" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7f5551" text-anchor="start">fuel signal</text>
  <!-- Food cues brake AgRP before calories arrive, routed round the left -->
  <path d="M 800 174 L 800 182 Q 800 192, 790 192 L 55 192 Q 45 192, 45 202 L 45 362 Q 45 372, 55 372 L 89 372" fill="none" stroke="#7f5551" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" />
  <path d="M 93,380 L 93,364 L 89.5,364 L 89.5,380 Z" fill="#7f5551" />
  <text x="54" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7f5551" text-anchor="start">predictive brake</text>
  <!-- AgRP GABA directly inhibits POMC -->
  <path d="M 295 398 L 354 398" fill="none" stroke="#c54b48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 358,406 L 358,390 L 354.5,390 L 354.5,406 Z" fill="#c54b48" />
  <!-- ===== Arcuate output lanes, nested so none of them cross ===== -->
  <path d="M 250 450 L 250 470 Q 250 480, 260 480 L 600 480 C 645 480, 640 380, 689 380" fill="none" stroke="#c54b48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 703,388 L 703,372 L 699.5,372 L 699.5,388 Z" fill="#c54b48" />
  <text x="460" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7f5551" text-anchor="middle">GABA + AgRP blocks MC4R</text>
  <path d="M 560 380 C 610 380, 640 347, 691 345" fill="none" stroke="#586f76" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 703,345 L 691,350 L 691,340 Z" fill="#586f76" />
  <text x="650" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7f5551" text-anchor="middle">&#945;-MSH &#8594; MC4R</text>
  <path d="M 200 450 L 200 500 Q 200 510, 210 510 L 691 510" fill="none" stroke="#586f76" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" />
  <path d="M 703,510 L 691,515 L 691,505 Z" fill="#586f76" />
  <text x="460" y="502" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7f5551" text-anchor="middle">feeding drive</text>
  <path d="M 150 450 L 150 530 Q 150 540, 160 540 L 670 540 Q 680 540, 680 550 L 680 652 Q 680 662, 690 662 L 699 662" fill="none" stroke="#c54b48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 703,670 L 703,654 L 699.5,654 L 699.5,670 Z" fill="#c54b48" />
  <text x="460" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7f5551" text-anchor="middle">removes satiety brake</text>
  <!-- Gut satiety, routed clear of both right-hand columns -->
  <path d="M 950 142 L 1215 142 Q 1225 142, 1225 152 L 1225 578 Q 1225 588, 1215 588 L 890 588 Q 880 588, 880 598 L 880 606" fill="none" stroke="#7f5551" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" />
  <path d="M 880,618 L 875,606 L 885,606 Z" fill="#7f5551" />
  <text x="1090" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7f5551" text-anchor="middle">gut satiety</text>
  <!-- Targets drive their outputs -->
  <path d="M 915 362 L 966 362" fill="none" stroke="#586f76" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 978,362 L 966,367 L 966,357 Z" fill="#586f76" />
  <path d="M 915 512 L 966 512" fill="none" stroke="#586f76" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 978,512 L 966,517 L 966,507 Z" fill="#586f76" />
  <path d="M 915 662 L 966 662" fill="none" stroke="#586f76" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 978,662 L 966,667 L 966,657 Z" fill="#586f76" />

  <!-- ===== Inputs ===== -->
  <rect x="60" y="110" width="170" height="64" rx="6" ry="6" fill="#f4f6f6" stroke="#8f9a9a" stroke-width="1.7" />
  <text x="145" y="135" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">Ghrelin</text>
  <text x="145" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">empty stomach</text>
  <rect x="280" y="110" width="190" height="64" rx="6" ry="6" fill="#f4f6f6" stroke="#8f9a9a" stroke-width="1.7" />
  <text x="375" y="135" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">Leptin / Insulin</text>
  <text x="375" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">adiposity + abundance</text>
  <rect x="520" y="110" width="190" height="64" rx="6" ry="6" fill="#f4f6f6" stroke="#8f9a9a" stroke-width="1.7" />
  <text x="615" y="135" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">Glucose / Nutrients</text>
  <text x="615" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">acute fuel state</text>
  <rect x="760" y="110" width="190" height="64" rx="6" ry="6" fill="#f4f6f6" stroke="#8f9a9a" stroke-width="1.7" />
  <text x="855" y="135" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">Food Cues + Gut</text>
  <text x="855" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">prediction + satiety</text>
  <!-- ===== Arcuate neurons ===== -->
  <rect x="95" y="346" width="200" height="104" rx="8" ry="8" fill="#fbe7d9" stroke="#c94f1d" stroke-width="2.2" />
  <text x="195" y="376" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">AgRP / NPY</text>
  <text x="195" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">/ GABA</text>
  <text x="195" y="422" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">active hunger</text>
  <rect x="360" y="346" width="200" height="104" rx="8" ry="8" fill="#e4f2ef" stroke="#2f9f99" stroke-width="2.2" />
  <text x="460" y="376" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">POMC / CART</text>
  <text x="460" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">&#945;-MSH</text>
  <text x="460" y="424" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">melanocortin tone</text>
  <text x="345" y="574" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#466168" text-anchor="middle">Opponent balance sets intake, expenditure, and allocation</text>
  <text x="345" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#466168" text-anchor="middle">Food cues can inhibit AgRP activity before calories are absorbed</text>
  <!-- ===== Downstream targets ===== -->
  <rect x="705" y="320" width="210" height="84" rx="6" ry="6" fill="#f4f6f6" stroke="#8f9a9a" stroke-width="1.8" />
  <text x="810" y="349" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">PVN MC4R neurons</text>
  <text x="810" y="371" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">satiety &#183; autonomic</text>
  <text x="810" y="389" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#466168" text-anchor="middle">endocrine output</text>
  <rect x="705" y="470" width="210" height="84" rx="6" ry="6" fill="#f4f6f6" stroke="#8f9a9a" stroke-width="1.8" />
  <text x="810" y="499" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">LH &#8594; VTA / NAc</text>
  <text x="810" y="521" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">orexin &#183; MCH</text>
  <text x="810" y="539" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#466168" text-anchor="middle">arousal + foraging</text>
  <rect x="705" y="620" width="210" height="84" rx="6" ry="6" fill="#f4f6f6" stroke="#8f9a9a" stroke-width="1.8" />
  <text x="810" y="649" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">NTS / PBN</text>
  <text x="810" y="671" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">visceral satiety</text>
  <text x="810" y="689" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#466168" text-anchor="middle">meal termination</text>
  <!-- ===== Outputs ===== -->
  <rect x="980" y="330" width="210" height="64" rx="6" ry="6" fill="#f4f6f6" stroke="#2f9f99" stroke-width="2.1" />
  <text x="1085" y="355" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">&#8595; Intake</text>
  <text x="1085" y="376" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">&#8593; expenditure</text>
  <rect x="980" y="480" width="210" height="64" rx="6" ry="6" fill="#f4f6f6" stroke="#2f9f99" stroke-width="2.1" />
  <text x="1085" y="505" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">Food Seeking</text>
  <text x="1085" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">arousal &#183; eating</text>
  <rect x="980" y="630" width="210" height="64" rx="6" ry="6" fill="#f4f6f6" stroke="#2f9f99" stroke-width="2.1" />
  <text x="1085" y="655" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">Stop Meal</text>
  <text x="1085" y="676" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">visceral brake</text>

  <text x="630" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#07343d" text-anchor="middle">The Arcuate Melanocortin Circuit</text>
  <text x="505" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#637176" text-anchor="middle" letter-spacing="1.2">INPUTS TO THE ARCUATE CONTROLLER</text>
  <text x="345" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#637176" text-anchor="middle" letter-spacing="1.2">ARCUATE NUCLEUS</text>
  <text x="810" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#637176" text-anchor="middle" letter-spacing="1.2">DOWNSTREAM TARGETS</text>
  <text x="1085" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#637176" text-anchor="middle" letter-spacing="1.2">OUTPUTS</text>

  <rect x="75" y="650" width="440" height="120" rx="6" ry="6" fill="#f4f6f6" stroke="#8f9a9a" stroke-width="1" />
  <path d="M 95 680 L 140 680" fill="none" stroke="#586f76" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 150,680 L 138,685 L 138,675 Z" fill="#586f76" />
  <text x="166" y="684" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#466168" text-anchor="start">excitatory / activating</text>
  <path d="M 95 704 L 146 704" fill="none" stroke="#c54b48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 150,712 L 150,696 L 146.5,696 L 146.5,712 Z" fill="#c54b48" />
  <text x="166" y="708" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#466168" text-anchor="start">inhibitory / braking</text>
  <path d="M 95 728 L 140 728" fill="none" stroke="#7f5551" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" />
  <path d="M 150,728 L 138,733 L 138,723 Z" fill="#7f5551" />
  <text x="166" y="732" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#466168" text-anchor="start">predictive, hormonal, or nutrient signal</text>
  <path d="M 95 752 L 140 752" fill="none" stroke="#586f76" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" />
  <path d="M 150,752 L 138,757 L 138,747 Z" fill="#586f76" />
  <text x="166" y="756" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#466168" text-anchor="start">functional drive</text>
</svg>
