<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600">
  <!-- Background -->
  <rect x="0" y="0" width="940" height="600" rx="0" ry="0" fill="#ffffff" stroke="none" stroke-width="0" />
  
  <!-- Title, POA container, column headers -->
  <text x="470" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#073642" text-anchor="middle">The Disinhibitory Switch (Preoptic Controller)</text>
  <rect x="265" y="90" width="240" height="372" rx="10" ry="10" fill="none" stroke="#93a1a1" stroke-width="2" stroke-dasharray="6,6" />
  <text x="125" y="78" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#586e75" text-anchor="middle" letter-spacing="1">INPUTS</text>
  <text x="385" y="78" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#586e75" text-anchor="middle" letter-spacing="1">PREOPTIC AREA (POA)</text>
  <text x="795" y="78" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#586e75" text-anchor="middle" letter-spacing="1">DOWNSTREAM</text>
  
  <!-- ===== Connectors: lines stop short, heads are baked paths ===== -->
  <!-- Cold input: LPBel excites MnPO -->
  <path d="M 210 138 L 279 138" fill="none" stroke="#859900" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" />
  <path d="M 290,138 L 277,143.5 L 277,132.5 Z" fill="#859900" />
  <!-- MnPO excites the GABA interneuron -->
  <path d="M 328 166 L 328 219" fill="none" stroke="#859900" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" />
  <path d="M 328,230 L 322.5,217 L 333.5,217 Z" fill="#859900" />
  <!-- GABA interneuron inhibits MPO WSN: the switch itself -->
  <path d="M 328 274 L 328 362" fill="none" stroke="#dc322f" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" />
  <path d="M 320,366 L 336,366 L 336,362 L 320,362 Z" fill="#dc322f" />
  <text x="342" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc322f" text-anchor="start">Disinhibition</text>
  <text x="342" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#586e75" text-anchor="start">(Releases brake on DMH)</text>
  <!-- Warm inputs excite MPO WSN -->
  <path d="M 210 358 L 250 358 L 250 390 L 279 390" fill="none" stroke="#859900" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" />
  <path d="M 290,390 L 277,395.5 L 277,384.5 Z" fill="#859900" />
  <path d="M 210 468 L 250 468 L 250 418 L 279 418" fill="none" stroke="#859900" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" />
  <path d="M 290,418 L 277,423.5 L 277,412.5 Z" fill="#859900" />
  <!-- MPO WSN inhibits DMH / Raphe -->
  <path d="M 480 404 L 686 404" fill="none" stroke="#dc322f" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" />
  <path d="M 690,412 L 690,396 L 686,396 L 686,412 Z" fill="#dc322f" />
  <text x="585" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc322f" text-anchor="middle">Constant GABAergic Brake</text>
  <!-- DMH / Raphe drives the effectors -->
  <path d="M 795 366 L 795 197" fill="none" stroke="#859900" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" />
  <path d="M 795,186 L 800.5,199 L 789.5,199 Z" fill="#859900" />
  <text x="810" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#859900" text-anchor="start">Activates</text>
  
  <!-- ===== Inputs ===== -->
  <rect x="40" y="110" width="170" height="56" rx="6" ry="6" fill="#ffffff" stroke="#2aa198" stroke-width="3" />
  <text x="125" y="133" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#073642" text-anchor="middle">LPBel</text>
  <text x="125" y="153" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#586e75" text-anchor="middle">(Skin Cold Signals)</text>
  <rect x="40" y="330" width="170" height="56" rx="6" ry="6" fill="#ffffff" stroke="#cb4b16" stroke-width="3" />
  <text x="125" y="353" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#073642" text-anchor="middle">LPBd</text>
  <text x="125" y="373" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#586e75" text-anchor="middle">(Skin Warm Signals)</text>
  <rect x="40" y="440" width="170" height="56" rx="6" ry="6" fill="#ffffff" stroke="#cb4b16" stroke-width="3" />
  <text x="125" y="463" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#073642" text-anchor="middle">Core Blood</text>
  <text x="125" y="483" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#586e75" text-anchor="middle">(Direct Local Heat)</text>
  
  <!-- ===== POA circuitry ===== -->
  <rect x="290" y="110" width="190" height="56" rx="6" ry="6" fill="#ffffff" stroke="#2aa198" stroke-width="3" />
  <text x="385" y="133" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#073642" text-anchor="middle">MnPO</text>
  <text x="385" y="153" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#586e75" text-anchor="middle">Median Preoptic Nucleus</text>
  <rect x="300" y="230" width="170" height="44" rx="6" ry="6" fill="#f4f6f6" stroke="#93a1a1" stroke-width="2" />
  <text x="385" y="257" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#073642" text-anchor="middle">GABA Interneuron</text>
  <rect x="290" y="366" width="190" height="76" rx="6" ry="6" fill="#ffffff" stroke="#cb4b16" stroke-width="3" />
  <text x="385" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#073642" text-anchor="middle">MPO WSN</text>
  <text x="385" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#586e75" text-anchor="middle">Medial Preoptic Area</text>
  <text x="385" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#586e75" text-anchor="middle">(Warm-Sensitive Neurons)</text>
  
  <!-- ===== Downstream ===== -->
  <rect x="690" y="110" width="210" height="76" rx="6" ry="6" fill="#f4f6f6" stroke="#93a1a1" stroke-width="2" />
  <text x="795" y="136" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#073642" text-anchor="middle">Thermogenesis</text>
  <text x="795" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#586e75" text-anchor="middle">Brown Adipose Tissue (BAT),</text>
  <text x="795" y="174" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#586e75" text-anchor="middle">Shivering, Vasoconstriction</text>
  <rect x="690" y="366" width="210" height="76" rx="6" ry="6" fill="#f4f6f6" stroke="#b58900" stroke-width="3" />
  <text x="795" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#073642" text-anchor="middle">DMH &amp; Raphe Pallidus</text>
  <text x="795" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#586e75" text-anchor="middle">Cold Defense Centers</text>
  <text x="795" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#586e75" text-anchor="middle">(Premotor Relay)</text>
  
  <!-- ===== Legend ===== -->
  <rect x="40" y="516" width="250" height="52" rx="4" ry="4" fill="#f4f6f6" stroke="#93a1a1" stroke-width="1" />
  <path d="M 56 532 L 85 532" fill="none" stroke="#859900" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" />
  <path d="M 96,532 L 83,537.5 L 83,526.5 Z" fill="#859900" />
  <text x="110" y="536" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#586e75" text-anchor="start">Excitatory (+)</text>
  <path d="M 56 554 L 92 554" fill="none" stroke="#dc322f" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" />
  <path d="M 96,562 L 96,546 L 92,546 L 92,562 Z" fill="#dc322f" />
  <text x="110" y="558" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#586e75" text-anchor="start">Inhibitory (-)</text>
</svg>
