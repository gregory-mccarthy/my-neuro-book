  <text x="630" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">AgRP &#8596; POMC</text>
  <text x="630" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">PVN</text>
  <text x="630" y="313" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">MC4R satiety</text>
  <text x="630" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">LH</text>
  <text x="630" y="381" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">Orexin &#183; MCH</text>
  <text x="630" y="409" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#466168" text-anchor="middle">Intake &#183; expenditure &#183; allocation</text>
  
  <!-- ===== Efferent relays ===== -->
  <rect x="790" y="110" width="180" height="62" rx="6" ry="6" fill="#f4f6f6" stroke="#8f9a9a" stroke-width="1.7" />
