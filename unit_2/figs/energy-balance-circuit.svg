  <path d="M 528,383 L 516,388 L 516,378 Z" fill="#586f76" />
  
  <!-- ===== Controller out to the efferent relays ===== -->
  <path d="M 730 226 C 760 226, 760 141, 768 141" fill="none" stroke="#586f76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 778,141 L 766,146 L 766,136 Z" fill="#586f76" />
  <path d="M 730 285 C 760 285, 760 271, 768 271" fill="none" stroke="#586f76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 778,271 L 766,276 L 766,266 Z" fill="#586f76" />
  <path d="M 730 350 C 760 350, 760 401, 768 401" fill="none" stroke="#586f76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 778,401 L 766,406 L 766,396 Z" fill="#586f76" />
  <path d="M 730 385 C 760 385, 760 531, 768 531" fill="none" stroke="#586f76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 778,531 L 766,536 L 766,526 Z" fill="#586f76" />
  
