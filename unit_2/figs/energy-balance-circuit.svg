  <text x="120" y="269" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">Empty Stomach</text>
  <text x="120" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">Ghrelin &#183; stretch</text>
  <rect x="30" y="375" width="180" height="62" rx="6" ry="6" fill="#f4f6f6" stroke="#8f9a9a" stroke-width="1.7" />
  <text x="120" y="399" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">Meal in Gut</text>
  <text x="120" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">CCK &#183; PYY &#183; GLP-1</text>
  <rect x="30" y="505" width="180" height="62" rx="6" ry="6" fill="#f4f6f6" stroke="#8f9a9a" stroke-width="1.7" />
  <text x="120" y="529" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">Food Cues + Fuels</text>
  <text x="120" y="550" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">Sight &#183; taste &#183; glucose</text>
  
  <!-- ===== Relays ===== -->
  <rect x="300" y="115" width="180" height="62" rx="6" ry="6" fill="#f4f6f6" stroke="#8f9a9a" stroke-width="1.7" />
  <text x="390" y="139" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">Median Eminence</text>
