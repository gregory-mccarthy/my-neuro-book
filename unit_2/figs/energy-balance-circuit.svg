  <path d="M 970 141 C 1000 141, 1000 128, 1008 128" fill="none" stroke="#586f76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 1018,128 L 1006,133 L 1006,123 Z" fill="#586f76" />
  <path d="M 970 271 C 1000 271, 1000 247, 1008 247" fill="none" stroke="#586f76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
