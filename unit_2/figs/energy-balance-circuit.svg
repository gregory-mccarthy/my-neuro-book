  <text x="880" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">Sympathetic</text>
  <text x="880" y="545" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">BAT &#183; liver &#183; adipose</text>
  
  <!-- ===== Effectors ===== -->
  <rect x="1020" y="105" width="180" height="46" rx="6" ry="6" fill="#f4f6f6" stroke="#2f9f99" stroke-width="2.1" />
