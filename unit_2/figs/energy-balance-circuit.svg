  <path d="M 970 401 C 1000 401, 1000 397, 1008 397" fill="none" stroke="#586f76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 1018,397 L 1006,402 L 1006,392 Z" fill="#586f76" />
  <path d="M 970 531 C 1000 531, 1000 531, 1008 531" fill="none" stroke="#586f76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 1018,531 L 1006,536 L 1006,526 Z" fill="#586f76" />
  
  <!-- ===== Body inputs ===== -->
  <rect x="30" y="115" width="180" height="62" rx="6" ry="6" fill="#f4f6f6" stroke="#8f9a9a" stroke-width="1.7" />
  <text x="120" y="139" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">Adipose / Pancreas</text>
  <text x="120" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">Leptin &#183; insulin</text>
