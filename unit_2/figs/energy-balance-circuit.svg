  <rect x="300" y="245" width="180" height="62" rx="6" ry="6" fill="#f4f6f6" stroke="#8f9a9a" stroke-width="1.7" />
  <text x="390" y="269" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">Vagus &#8594; NTS</text>
  <text x="390" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">Stomach stretch</text>
  <rect x="300" y="375" width="180" height="62" rx="6" ry="6" fill="#f4f6f6" stroke="#8f9a9a" stroke-width="1.7" />
  <text x="390" y="399" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">AP / NTS</text>
  <text x="390" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">Gut satiety signals</text>
  <rect x="300" y="505" width="180" height="62" rx="6" ry="6" fill="#f4f6f6" stroke="#8f9a9a" stroke-width="1.7" />
  <text x="390" y="529" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#07343d" text-anchor="middle">Sensory + Limbic</text>
  <text x="390" y="550" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#466168" text-anchor="middle">Learned predictors</text>
  
