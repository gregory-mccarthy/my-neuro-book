  <path d="M 298,536 L 286,541 L 286,531 Z" fill="#586f76" />
  
  <!-- ===== Relays into the hypothalamic controller ===== -->
  <path d="M 480 146 C 510 146, 510 226, 518 226" fill="none" stroke="#586f76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 528,226 L 516,231 L 516,221 Z" fill="#586f76" />
