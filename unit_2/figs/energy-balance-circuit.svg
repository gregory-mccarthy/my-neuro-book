<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="620" viewBox="0 0 1230 620" role="img" aria-labelledby="title desc">
  <title id="title">The Hypothalamic Energy Balance Circuit</title>
  <desc id="desc">A flow diagram showing energy balance inputs from adipose tissue, stomach, gut, nutrients, and food cues; their relays through median eminence access, vagal brainstem relays, area postrema and sensory-limbic pathways; integration in ARC, PVN, and LH; and outputs to feeding, meal termination, expenditure, and fuel allocation.</desc>
  <rect x="0" y="0" width="1230" height="620" rx="0" ry="0" fill="#ffffff" stroke="none" stroke-width="0" />
  
  <!-- Title and column headers -->
  <text x="630" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#07343d" text-anchor="middle">The Hypothalamic Energy Balance Circuit</text>
  <text x="120" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#637176" text-anchor="middle" letter-spacing="1.4">BODY INPUTS</text>
  <text x="390" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#637176" text-anchor="middle" letter-spacing="1.4">RELAYS</text>
  <text x="630" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#637176" text-anchor="middle" letter-spacing="1.4">HYPOTHALAMUS</text>
  <text x="880" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#637176" text-anchor="middle" letter-spacing="1.4">EFFERENT RELAYS</text>
  <text x="1110" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#637176" text-anchor="middle" letter-spacing="1.4">EFFECTORS</text>
  
  <!-- ===== Humoral route: one shared bloodstream trunk into the ME ===== -->
  <path d="M 274 518 L 274 146 L 286 146" fill="none" stroke="#c54b48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" />
  <path d="M 298,146 L 286,151 L 286,141 Z" fill="#c54b48" />
  <path d="M 210 146 L 274 146" fill="none" stroke="#c54b48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" />
  <text x="240" y="139" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7f5551" text-anchor="middle">blood</text>
  <path d="M 210 258 L 274 258" fill="none" stroke="#c54b48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" />
  <text x="240" y="251" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7f5551" text-anchor="middle">ghrelin</text>
  <path d="M 210 388 L 274 388" fill="none" stroke="#c54b48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" />
  <text x="240" y="381" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7f5551" text-anchor="middle">peptides</text>
  <path d="M 210 518 L 274 518" fill="none" stroke="#c54b48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" />
  <text x="240" y="511" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7f5551" text-anchor="middle">nutrients</text>
  
  <!-- ===== Neural afferents into the relays ===== -->
  <path d="M 210 276 L 288 276" fill="none" stroke="#586f76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 298,276 L 286,281 L 286,271 Z" fill="#586f76" />
  <path d="M 210 406 L 288 406" fill="none" stroke="#586f76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 298,406 L 286,411 L 286,401 Z" fill="#586f76" />
