<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="170mm" height="141.7mm" viewBox="0 0 1200 1000"
     font-family="Georgia, 'Times New Roman', Times, serif"
     role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">The same control state changes throughout the choice</title>
  <desc id="fig-desc">Panel A, one continuing episode, shows three landscape thumbnails with identical geography: shrubs at lower left, a pond labeled water at upper right, open ground between, and a belt of vegetation curving along the bottom and right side to the same pond edge. A short ochre dashed route crosses the open ground; a longer sage dashed route follows the vegetation. In Pause, an antlerless deer stands at the cover edge with its head raised toward the water and one ear turned; both routes are unchosen. In Sample, the deer is at the same spot with its head turned toward the vegetation route, which is slightly more salient. In Proceed, the deer has begun walking along the sheltered route; a short solid sage segment marks the distance travelled, the rest of the route remains dashed, and the exposed route is faint. Gray arrows between thumbnails indicate time. Note: illustrative episode; the outcome remains uncertain. Panel B, interacting processes, shows four equal nodes: expected consequences, action priorities, movement and sampling, and bodily state and preparation. Teal arrows show functional influences: expected consequences and bodily state influence each other; expected consequences and action priorities influence each other; action priorities influence movement and sampling; movement and sampling influence expected consequences and bodily state; bodily state influences action priorities. The two diagonal arrows cross with a gap and do not meet at a hub. Under the body node: thirst, effort, visceral feedback. Under expected consequences: same water; changing significance. Key: arrows are functional influences. Footer: control-theoretic synthesis.</desc>

  <defs>
    <style>
      text { fill: #2B2B2B; }
      .lbl  { font-size: 23px; }
      .sm   { font-size: 20px; }
      .note { font-size: 20px; font-style: italic; fill: #555555; }
      .ttl  { font-size: 25px; font-weight: bold; }
      .pnl  { font-size: 32px; font-weight: bold; }
      .bold { font-weight: bold; }
      .mid  { text-anchor: middle; }
      .end  { text-anchor: end; }
      .deer-fill { fill: #D6B892; stroke: #7A6448; stroke-width: 1.1; stroke-linejoin: round; }
      .deer-leg  { fill: none; stroke: #6E5A42; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
    </style>

    <marker id="ah-teal" viewBox="0 0 14 10" refX="12" refY="5" markerWidth="14" markerHeight="10"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L14,5 L0,10 Z" fill="#528B81"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 14 10" refX="12" refY="5" markerWidth="14" markerHeight="10"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L14,5 L0,10 Z" fill="#8C8C8C"/>
    </marker>

    <!-- Shared landscape: identical geography in all three thumbnails -->
    <symbol id="landscape" viewBox="0 0 350 250">
      <rect x="0" y="0" width="350" height="250" fill="#F5F2E6"/>
      <g id="pond">
        <path d="M196,82 C196,56 230,40 262,42 C296,44 318,60 316,82 C314,104 290,118 260,119 C228,119 196,106 196,82 Z"
              fill="#DCE8F2" stroke="#527FA5" stroke-width="1.6"/>
      </g>
      <!-- Shrubs at lower left (cover): outline pass, then fill pass to merge outlines -->
      <g id="cover-shrubs">
        <g fill="none" stroke="#7FA79B" stroke-width="2.6">
          <circle cx="16" cy="234" r="26"/><circle cx="52" cy="242" r="24"/><circle cx="86" cy="238" r="22"/>
          <circle cx="12" cy="196" r="20"/><circle cx="44" cy="204" r="22"/><circle cx="78" cy="210" r="19"/>
          <circle cx="104" cy="224" r="16"/><circle cx="28" cy="170" r="15"/><circle cx="58" cy="178" r="15"/>
        </g>
        <g fill="#D4E4DA">
          <circle cx="16" cy="234" r="26"/><circle cx="52" cy="242" r="24"/><circle cx="86" cy="238" r="22"/>
          <circle cx="12" cy="196" r="20"/><circle cx="44" cy="204" r="22"/><circle cx="78" cy="210" r="19"/>
          <circle cx="104" cy="224" r="16"/><circle cx="28" cy="170" r="15"/><circle cx="58" cy="178" r="15"/>
        </g>
      </g>
      <!-- Longer vegetation belt curving along the bottom and right side to the pond -->
      <g id="vegetation-belt">
        <g fill="none" stroke="#7FA79B" stroke-width="2.4">
          <circle cx="132" cy="246" r="14"/><circle cx="158" cy="243" r="14"/><circle cx="184" cy="245" r="15"/>
          <circle cx="210" cy="243" r="14"/><circle cx="236" cy="245" r="15"/><circle cx="262" cy="242" r="14"/>
          <circle cx="288" cy="240" r="15"/><circle cx="314" cy="232" r="15"/><circle cx="336" cy="212" r="15"/>
          <circle cx="342" cy="186" r="14"/><circle cx="344" cy="160" r="14"/><circle cx="340" cy="135" r="13"/>
        </g>
        <g fill="#D4E4DA">
          <circle cx="132" cy="246" r="14"/><circle cx="158" cy="243" r="14"/><circle cx="184" cy="245" r="15"/>
          <circle cx="210" cy="243" r="14"/><circle cx="236" cy="245" r="15"/><circle cx="262" cy="242" r="14"/>
          <circle cx="288" cy="240" r="15"/><circle cx="314" cy="232" r="15"/><circle cx="336" cy="212" r="15"/>
          <circle cx="342" cy="186" r="14"/><circle cx="344" cy="160" r="14"/><circle cx="340" cy="135" r="13"/>
        </g>
      </g>
    </symbol>

  </defs>

  <rect id="background" x="0" y="0" width="1200" height="1000" fill="#FFFFFF"/>

  <!-- ============================ PANEL A ============================ -->
  <g id="panel-A">
    <g id="A-heading">
      <text class="pnl" x="30" y="58">A</text>
      <text class="ttl" x="74" y="55">One continuing episode</text>
    </g>

    <!-- Scene 1: Pause -->
    <g id="scene-1-pause">
      <text class="lbl bold mid" x="205" y="102">Pause</text>
      <g transform="translate(30,116)">
        <use xlink:href="#landscape" href="#landscape" x="0" y="0" width="350" height="250"/>
        <text class="sm mid" x="256" y="87" font-style="italic" fill="#3F6488" style="fill:#3F6488">Water</text>
        <path id="s1-exposed-route" d="M152,198 C180,170 222,140 256,121" fill="none" stroke="#B98B43" stroke-width="2.4" stroke-dasharray="7 5"/>
        <path id="s1-sheltered-route" d="M150,212 C190,226 258,228 296,214 C326,202 330,160 312,138 C298,122 278,120 262,121" fill="none" stroke="#528B81" stroke-width="2.4" stroke-dasharray="7 5"/>
        <g id="s1-deer-pause" transform="translate(140,214) scale(1.35)">
          <path class="deer-leg" d="M-13,-22 L-16,-11 L-14,0 M-18,-23 L-20,-12 L-18,0 M15,-21 L15,-10 L15,0 M10,-21 L11,-10 L11,0"/>
          
          <path d="M-21,-35 C-26,-34 -27,-29 -23,-27 Z" fill="#F4EDE2" stroke="#7A6448" stroke-width="0.9"/>
          <path class="deer-fill" d="M-20,-38 C-14,-42 0,-41 10,-41 C14,-44 18,-52 21,-60 L28,-57 C26,-49 24,-40 22,-32 C22,-26 20,-21 16,-20 L-16,-20 C-22,-21 -25,-26 -23,-32 C-23,-35 -22,-37 -20,-38 Z"/>
          <ellipse class="deer-fill" cx="22" cy="-68" rx="2.6" ry="6.5" transform="rotate(-25 22 -68)"/>
          <ellipse class="deer-fill" cx="27" cy="-67" rx="2.6" ry="6" transform="rotate(48 27 -67)"/>
          <ellipse class="deer-fill" cx="29" cy="-61" rx="8.5" ry="4.4" transform="rotate(-30 29 -61)"/>
          <circle cx="28.5" cy="-62.5" r="1.1" fill="#3A2E22"/>
        </g>
      </g>
      <rect x="30" y="116" width="350" height="250" rx="10" fill="none" stroke="#CFC8B6" stroke-width="1.4"/>
    </g>

    <!-- Scene 2: Sample -->
    <g id="scene-2-sample">
      <text class="lbl bold mid" x="600" y="102">Sample</text>
      <g transform="translate(425,116)">
        <use xlink:href="#landscape" href="#landscape" x="0" y="0" width="350" height="250"/>
        <path id="s2-exposed-route" d="M152,198 C180,170 222,140 256,121" fill="none" stroke="#B98B43" stroke-width="2.4" stroke-dasharray="7 5"/>
        <path id="s2-sheltered-route-salient" d="M150,212 C190,226 258,228 296,214 C326,202 330,160 312,138 C298,122 278,120 262,121" fill="none" stroke="#3F7369" stroke-width="3.4" stroke-dasharray="8 5"/>
        <g id="s2-deer-sample" transform="translate(140,214) scale(1.35)">
          <path class="deer-leg" d="M-13,-22 L-16,-11 L-14,0 M-18,-23 L-20,-12 L-18,0 M15,-21 L15,-10 L15,0 M10,-21 L11,-10 L11,0"/>
          
          <path d="M-21,-35 C-26,-34 -27,-29 -23,-27 Z" fill="#F4EDE2" stroke="#7A6448" stroke-width="0.9"/>
          <path class="deer-fill" d="M-20,-38 C-14,-42 0,-41 10,-41 C17,-42 25,-40 31,-35 L33,-29 C28,-28 24,-27 21,-25 C20,-22 19,-21 16,-20 L-16,-20 C-22,-21 -25,-26 -23,-32 C-23,-35 -22,-37 -20,-38 Z"/>
          <ellipse class="deer-fill" cx="32" cy="-41" rx="2.6" ry="6.5" transform="rotate(-8 32 -41)"/>
          <ellipse class="deer-fill" cx="35.5" cy="-40" rx="2.6" ry="6" transform="rotate(22 35.5 -40)"/>
          <ellipse class="deer-fill" cx="38" cy="-30" rx="8.5" ry="4.4" transform="rotate(38 38 -30)"/>
          <circle cx="37" cy="-31.5" r="1.1" fill="#3A2E22"/>
        </g>
      </g>
      <rect x="425" y="116" width="350" height="250" rx="10" fill="none" stroke="#CFC8B6" stroke-width="1.4"/>
    </g>

    <!-- Scene 3: Proceed -->
    <g id="scene-3-proceed">
      <text class="lbl bold mid" x="995" y="102">Proceed</text>
      <g transform="translate(820,116)">
        <use xlink:href="#landscape" href="#landscape" x="0" y="0" width="350" height="250"/>
        <path id="s3-exposed-route-faint" d="M152,198 C180,170 222,140 256,121" fill="none" stroke="#B98B43" stroke-width="2.2" stroke-dasharray="7 5" opacity="0.35"/>
        <path id="s3-sheltered-route-travelled" d="M150,212 C164,216.9 181.4,220.3 199.8,222.1" fill="none" stroke="#528B81" stroke-width="3.2" stroke-linecap="round"/>
        <path id="s3-sheltered-route-remaining" d="M199.8,222.1 C233.9,225.4 271.3,223.1 296,214 C326,202 330,160 312,138 C298,122 278,120 262,121" fill="none" stroke="#528B81" stroke-width="2.4" stroke-dasharray="7 5"/>
        <g id="s3-deer-proceed" transform="translate(196,223) scale(1.35)">
          <path class="deer-leg" d="M-13,-22 L-10,-11 L-8,0 M-18,-23 L-23,-12 L-26,-2 M15,-21 L19,-11 L22,0 M10,-21 L8,-11 L4,-3"/>
          
          <path d="M-21,-35 C-26,-34 -27,-29 -23,-27 Z" fill="#F4EDE2" stroke="#7A6448" stroke-width="0.9"/>
          <path class="deer-fill" d="M-20,-38 C-14,-42 0,-41 10,-41 C15,-45 21,-50 26,-55 L32,-51 C28,-44 24,-36 22,-30 C21,-25 19,-21 16,-20 L-16,-20 C-22,-21 -25,-26 -23,-32 C-23,-35 -22,-37 -20,-38 Z"/>
          <ellipse class="deer-fill" cx="27" cy="-62" rx="2.6" ry="6.5" transform="rotate(-20 27 -62)"/>
          <ellipse class="deer-fill" cx="31" cy="-61" rx="2.6" ry="6" transform="rotate(52 31 -61)"/>
          <ellipse class="deer-fill" cx="35" cy="-54" rx="8.5" ry="4.4" transform="rotate(8 35 -54)"/>
          <circle cx="34.5" cy="-55.5" r="1.1" fill="#3A2E22"/>
        </g>
      </g>
      <rect x="820" y="116" width="350" height="250" rx="10" fill="none" stroke="#CFC8B6" stroke-width="1.4"/>
    </g>

    <g id="A-time-arrows" fill="none" stroke="#8C8C8C" stroke-width="2">
      <path d="M386,241 L418,241" marker-end="url(#ah-gray)"/>
      <path d="M781,241 L813,241" marker-end="url(#ah-gray)"/>
    </g>

    <text id="A-scene-note" class="note mid" x="600" y="404">Illustrative episode; the outcome remains uncertain</text>
  </g>

  <line id="divider-A-B" x1="30" y1="434" x2="1170" y2="434" stroke="#D9D4CA" stroke-width="1.2"/>

  <!-- ============================ PANEL B ============================ -->
  <g id="panel-B">
    <g id="B-heading">
      <text class="pnl" x="30" y="484">B</text>
      <text class="ttl" x="74" y="481">Interacting processes</text>
    </g>

    <g id="B-nodes">
      <g id="node-expected-consequences">
        <rect x="90" y="530" width="300" height="84" rx="12" fill="#F6F3EC" stroke="#8F897D" stroke-width="1.6"/>
        <text class="lbl mid" x="240" y="580">Expected consequences</text>
      </g>
      <g id="node-action-priorities">
        <rect x="810" y="530" width="300" height="84" rx="12" fill="#F6F3EC" stroke="#8F897D" stroke-width="1.6"/>
        <text class="lbl mid" x="960" y="580">Action priorities</text>
      </g>
      <g id="node-movement-and-sampling">
        <rect x="810" y="820" width="300" height="84" rx="12" fill="#F6F3EC" stroke="#8F897D" stroke-width="1.6"/>
        <text class="lbl mid" x="960" y="870">Movement and sampling</text>
      </g>
      <g id="node-bodily-state-and-preparation">
        <rect x="90" y="820" width="300" height="84" rx="12" fill="#F6F3EC" stroke="#8F897D" stroke-width="1.6"/>
        <text class="lbl mid" x="252" y="857">Bodily state and</text>
        <text class="lbl mid" x="252" y="884">preparation</text>
      </g>
    </g>

    <g id="B-supporting-labels">
      <text class="note" x="172" y="644">Same water;</text>
      <text class="note" x="172" y="668">changing significance</text>
      <text class="note" x="100" y="934">Thirst, effort, visceral feedback</text>
    </g>

    <!-- Functional influences (teal). Reciprocal pairs use two separated arrows. -->
    <g id="B-functional-arrows" fill="none" stroke="#528B81" stroke-width="2.4">
      <path id="expected-to-action" d="M392,560 L805,560" marker-end="url(#ah-teal)"/>
      <path id="action-to-expected" d="M808,584 L395,584" marker-end="url(#ah-teal)"/>
      <path id="expected-to-bodily" d="M122,616 L122,815" marker-end="url(#ah-teal)"/>
      <path id="bodily-to-expected" d="M148,818 L148,619" marker-end="url(#ah-teal)"/>
      <path id="action-to-movement" d="M1010,616 L1010,815" marker-end="url(#ah-teal)"/>
      <path id="movement-to-bodily" d="M808,862 L395,862" marker-end="url(#ah-teal)"/>
      <path id="bodily-to-action" d="M350,818 L847.2,618.2" marker-end="url(#ah-teal)"/>
      <!-- crossover gap: white underlay breaks the lower arrow where the paths cross -->
      <path d="M646,736.5 L554,699.5" stroke="#FFFFFF" stroke-width="12" stroke-linecap="butt"/>
      <path id="movement-to-expected" d="M850,818 L352.8,618.2" marker-end="url(#ah-teal)"/>
    </g>

    <text id="B-key" class="sm end" x="1110" y="934">Arrows: functional influences</text>
  </g>

  <g id="footer">
    <line x1="30" y1="954" x2="1170" y2="954" stroke="#D9D4CA" stroke-width="1.2"/>
    <text class="lbl mid" x="600" y="986" font-style="italic">Control-theoretic synthesis</text>
  </g>
</svg>
