<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1090" width="1500" height="1090" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" role="img" aria-labelledby="figure-05-title figure-05-description">
<title id="figure-05-title">Shared value information across distinct outcome categories</title>
<desc id="figure-05-description">Conceptual schematic of two kinds of human fMRI evidence. Panel A shows positive regional relationships between subjective value and mean BOLD for food, consumer items, and monetary gambles, bracketed as an overlapping ventromedial prefrontal region. All categories used an 80 percent chance of receiving the item. Panel B shows a classifier trained on low and high value food patterns and tested on consumer-item patterns. Low and high are defined within each participant and category. The four abstract grids have different spatial arrangements and identical shade distributions; no subset of tiles is highlighted as value-specific. A bottom band notes category-dependent value information in more ventral medial orbitofrontal cortex. The lines and grids are teaching constructions, not data or voxel maps.</desc>
