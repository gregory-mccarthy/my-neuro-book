        <line class="seq" x1="336" y1="379" x2="343" y2="379"/>
        <polygon class="seq-head" points="348,379 342,375.5 342,382.5"/>
        <line class="seq" x1="704" y1="379" x2="711" y2="379"/>
        <polygon class="seq-head" points="716,379 710,375.5 710,382.5"/>
        <line class="seq" x1="336" y1="455" x2="343" y2="455"/>
        <polygon class="seq-head" points="348,455 342,451.5 342,458.5"/>
        <line class="seq" x1="704" y1="455" x2="711" y2="455"/>
        <polygon class="seq-head" points="716,455 710,451.5 710,458.5"/>
      </g>
      <g id="B-task-notes" inkscape:label="B response instructions">
