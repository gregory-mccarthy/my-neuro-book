        <text class="support mid" x="779" y="497">Press both buttons</text>
      </g>
    </g>
    <g id="B-plots" inkscape:label="B BOLD plots">
      <text id="B-plot-pair-label" class="subtitle" x="204" y="522">Schematic memory-trial responses</text>
      <g id="B-guides" inkscape:label="B stage-boundary guides">
        <line class="guide" x1="342" y1="548" x2="342" y2="674"/>
        <line class="guide" x1="710" y1="548" x2="710" y2="674"/>
        <line class="guide" x1="848" y1="548" x2="848" y2="674"/>
