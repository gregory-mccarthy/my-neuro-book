          <path d="M520,455 H532 M526,449 V461" stroke="#3f3b36" stroke-width="1.8" stroke-linecap="round"/>
        </g>
        <g id="B-control-test">
          <rect class="tile" x="717" y="432" width="124" height="46" rx="4"/>
          <use xlink:href="#face-scrambled" x="762" y="434.2" width="34" height="41.6"/>
        </g>
      </g>
