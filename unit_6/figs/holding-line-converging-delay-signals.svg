        </g>
        <g id="B-memory-test">
          <rect class="tile" x="717" y="356" width="124" height="46" rx="4"/>
          <use xlink:href="#face-neutral" x="762" y="358.2" width="34" height="41.6"/>
        </g>
      </g>
      <g id="B-control-row" inkscape:label="Control row">
