<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="170mm" height="127.50mm" viewBox="0 0 960 720">
  <title>Human signals across a delay</title>
  <desc>Schematic figure in two panels: a contingent negative variation in a warning–imperative task, and illustrative BOLD response profiles in a delayed face-matching task.</desc>

  <!-- Scale: 960 units = 170 mm print width, so 1 unit ≈ 0.5 pt.
       Labels 18 units ≈ 9 pt; supporting notes 16–17 units ≈ 8–8.5 pt. -->
  <style>
    text { font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', 'Liberation Serif', serif; fill: #2b2925; }
    .fig-title    { font-size: 26px; font-weight: 600; }
    .panel-letter { font-size: 22px; font-weight: 700; }
    .panel-title  { font-size: 20px; font-weight: 600; }
    .label        { font-size: 18px; }
    .support      { font-size: 17px; }
    .key          { font-size: 16px; }
    .subtitle     { font-size: 17px; font-style: italic; fill: #6e6a63; }
    .note         { font-size: 16px; font-style: italic; fill: #6e6a63; }
    .annot        { font-size: 17px; font-style: italic; }
    .muted        { fill: #6e6a63; }
    .teal-text    { fill: #2a7a73; }
    .lav-text     { fill: #5f5099; }
    .mid          { text-anchor: middle; }
    .end          { text-anchor: end; }
    .axis         { fill: none; stroke: #4a4741; stroke-width: 1.4; }
    .axis-head    { fill: #4a4741; }
    .guide        { fill: none; stroke: #c4bdb1; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .seq          { fill: none; stroke: #a7a198; stroke-width: 1.6; }
    .seq-head     { fill: #a7a198; }
    .tile         { fill: #e8e4dc; stroke: #d2ccc0; stroke-width: 1; }
  </style>
  <defs>
    <symbol id="face-neutral" viewBox="0 0 36 44" inkscape:label="Neutral face symbol">
      <ellipse cx="18" cy="18" rx="14" ry="14.5" fill="#6f6a63"/>
      <ellipse cx="6.4" cy="23.5" rx="1.9" ry="3.3" fill="#c9c3ba"/>
      <ellipse cx="29.6" cy="23.5" rx="1.9" ry="3.3" fill="#c9c3ba"/>
      <ellipse cx="18" cy="23" rx="11.6" ry="15.2" fill="#d6d1c9"/>
      <path d="M6.6,20 C6.8,9 12.6,4.6 18,4.6 C23.4,4.6 29.2,9 29.4,20 C27.4,14 23,11.6 18,11.6 C13,11.6 8.6,14 6.6,20 Z" fill="#6f6a63"/>
      <path d="M11.6,17.6 L15.6,17.1 M20.4,17.1 L24.4,17.6" stroke="#57524c" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <ellipse cx="13.7" cy="20.8" rx="1.55" ry="1.1" fill="#3f3b36"/>
      <ellipse cx="22.3" cy="20.8" rx="1.55" ry="1.1" fill="#3f3b36"/>
      <path d="M18,22 L17,28.3 L19.1,28.6" stroke="#a39c92" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M14.8,32.6 L21.2,32.6" stroke="#8a8279" stroke-width="1.2" stroke-linecap="round"/>
    </symbol>
    <filter id="soft-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <clipPath id="scramble-clip"><rect x="0" y="0" width="36" height="44" rx="5"/></clipPath>
    <symbol id="face-scrambled" viewBox="0 0 36 44" inkscape:label="Scrambled face symbol">
      <g clip-path="url(#scramble-clip)"><g filter="url(#soft-blur)">
      <g opacity="0.92">
        <rect x="1" y="2" width="12" height="11" rx="3.5" fill="#cfcac2"/>
        <rect x="11" y="1" width="11" height="12" rx="3.5" fill="#7a746c"/>
        <rect x="21" y="3" width="13" height="10" rx="3.5" fill="#d8d3cb"/>
        <rect x="2" y="12" width="10" height="11" rx="3.5" fill="#9b958c"/>
        <rect x="10" y="12" width="13" height="10" rx="3.5" fill="#d3cec6"/>
        <rect x="22" y="11" width="11" height="12" rx="3.5" fill="#6f6a63"/>
        <rect x="1" y="22" width="13" height="11" rx="3.5" fill="#c4beb5"/>
        <rect x="13" y="21" width="10" height="12" rx="3.5" fill="#8c867e"/>
        <rect x="22" y="22" width="12" height="10" rx="3.5" fill="#d6d1c9"/>
        <rect x="2" y="32" width="11" height="10" rx="3.5" fill="#a9a399"/>
        <rect x="12" y="31" width="12" height="11" rx="3.5" fill="#d0cbc3"/>
        <rect x="23" y="31" width="11" height="11" rx="3.5" fill="#857f77"/>
      </g>
      <g opacity="0.45">
        <rect x="8" y="7" width="9" height="9" rx="4" fill="#bdb7ae"/>
        <rect x="19" y="17" width="9" height="9" rx="4" fill="#a9a399"/>
        <rect x="6" y="27" width="9" height="9" rx="4" fill="#bdb7ae"/>
        <rect x="18" y="35" width="9" height="7" rx="3.5" fill="#9b958c"/>
      </g>
      </g></g>
    </symbol>
  </defs>
  <g id="background" inkscape:label="Background"><rect width="960" height="720" fill="#fcfaf5"/></g>
  <g id="figure-title" inkscape:label="Figure title">
    <text class="fig-title" x="24" y="32">Human signals across a delay</text>
  </g>
  <g id="layout-rules" inkscape:label="Layout rules" stroke="#e4ded2" stroke-width="1">
    <line x1="24" y1="276" x2="936" y2="276"/>
  </g>

  <!-- ===================== PANEL A ===================== -->
  <g id="panel-A" inkscape:label="Panel A – Preparing for an event">
    <g id="A-header" inkscape:label="A header">
      <text class="panel-letter" x="24" y="64">A</text>
      <text x="50" y="64"><tspan class="panel-title">Preparing for an event</tspan><tspan class="subtitle" dx="14">Scalp EEG · CNV</tspan></text>
    </g>
    <!-- Time scale A: 135 units/s. S1 at x=285, S2 at x=690 (3 s later), response at x=730.5. -->
    <g id="A-task" inkscape:label="A task events">
      <text class="label end" x="192" y="116">Go trial</text>
      <g id="A-event-labels">
        <text class="label mid" x="285" y="92">Warning tone (S1)</text>
        <text class="label mid" x="690" y="92">Imperative tone (S2)</text>
        <text class="label" x="744.5" y="116">Button response</text>
      </g>
      <g id="A-event-markers">
        <circle id="A-S1-marker" cx="285" cy="110" r="5.5" fill="#4a4741"/>
        <circle id="A-S2-marker" cx="690" cy="110" r="5.5" fill="#4a4741"/>
        <rect id="A-response-marker" x="725.5" y="105" width="10" height="10" rx="1.5" fill="#fcfaf5" stroke="#4a4741" stroke-width="1.6"/>
      </g>
      <g id="A-sequence-arrows" inkscape:label="A temporal-order arrows">
        <line class="seq" x1="295" y1="110" x2="673" y2="110"/>
        <polygon class="seq-head" points="681,110 672,105.5 672,114.5"/>
        <line class="seq" x1="700" y1="110" x2="715.5" y2="110"/>
        <polygon class="seq-head" points="721.5,110 714.5,106 714.5,114"/>
      </g>
      <g id="A-interval-bracket" inkscape:label="A 3 s bracket">
        <path d="M285,120 V126 H463.5 M511.5,126 H690 V120" fill="none" stroke="#8a857d" stroke-width="1.2"/>
        <text class="label mid" x="487.5" y="132">3 s</text>
      </g>
    </g>
    <g id="A-guides" inkscape:label="A S1/S2 guides">
      <line id="A-guide-S1" class="guide" x1="285" y1="128" x2="285" y2="212"/>
      <line id="A-guide-S2" class="guide" x1="690" y1="128" x2="690" y2="212"/>
    </g>
    <g id="A-axes" inkscape:label="A axes">
