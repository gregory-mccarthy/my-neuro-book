    </g>
    <g id="A-annotations" inkscape:label="A annotations">
      <text class="label lav-text mid" x="575.2" y="195">CNV</text>
      <text class="note end" x="866" y="160">Schematic</text>
    </g>
    <g id="A-findings" inkscape:label="A findings">
      <text class="support" x="50" y="240">Prefrontal lesions reduce late CNV</text>
      <text class="support" x="50" y="261">Subdural recordings reveal multiple cortical contributors</text>
    </g>
  </g>

  <!-- ===================== PANEL B ===================== -->
  <g id="panel-B" inkscape:label="Panel B – Remembering a face">
    <g id="B-header" inkscape:label="B header">
      <text class="panel-letter" x="24" y="302">B</text>
      <text x="50" y="302"><tspan class="panel-title">Remembering a face</tspan><tspan class="subtitle" dx="14">fMRI · BOLD</tspan></text>
    </g>
    <!-- Time scale B: 46 units/s from sample onset (x=204). Stage boundaries x = 204, 342, 710, 848 (3 s : 8 s : 3 s). -->
    <g id="B-task" inkscape:label="B task rows">
      <g id="B-stage-headers" inkscape:label="B stage names and durations">
        <text class="label mid" x="273" y="328">Sample</text>
        <text class="support muted mid" x="273" y="347">3 s</text>
        <text class="label mid" x="526" y="328">Fixation delay</text>
        <text class="support muted mid" x="526" y="347">8 s</text>
        <text class="label mid" x="779" y="328">Test</text>
        <text class="support muted mid" x="779" y="347">3 s</text>
      </g>
      <g id="B-row-labels" inkscape:label="B row labels">
