<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1200 1480" width="170mm" height="209.67mm" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Choosing to help and exerting effort to help are separable</title>
<desc id="fig-desc">Three panels. A: abbreviated prosocial handgrip task. A recipient card (self or other) precedes a choice between Rest (no grip effort, 1 credit) and Work (30–70% of maximum grip, 2–10 credits); effort and reward varied independently. If work is chosen, the same participant squeezes a hand-held dynamometer beside a schematic gauge marking the target without an example force level; success requires force at or above the target for at least 1 s within 3 s, and credits are earned only if successful. Rest goes around the grip stage to 1 credit. The trial's recipient sets whether credits go to the Self or the Other wallet. Group sizes: vmPFC damage 25, other lesions 15, healthy comparison 40. B: two measures. Choice/effort discounting showed a greater self–other difference after vmPFC damage compared with both control groups; force after accepting work showed lower other-relative-to-self force compared with healthy participants, while the force contrast with the other-lesion group was not significant. C: within the lesion sample, medial vmPFC damage was associated with lower and more lateral orbital damage with higher relative prosociality, relative to other sampled lesion locations; a different analysis from the group comparisons.</desc>
