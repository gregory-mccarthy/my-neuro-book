<title id="figure-02-title">Figure 2. Inferring an exchange rate from repeated choices</title>
<desc id="figure-02-description">Schematic teaching figure. A: juice-choice task with simultaneous colored-square offers and an eye-movement report. B: schematic choice curve, P(choose B) against the offered quantity ratio qB/qA on a log axis, crossing 0.5 at an illustrative 1A ≈ 3B. Not a reconstruction of published data. Both offered quantities and left/right positions vary across trials.</desc>
