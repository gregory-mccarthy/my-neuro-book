<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="170mm" height="136mm" viewBox="0 0 1200 960"
     font-family="Georgia, 'Times New Roman', Times, serif"
     role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Knowing a consequence and using it can separate</title>
  <desc id="fig-desc">Three separate evidence sources are aligned in two columns: available information or ability on the left and observed difficulty on the right. No arrows connect the columns. Row A, EVR, a clinical case: a test sheet and pencil stand for many conventional abilities preserved; a calendar, briefcase and house stand for personal and professional organization impaired. Row B, gambling patients, report and choice, some patients: four neutral decks A to D with a report sheet beside the A and B group stand for disadvantageous decks identified; the same decks with a pointer selecting the A and B group stand for disadvantageous choices continued. Row C, goal neglect, a comparison: an instruction card stands for a task requirement that can be reported; a task screen with one unchecked item stands for the requirement omitted in performance. Teaching line: available information must influence action. Qualification: related control problem; distinct evidence. Icons are illustrative.</desc>

  <defs>
    <style>
      text { fill: #2B2B2B; }
      .lbl  { font-size: 23px; }
      .sm   { font-size: 20px; }
      .note { font-size: 20px; font-style: italic; fill: #555555; }
      .pnl  { font-size: 32px; font-weight: bold; }
      .bold { font-weight: bold; }
      .mid  { text-anchor: middle; }
      .end  { text-anchor: end; }
    </style>

    <!-- Generic neutral deck stack -->
    <symbol id="deck" viewBox="0 0 76 96">
      <rect x="10" y="2" width="62" height="84" rx="6" fill="#EEF2F6" stroke="#6E7C8A" stroke-width="1.4"/>
      <rect x="6" y="6" width="62" height="84" rx="6" fill="#EEF2F6" stroke="#6E7C8A" stroke-width="1.4"/>
      <rect x="2" y="10" width="62" height="84" rx="6" fill="#EEF2F6" stroke="#6E7C8A" stroke-width="1.4"/>
      <rect x="9" y="17" width="48" height="70" rx="3" fill="none" stroke="#B4C0CC" stroke-width="1.2"/>
    </symbol>
    <!-- Report sheet -->
    <symbol id="report-sheet" viewBox="0 0 40 48">
      <path d="M3,2 L28,2 L37,11 L37,46 L3,46 Z" fill="#FFFFFF" stroke="#527FA5" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M28,2 L28,11 L37,11" fill="#EAF0F7" stroke="#527FA5" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M9,20 L31,20 M9,28 L31,28 M9,36 L24,36" fill="none" stroke="#8FA8C0" stroke-width="1.6"/>
    </symbol>
    <!-- Pointer -->
    <symbol id="pointer" viewBox="0 0 16 24">
      <path d="M1.5,1.5 L1.5,19 L6,14.5 L9.5,22 L12.5,20.5 L9,13.5 L15,13.5 Z" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.4" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect id="background" x="0" y="0" width="1200" height="960" fill="#FFFFFF"/>

  <!-- Column headings (once) -->
  <g id="column-headings">
    <text class="lbl bold mid" x="318" y="50">Available information / ability</text>
    <line x1="80" y1="64" x2="555" y2="64" stroke="#527FA5" stroke-width="2"/>
    <text class="lbl bold mid" x="882" y="50">Observed difficulty</text>
    <line x1="645" y1="64" x2="1120" y2="64" stroke="#B76F81" stroke-width="2"/>
  </g>

  <!-- ============================ ROW A ============================ -->
  <g id="row-A-EVR-clinical-case">
    <rect x="30" y="84" width="1140" height="232" rx="12" fill="#FBF9F4" stroke="#E2DDD2" stroke-width="1.2"/>
    <g id="A-badge">
      <text class="pnl" x="46" y="132">A</text>
      <rect x="86" y="100" width="242" height="42" rx="21" fill="#FFFFFF" stroke="#8F897D" stroke-width="1.4"/>
      <text class="lbl bold" x="102" y="129">EVR: clinical case</text>
    </g>
    <line x1="600" y1="160" x2="600" y2="300" stroke="#D9D4CA" stroke-width="1.2"/>

    <g id="A-left-preserved-abilities">
      <g id="icon-test-sheet-pencil">
        <rect x="92" y="168" width="74" height="96" rx="4" fill="#FFFFFF" stroke="#527FA5" stroke-width="1.6"/>
        <path d="M104,186 L154,186 M104,198 L146,198" fill="none" stroke="#8FA8C0" stroke-width="1.6"/>
        <g fill="none" stroke="#8FA8C0" stroke-width="1.4">
          <circle cx="108" cy="218" r="4.5"/><circle cx="122" cy="218" r="4.5"/><circle cx="136" cy="218" r="4.5"/>
          <circle cx="108" cy="238" r="4.5"/><circle cx="122" cy="238" r="4.5"/><circle cx="136" cy="238" r="4.5"/>
        </g>
        <circle cx="122" cy="218" r="3" fill="#527FA5"/>
        <circle cx="108" cy="238" r="3" fill="#527FA5"/>
        <g transform="translate(176,212) rotate(35)">
          <rect x="-6" y="-38" width="12" height="62" rx="2" fill="#F2E6CC" stroke="#6F6F6F" stroke-width="1.3"/>
          <rect x="-6" y="-46" width="12" height="9" rx="2" fill="#E9D3D9" stroke="#6F6F6F" stroke-width="1.3"/>
          <path d="M-6,24 L0,38 L6,24 Z" fill="#F7EFE4" stroke="#6F6F6F" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M-2,33 L0,38 L2,33 Z" fill="#4A4A4A"/>
        </g>
      </g>
      <text class="lbl" x="232" y="222">Many conventional</text>
      <text class="lbl" x="232" y="250">abilities preserved</text>
    </g>

    <g id="A-right-organization-impaired">
      <g id="icon-calendar">
        <rect x="645" y="180" width="66" height="64" rx="5" fill="#FFFFFF" stroke="#B76F81" stroke-width="1.6"/>
        <rect x="645" y="180" width="66" height="15" rx="5" fill="#F6E9ED" stroke="#B76F81" stroke-width="1.6"/>
        <path d="M660,174 L660,186 M696,174 L696,186" fill="none" stroke="#B76F81" stroke-width="2.4" stroke-linecap="round"/>
        <g fill="none" stroke="#D6B3BE" stroke-width="1.2">
          <rect x="653" y="203" width="12" height="10"/><rect x="672" y="203" width="12" height="10"/><rect x="691" y="203" width="12" height="10"/>
          <rect x="653" y="223" width="12" height="10"/><rect x="672" y="223" width="12" height="10"/><rect x="691" y="223" width="12" height="10"/>
        </g>
      </g>
      <g id="icon-briefcase">
        <path d="M738,198 L738,191 Q738,186 743,186 L757,186 Q762,186 762,191 L762,198" fill="none" stroke="#B76F81" stroke-width="1.8"/>
        <rect x="724" y="198" width="52" height="38" rx="5" fill="#F6E9ED" stroke="#B76F81" stroke-width="1.6"/>
        <path d="M724,214 L776,214" fill="none" stroke="#B76F81" stroke-width="1.3"/>
      </g>
      <g id="icon-home">
        <path d="M794,214 L794,240 L834,240 L834,214" fill="#FFFFFF" stroke="#B76F81" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M788,216 L814,192 L840,216" fill="none" stroke="#B76F81" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        <rect x="809" y="225" width="10" height="15" fill="#F6E9ED" stroke="#B76F81" stroke-width="1.2"/>
      </g>
      <text class="lbl" x="862" y="222">Personal and professional</text>
      <text class="lbl" x="862" y="250">organization impaired</text>
    </g>
  </g>

  <!-- ============================ ROW B ============================ -->
  <g id="row-B-gambling-report-and-choice">
    <rect x="30" y="332" width="1140" height="272" rx="12" fill="#FBF9F4" stroke="#E2DDD2" stroke-width="1.2"/>
    <g id="B-badge">
      <text class="pnl" x="46" y="380">B</text>
      <rect x="86" y="348" width="472" height="42" rx="21" fill="#FFFFFF" stroke="#8F897D" stroke-width="1.4"/>
      <text class="lbl bold" x="102" y="377">Gambling patients: report and choice</text>
      <rect x="86" y="400" width="200" height="38" rx="6" fill="#F7EFE1" stroke="#B98B43" stroke-width="1.4"/>
      <text class="lbl bold" x="102" y="427">Some patients</text>
    </g>
    <line x1="600" y1="452" x2="600" y2="590" stroke="#D9D4CA" stroke-width="1.2"/>

    <g id="B-left-decks-identified">
      <use id="report-sheet-icon" xlink:href="#report-sheet" href="#report-sheet" x="70" y="470" width="46" height="56"/>
      <rect id="AB-group-identified" x="126" y="456" width="112" height="98" rx="8" fill="#EAF0F7" stroke="#527FA5" stroke-width="1.4"/>
      <use xlink:href="#deck" href="#deck" x="134" y="462" width="44" height="56"/>
      <use xlink:href="#deck" href="#deck" x="186" y="462" width="44" height="56"/>
      <use xlink:href="#deck" href="#deck" x="248" y="462" width="44" height="56"/>
      <use xlink:href="#deck" href="#deck" x="300" y="462" width="44" height="56"/>
      <text class="sm bold mid" x="155" y="543">A</text>
      <text class="sm bold mid" x="207" y="543">B</text>
      <text class="sm bold mid" x="269" y="543">C</text>
      <text class="sm bold mid" x="321" y="543">D</text>
      <text class="lbl" x="372" y="503">Disadvantageous</text>
      <text class="lbl" x="372" y="531">decks identified</text>
    </g>

    <g id="B-right-choices-continued">
      <rect id="AB-group-chosen" x="637" y="456" width="112" height="98" rx="8" fill="#F6E9ED" stroke="#B76F81" stroke-width="1.4"/>
      <use xlink:href="#deck" href="#deck" x="645" y="462" width="44" height="56"/>
      <use xlink:href="#deck" href="#deck" x="697" y="462" width="44" height="56"/>
      <use xlink:href="#deck" href="#deck" x="759" y="462" width="44" height="56"/>
      <use xlink:href="#deck" href="#deck" x="811" y="462" width="44" height="56"/>
      <text class="sm bold mid" x="666" y="543">A</text>
      <text class="sm bold mid" x="718" y="543">B</text>
      <text class="sm bold mid" x="780" y="543">C</text>
      <text class="sm bold mid" x="832" y="543">D</text>
      <use id="selecting-pointer" xlink:href="#pointer" href="#pointer" x="724" y="494" width="20" height="30"/>
      <text class="lbl" x="882" y="503">Disadvantageous</text>
      <text class="lbl" x="882" y="531">choices continued</text>
    </g>
  </g>

  <!-- ============================ ROW C ============================ -->
  <g id="row-C-goal-neglect-comparison">
    <rect x="30" y="620" width="1140" height="232" rx="12" fill="#FBF9F4" stroke="#E2DDD2" stroke-width="1.2"/>
    <g id="C-badge">
      <text class="pnl" x="46" y="668">C</text>
      <rect x="86" y="636" width="333" height="42" rx="21" fill="#FFFFFF" stroke="#8F897D" stroke-width="1.4"/>
      <text class="lbl bold" x="102" y="665">Goal neglect: comparison</text>
    </g>
    <line x1="600" y1="696" x2="600" y2="836" stroke="#D9D4CA" stroke-width="1.2"/>

    <g id="C-left-requirement-reportable">
      <g id="icon-instruction-card">
        <rect x="92" y="722" width="110" height="74" rx="6" fill="#FFFFFF" stroke="#527FA5" stroke-width="1.6"/>
        <rect x="92" y="722" width="110" height="16" rx="6" fill="#EAF0F7" stroke="#527FA5" stroke-width="1.6"/>
        <path d="M104,754 L190,754 M104,768 L190,768 M104,782 L162,782" fill="none" stroke="#8FA8C0" stroke-width="1.6"/>
      </g>
      <text class="lbl" x="232" y="756">Task requirement</text>
      <text class="lbl" x="232" y="784">can be reported</text>
    </g>

    <g id="C-right-requirement-omitted">
      <g id="icon-task-screen-checklist">
        <rect x="645" y="712" width="124" height="86" rx="6" fill="#FFFFFF" stroke="#B76F81" stroke-width="1.6"/>
        <path d="M697,798 L693,814 M717,798 L721,814 M685,814 L729,814" fill="none" stroke="#B76F81" stroke-width="1.6" stroke-linecap="round"/>
        <g fill="none" stroke="#9A9A9A" stroke-width="1.3">
          <rect x="657" y="724" width="14" height="14" rx="2"/>
          <rect x="657" y="747" width="14" height="14" rx="2"/>
          <rect x="657" y="770" width="14" height="14" rx="2"/>
        </g>
        <path d="M660,731 L663,735 L669,727 M660,754 L663,758 L669,750" fill="none" stroke="#4A4A4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M681,731 L755,731 M681,754 L745,754" fill="none" stroke="#C9C4BA" stroke-width="1.6"/>
        <path d="M681,777 L750,777" fill="none" stroke="#C9C4BA" stroke-width="1.6"/>
        <rect x="657" y="770" width="14" height="14" rx="2" fill="none" stroke="#B76F81" stroke-width="1.6"/>
      </g>
      <text class="lbl" x="808" y="756">Requirement omitted</text>
      <text class="lbl" x="808" y="784">in performance</text>
    </g>
  </g>

  <!-- Teaching line -->
  <g id="teaching-line">
    <text class="lbl mid" x="600" y="902">Available information must influence action.</text>
    <text class="note mid" x="600" y="934">Related control problem; distinct evidence</text>
    <text class="note end" x="1170" y="934">Icons illustrative</text>
  </g>
</svg>
