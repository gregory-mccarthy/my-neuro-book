<path d="M-9.5,0 C-17,1.6 -22,-3.6 -28,-3 C-31,-2.7 -33,-1.2 -34.5,-0.6" fill="none" stroke="#5B5853" stroke-width="2.3" stroke-linecap="round"/>
<ellipse cx="-1.5" cy="0" rx="11.5" ry="6.6" fill="#5B5853"/>
<path d="M4.5,-5.4 C10,-5.2 15,-2.6 19,0 C15,2.6 10,5.2 4.5,5.4 Z" fill="#5B5853"/>
<circle cx="7.6" cy="-5.3" r="2.9" fill="#8F8A83" stroke="#5B5853" stroke-width="1"/>
<circle cx="7.6" cy="5.3" r="2.9" fill="#8F8A83" stroke="#5B5853" stroke-width="1"/>
</g>
<g id="food-dish">
<circle cx="0" cy="0" r="11.5" fill="#FFFFFF" stroke="#B07D22" stroke-width="2.2"/>
<circle cx="-3.6" cy="-2.4" r="2.5" fill="#B07D22"/>
<circle cx="3.2" cy="-3.2" r="2.5" fill="#B07D22"/>
<circle cx="0.2" cy="2.2" r="2.5" fill="#B07D22"/>
<circle cx="-4.4" cy="3.4" r="2.5" fill="#B07D22"/>
<circle cx="4.6" cy="2.6" r="2.5" fill="#B07D22"/>
