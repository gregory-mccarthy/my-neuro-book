<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="170mm" height="102.6mm" viewBox="0 0 1200 724" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Knowledge can precede its expression: a schematic latent-learning sequence</title>
<desc id="fig-desc">Three aligned panels labeled schematic sequence show the same illustrative corridor maze, with a start box at lower left, a goal chamber at right, three junctions and three blind alleys. Panel A, experience without food: a rat is partway through the maze; a muted dashed line shows illustrative earlier movement, including one brief excursion into a blind alley; the empty goal chamber is labeled no food at goal; the panel is labeled repeated experience. Panel B, food introduced: the unchanged maze now has a food dish in the goal chamber and the rat is at the dish; the goal is labeled food now present; no route is highlighted. Panel C, later performance: the rat approaches the goal along a continuous highlighted route from start to goal, labeled fewer wrong turns and illustrative route; the highlighted route is not a recorded trajectory or a claim of an error-free run. Charcoal arrows between panels show phase order. A lower band shows an observation box, rapid improvement after food introduction, linked by a dashed arrow labeled supports to an inference box, earlier experience supplied usable information, with the qualification not proof of a complete map.</desc>
<rect id="background" x="0" y="0" width="1200" height="724" fill="#FFFFFF"/>
<defs>
