<text x="857.3" y="86.0" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#2B2B2B">Later performance</text></g>
<g id="panel-C-maze"><use href="#maze-illustrative" xlink:href="#maze-illustrative" transform="translate(856.3,154.1)"/></g>
