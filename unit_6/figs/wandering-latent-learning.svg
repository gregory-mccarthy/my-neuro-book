<rect id="maze-backdrop" x="-30.8" y="-24.1" width="342.4" height="318.9" rx="10" fill="#ECF1ED"/>
<path id="maze-walls" d="M0.0,266.4 L0.0,192.0 L96.0,192.0 L96.0,96.0 L48.0,96.0 L48.0,0.0 L192.0,0.0 L192.0,96.0 L271.2,96.0 M96.0,192.0 L144.0,192.0 L144.0,240.0 M48.0,0.0 L0.0,0.0 L0.0,48.0 M192.0,96.0 L192.0,240.0" fill="none" stroke="#3A3A3A" stroke-width="32.2" stroke-linecap="square" stroke-linejoin="miter"/>
<rect id="start-box" x="-22.8" y="246.0" width="45.6" height="40.8" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="3.6" stroke-linejoin="miter"/>
<rect id="goal-chamber" x="238.8" y="63.6" width="64.8" height="64.8" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="3.6" stroke-linejoin="miter"/>
<path id="maze-corridor-floor" d="M0.0,266.4 L0.0,192.0 L96.0,192.0 L96.0,96.0 L48.0,96.0 L48.0,0.0 L192.0,0.0 L192.0,96.0 L271.2,96.0 M96.0,192.0 L144.0,192.0 L144.0,240.0 M48.0,0.0 L0.0,0.0 L0.0,48.0 M192.0,96.0 L192.0,240.0" fill="none" stroke="#FFFFFF" stroke-width="25.0" stroke-linecap="square" stroke-linejoin="miter"/>
<text x="32.8" y="274.4" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#2B2B2B">Start</text>
</g>
