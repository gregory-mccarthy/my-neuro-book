<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1105" width="1500" height="1105" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" role="img" aria-labelledby="figure-09-title figure-09-description">
<title id="figure-09-title">An inferred outcome from learned relations</title>
<desc id="figure-09-description">Figure 9. Three numbered phases of sensory preconditioning in rats; all lettered cues are sounds. Phase 1 shows A then B and C then D, with no food. Phase 2 shows B with food and D without food; A and C are absent. Phase 3 shows A and C presented separately without food. Brackets identify OFC as intact during training and distinguish a control condition from temporary OFC inactivation at test. A prominent box states that A was never directly paired with food. A dashed inset links A, B, and food as relations available from earlier learning. A rat at a food cup accompanies a qualitative table: controls show A greater than C; OFC-inactivated rats show no reliable A–C difference; both groups show B greater than D.</desc>
