<text id="figure-09-heading" x="40" y="50" font-size="32" font-weight="bold" fill="#333333">An inferred outcome from learned relations</text><g id="figure-09-panels" transform="translate(0,80)"><text x="40.0" y="50.0" font-size="30" font-weight="normal" text-anchor="start" fill="#666159" font-style="italic">Schematic · rats · all lettered cues are sounds</text>
