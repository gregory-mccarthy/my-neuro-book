<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="170mm" height="176.38mm" viewBox="0 0 960 996">
  <title>Maintenance depends on recurrent partners</title>
  <desc>Schematic figure in two panels: projection-specific inhibition in a mouse spatial nonmatching task, and region inhibition in a mouse delayed-lick task, each with task sequence and perturbation/result cards.</desc>

  <!-- Scale: 960 units = 170 mm print width, so 1 unit ≈ 0.5 pt.
       Labels 18 units ≈ 9 pt; supporting labels 16–17 units ≈ 8–8.5 pt. -->
  <style>
    text { font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', 'Liberation Serif', serif; fill: #2b2925; }
    .fig-title    { font-size: 26px; font-weight: 600; }
    .panel-letter { font-size: 22px; font-weight: 700; }
    .panel-title  { font-size: 20px; font-weight: 600; }
    .card-title   { font-size: 18px; font-weight: 600; }
    .label        { font-size: 18px; }
    .support      { font-size: 17px; }
    .key          { font-size: 16px; }
    .note         { font-size: 17px; font-style: italic; fill: #6e6a63; }
    .reward       { font-size: 16px; font-weight: 700; }
    .muted        { fill: #6e6a63; }
    .mid          { text-anchor: middle; }
    .end          { text-anchor: end; }
    .seq          { fill: none; stroke: #a7a198; stroke-width: 1.6; }
    .seq-head     { fill: #a7a198; }
    .tile         { fill: #e8e4dc; stroke: #d2ccc0; stroke-width: 1; }
    .card         { fill: #fffdf9; stroke: #e2dcd0; stroke-width: 1.2; }
    .inhibit      { fill: none; stroke: #d9826c; stroke-width: 4; stroke-linecap: round; }
    .bracket      { fill: none; stroke: #a7a198; stroke-width: 1.2; }
  </style>
  <defs>
    <g id="mouse-head" inkscape:label="Mouse head, top view (snout up)">
      <ellipse cx="12" cy="66" rx="9" ry="11" fill="#ddd7cd" stroke="#6e6a63" stroke-width="1.3"/>
      <ellipse cx="58" cy="66" rx="9" ry="11" fill="#ddd7cd" stroke="#6e6a63" stroke-width="1.3"/>
      <path d="M35,4 C42,4 46,14 50,26 C56,42 60,58 58,72 C56,84 46,90 35,90 C24,90 14,84 12,72 C10,58 14,42 20,26 C24,14 28,4 35,4 Z" fill="#ece8e1" stroke="#6e6a63" stroke-width="1.4"/>
      <rect x="-14" y="50" width="98" height="7" rx="2" fill="#b9b2a6"/>
      <ellipse cx="25" cy="38" rx="2.2" ry="3" fill="#3f3b36"/>
      <ellipse cx="45" cy="38" rx="2.2" ry="3" fill="#3f3b36"/>
      <ellipse cx="35" cy="7" rx="3" ry="2.2" fill="#6e6a63"/>
      <g fill="none" stroke="#8a857d" stroke-width="1" stroke-linecap="round">
        <path d="M41,17 Q60,8 80,4"/><path d="M41,18 Q62,14 84,14"/><path d="M41,20 Q62,22 82,27"/><path d="M41,22 Q58,30 75,39"/>
        <path d="M29,17 Q10,8 -10,4"/><path d="M29,18 Q8,14 -14,14"/><path d="M29,20 Q8,22 -12,27"/><path d="M29,22 Q12,30 -5,39"/>
      </g>
    </g>
    <g id="electrode" inkscape:label="Recording electrode (tip at origin)">
      <polygon points="0,0 -2.2,-30 2.2,-30" fill="#6e6a63"/>
      <rect x="-4.5" y="-46" width="9" height="16" rx="1.5" fill="#8a857d"/>
      <path d="M0,-46 V-55" stroke="#8a857d" stroke-width="1.2" fill="none"/>
    </g>
  </defs>
  <g id="background" inkscape:label="Background"><rect width="960" height="996" fill="#fcfaf5"/></g>
  <g id="figure-title" inkscape:label="Figure title">
    <text class="fig-title" x="24" y="32">Maintenance depends on recurrent partners</text>
  </g>
  <g id="key-inhibition" inkscape:label="Key: experimental inhibition">
    <line id="key-slash" class="inhibit" x1="707" y1="35" x2="717" y2="15"/>
    <text class="key" x="728" y="31">Experimental inhibition</text>
  </g>
  <g id="layout-rules" inkscape:label="Layout rules" stroke="#e4ded2" stroke-width="1"><line x1="24" y1="470" x2="936" y2="470"/></g>

  <!-- ===================== PANEL A ===================== -->
  <g id="panel-A" inkscape:label="Panel A – Spatial nonmatching in mice">
    <text class="panel-letter" x="24" y="70">A</text>
    <text class="panel-title" x="50" y="70">Spatial nonmatching in mice</text>
    <g id="A-task" inkscape:label="A task row">
      <g id="A-stage-labels">
        <text class="label mid" x="285" y="100">Sample</text>
        <text class="label mid" x="480" y="100">Delay</text>
        <text class="label mid" x="675" y="100">Choice</text>
      </g>
      <g id="A-maze-sample" transform="translate(210,110)">
        <path d="M8,14 H142 V32 H84 V98 H66 V32 H8 Z" fill="#efebe4" stroke="#8a857d" stroke-width="1.6" stroke-linejoin="round"/>
        <line id="A-maze-sample-gate" x1="93" y1="11" x2="93" y2="35" stroke="#4a4741" stroke-width="5"/>
        <g id="A-maze-sample-route" fill="#4a4741">
          <path d="M75,92 V23 H34" fill="none" stroke="#4a4741" stroke-width="2.2" stroke-linejoin="round"/>
          <polygon points="26,23 35,18.5 35,27.5"/>
        </g>
        <text class="reward mid" x="16" y="29">R</text>
      </g>
      <g id="A-delay-tile">
        <rect class="tile" x="420" y="132" width="120" height="56" rx="4"/>
        <text class="label muted mid" x="480" y="166">60 s</text>
      </g>
      <g id="A-maze-choice" transform="translate(600,110)">
        <path d="M8,14 H142 V32 H84 V98 H66 V32 H8 Z" fill="#efebe4" stroke="#8a857d" stroke-width="1.6" stroke-linejoin="round"/>
        <g id="A-maze-choice-route" fill="#4a4741">
          <path d="M75,92 V23 H116" fill="none" stroke="#4a4741" stroke-width="2.2" stroke-linejoin="round"/>
          <polygon points="124,23 115,18.5 115,27.5"/>
        </g>
        <text class="reward mid" x="134" y="29">R</text>
      </g>
      <g id="A-sequence-arrows" inkscape:label="A temporal-order arrows">
        <line class="seq" x1="368" y1="160" x2="404" y2="160"/>
        <polygon class="seq-head" points="412,160 403,155.5 403,164.5"/>
        <line class="seq" x1="548" y1="160" x2="584" y2="160"/>
        <polygon class="seq-head" points="592,160 583,155.5 583,164.5"/>
      </g>
      <text id="A-reward-key" class="key" x="772" y="166">R: reward</text>
    </g>
    <g id="A-cards" inkscape:label="A perturbation/result cards">
      <g id="A-card-delay" inkscape:label="Inhibit during delay" transform="translate(24,236)">
        <rect class="card" width="444" height="212" rx="8"/>
        <text class="card-title" x="20" y="32">Inhibit during delay</text>
        <g id="A-card-delay-strip" inkscape:label="Epoch strip">
          <rect x="96" y="48" width="84" height="24" fill="#f1ede6" stroke="#d8d1c5" stroke-width="1"/>
          <rect x="180" y="48" width="84" height="24" fill="#f8e4dc" stroke="#d9826c" stroke-width="1.4"/>
          <rect x="264" y="48" width="84" height="24" fill="#f1ede6" stroke="#d8d1c5" stroke-width="1"/>
          <text class="key mid muted" x="138" y="65">Sample</text>
          <text class="key mid" x="222" y="65">Delay</text>
          <text class="key mid muted" x="306" y="65">Choice</text>
        </g>
        <g id="A-card-delay-circuit" inkscape:label="Circuit">
          <g id="A-card-delay-MD">
            <rect x="70" y="96" width="84" height="44" rx="10" fill="#eeeaf8" stroke="#8a7cc0" stroke-width="1.8"/>
            <text class="label mid" x="112" y="124">MD</text>
          </g>
          <g id="A-card-delay-mPFC">
            <rect x="282" y="96" width="100" height="44" rx="10" fill="#e2f2ef" stroke="#3fa39b" stroke-width="1.8"/>
            <text class="label mid" x="332" y="124">mPFC</text>
          </g>
          <g id="A-card-delay-MD-to-mPFC">
            <line x1="155" y1="109" x2="272" y2="109" stroke="#7a6bb5" stroke-width="2.4"/>
            <polygon points="282,109 271,104 271,114" fill="#7a6bb5"/>
          </g>
          <g id="A-card-delay-mPFC-to-MD">
            <line x1="281" y1="127" x2="164" y2="127" stroke="#2f8f88" stroke-width="2.4"/>
            <polygon points="154,127 165,122 165,132" fill="#2f8f88"/>
          </g>
          <line id="A-card-delay-inhibit-MD-terminals" class="inhibit" x1="255" y1="120" x2="265" y2="98"/>
        </g>
        <g id="A-card-delay-results" inkscape:label="Results">
          <text class="support mid" x="222" y="172">mPFC delay activity disrupted</text>
          <text class="support mid" x="222" y="194">Fewer correct choices</text>
        </g>
      </g>
      <g id="A-card-choice" inkscape:label="Inhibit during choice" transform="translate(492,236)">
        <rect class="card" width="444" height="212" rx="8"/>
        <text class="card-title" x="20" y="32">Inhibit during choice</text>
        <g id="A-card-choice-strip" inkscape:label="Epoch strip">
          <rect x="96" y="48" width="84" height="24" fill="#f1ede6" stroke="#d8d1c5" stroke-width="1"/>
          <rect x="180" y="48" width="84" height="24" fill="#f1ede6" stroke="#d8d1c5" stroke-width="1"/>
          <rect x="264" y="48" width="84" height="24" fill="#f8e4dc" stroke="#d9826c" stroke-width="1.4"/>
          <text class="key mid muted" x="138" y="65">Sample</text>
          <text class="key mid muted" x="222" y="65">Delay</text>
          <text class="key mid" x="306" y="65">Choice</text>
        </g>
        <g id="A-card-choice-circuit" inkscape:label="Circuit">
          <g id="A-card-choice-MD">
            <rect x="70" y="96" width="84" height="44" rx="10" fill="#eeeaf8" stroke="#8a7cc0" stroke-width="1.8"/>
            <text class="label mid" x="112" y="124">MD</text>
          </g>
          <g id="A-card-choice-mPFC">
            <rect x="282" y="96" width="100" height="44" rx="10" fill="#e2f2ef" stroke="#3fa39b" stroke-width="1.8"/>
            <text class="label mid" x="332" y="124">mPFC</text>
          </g>
          <g id="A-card-choice-MD-to-mPFC">
            <line x1="155" y1="109" x2="272" y2="109" stroke="#7a6bb5" stroke-width="2.4"/>
            <polygon points="282,109 271,104 271,114" fill="#7a6bb5"/>
          </g>
          <g id="A-card-choice-mPFC-to-MD">
            <line x1="281" y1="127" x2="164" y2="127" stroke="#2f8f88" stroke-width="2.4"/>
            <polygon points="154,127 165,122 165,132" fill="#2f8f88"/>
          </g>
          <line id="A-card-choice-inhibit-mPFC-terminals" class="inhibit" x1="171" y1="138" x2="181" y2="116"/>
        </g>
        <g id="A-card-choice-results" inkscape:label="Results">
          <text class="support mid" x="222" y="172">Fewer correct choices</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ===================== PANEL B ===================== -->
  <g id="panel-B" inkscape:label="Panel B – Preparing a delayed lick in mice">
    <text class="panel-letter" x="24" y="500">B</text>
    <text class="panel-title" x="50" y="500">Preparing a delayed lick in mice</text>
    <g id="B-task" inkscape:label="B task row">
      <g id="B-stage-labels">
        <text class="label mid" x="221" y="530">Pole position</text>
        <text class="label mid" x="457" y="530">Delay</text>
        <text class="label mid" x="613" y="530">Go cue</text>
        <text class="label mid" x="784" y="530">Left / right lick</text>
      </g>
      <g id="B-pole-stage" inkscape:label="Pole position stage">
        <use xlink:href="#mouse-head" x="111" y="552"/>
        <circle id="B-pole-alternative" cx="202" cy="562" r="5.5" fill="#fcfaf5" stroke="#4a4741" stroke-width="1.5" stroke-dasharray="2.6 2"/>
        <circle id="B-pole-presented" cx="202" cy="584" r="5.5" fill="#4a4741"/>
        <path class="bracket" d="M211,557 H215 V589 H211"/>
        <text class="key" x="222" y="570"><tspan x="222">Alternative</tspan><tspan x="222" dy="18">positions</tspan></text>
      </g>
      <g id="B-delay-tile">
        <rect class="tile" x="385" y="567" width="144" height="56" rx="4"/>
        <text class="label muted mid" x="457" y="591">1.2–1.3 s</text>
        <text class="key muted mid" x="457" y="612">Pole withdrawn</text>
      </g>
      <g id="B-speaker" inkscape:label="Auditory go cue (speaker)">
        <rect x="599" y="588" width="9" height="14" fill="#6e6a63"/>
        <polygon points="608,588 621,579 621,611 608,602" fill="#6e6a63"/>
        <path d="M626,587 Q632,595 626,603 M631,581 Q641,595 631,609" fill="none" stroke="#6e6a63" stroke-width="1.6" stroke-linecap="round"/>
      </g>
      <g id="B-lick-stage" inkscape:label="Response stage: two lick spouts">
        <use xlink:href="#mouse-head" x="749" y="564"/>
        <rect id="B-spout-left" x="760" y="540" width="7" height="21" rx="2.5" fill="#cfc8bc" stroke="#8a857d" stroke-width="1"/>
        <rect id="B-spout-right" x="801" y="540" width="7" height="21" rx="2.5" fill="#cfc8bc" stroke="#8a857d" stroke-width="1"/>
      </g>
      <g id="B-sequence-arrows" inkscape:label="B temporal-order arrows">
        <line class="seq" x1="347" y1="595" x2="371" y2="595"/>
        <polygon class="seq-head" points="379,595 370,590.5 370,599.5"/>
        <line class="seq" x1="535" y1="595" x2="559" y2="595"/>
        <polygon class="seq-head" points="567,595 558,590.5 558,599.5"/>
        <line class="seq" x1="659" y1="595" x2="695" y2="595"/>
        <polygon class="seq-head" points="703,595 694,590.5 694,599.5"/>
      </g>
    </g>
    <g id="B-condition" inkscape:label="B shared condition">
      <text class="label mid" x="480" y="692">Unilateral delay inhibition</text>
      <path class="bracket" d="M246,708 V702 H714 V708"/>
    </g>
    <g id="B-cards" inkscape:label="B perturbation/result cards">
      <g id="B-card-thalamus" inkscape:label="Inhibit thalamus" transform="translate(24,714)">
        <rect class="card" width="444" height="196" rx="8"/>
        <text class="card-title" x="20" y="32">Inhibit thalamus</text>
        <g id="B-card-thalamus-circuit" inkscape:label="Circuit">
          <g id="B-card-thalamus-thalamus">
            <rect x="18" y="92" width="246" height="56" rx="10" fill="#eeeaf8" stroke="#8a7cc0" stroke-width="1.8"/>
            <text class="label mid" x="141" y="116">ALM-linked thalamus</text>
            <text class="key muted mid" x="141" y="137">VM/VAL-centered</text>
          </g>
          <g id="B-card-thalamus-ALM">
            <rect x="330" y="92" width="96" height="56" rx="10" fill="#e2f2ef" stroke="#3fa39b" stroke-width="1.8"/>
            <text class="label mid" x="378" y="126">ALM</text>
          </g>
          <g id="B-card-thalamus-thalamus-to-ALM">
            <line x1="265" y1="111" x2="320" y2="111" stroke="#7a6bb5" stroke-width="2.4"/>
            <polygon points="330,111 319,106 319,116" fill="#7a6bb5"/>
          </g>
          <g id="B-card-thalamus-ALM-to-thalamus">
            <line x1="329" y1="129" x2="274" y2="129" stroke="#2f8f88" stroke-width="2.4"/>
            <polygon points="264,129 275,124 275,134" fill="#2f8f88"/>
          </g>
          <line id="B-card-thalamus-inhibit-thalamus" class="inhibit" x1="26" y1="133" x2="36" y2="107"/>
          <use id="B-card-thalamus-recording" xlink:href="#electrode" transform="translate(392,92) rotate(28)"/>
        </g>
        <text id="B-card-thalamus-result" class="support mid" x="222" y="178">ALM firing strongly reduced</text>
      </g>
      <g id="B-card-ALM" inkscape:label="Inhibit ALM" transform="translate(492,714)">
        <rect class="card" width="444" height="196" rx="8"/>
        <text class="card-title" x="20" y="32">Inhibit ALM</text>
        <g id="B-card-ALM-circuit" inkscape:label="Circuit">
          <g id="B-card-ALM-thalamus">
            <rect x="18" y="92" width="246" height="56" rx="10" fill="#eeeaf8" stroke="#8a7cc0" stroke-width="1.8"/>
            <text class="label mid" x="141" y="116">ALM-linked thalamus</text>
            <text class="key muted mid" x="141" y="137">VM/VAL-centered</text>
          </g>
          <g id="B-card-ALM-ALM">
            <rect x="330" y="92" width="96" height="56" rx="10" fill="#e2f2ef" stroke="#3fa39b" stroke-width="1.8"/>
            <text class="label mid" x="378" y="126">ALM</text>
          </g>
          <g id="B-card-ALM-thalamus-to-ALM">
            <line x1="265" y1="111" x2="320" y2="111" stroke="#7a6bb5" stroke-width="2.4"/>
            <polygon points="330,111 319,106 319,116" fill="#7a6bb5"/>
          </g>
          <g id="B-card-ALM-ALM-to-thalamus">
            <line x1="329" y1="129" x2="274" y2="129" stroke="#2f8f88" stroke-width="2.4"/>
            <polygon points="264,129 275,124 275,134" fill="#2f8f88"/>
          </g>
          <line id="B-card-ALM-inhibit-ALM" class="inhibit" x1="408" y1="133" x2="418" y2="107"/>
          <use id="B-card-ALM-recording" xlink:href="#electrode" transform="translate(196,92) rotate(28)"/>
        </g>
        <text id="B-card-ALM-result" class="support mid" x="222" y="178">Thalamic firing reduced</text>
      </g>
    </g>
    <g id="B-shared-result" inkscape:label="B shared behavioral result">
      <path class="bracket" d="M246,916 V922 H714 V916"/>
      <text class="label mid" x="480" y="944">Separate behavioral tests: ipsilateral choice bias</text>
    </g>
  </g>
  <g id="figure-note" inkscape:label="Footer">
    <text class="note mid" x="480" y="980">Schematic tasks; timing not to scale</text>
  </g>
</svg>
