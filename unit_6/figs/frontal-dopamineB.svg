<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 600" width="2000" height="600" role="img" aria-labelledby="fig4b-title fig4b-desc">
<title id="fig4b-title">D1 stimulation changes spatial tuning</title>
<desc id="fig4b-desc">Three schematic spatial-tuning plots for macaque prefrontal neurons during a memory delay, drawn with identical axes, the same vertical scale and the same baseline. The horizontal axis is remembered direction, with the preferred direction marked at the centre; the vertical axis is delay-period firing. Control: a broad gray curve peaking at the preferred direction with appreciable firing away from it. Modest D1 stimulation: a teal curve whose peak is about the same or slightly lower while firing away from the preferred direction falls further, giving sharper selectivity. Strong D1 stimulation: a low rose curve with only a small central bump, below the control curve at every direction. In the second and third plots the control curve is repeated as a pale dashed gray reference. Schematic, not experimental data.</desc>
<rect id="background" x="0" y="0" width="2000" height="600" fill="#FFFFFF"/>
