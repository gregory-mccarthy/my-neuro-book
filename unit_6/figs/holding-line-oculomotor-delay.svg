<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="170mm" height="116.17mm" viewBox="0 0 960 656">
  <title>What a delayed saccade reveals</title>
  <desc>Schematic figure in four panels: memory-guided saccade task, delay-period firing of one example neuron, lesion summary, and prosaccade versus antisaccade response maps.</desc>

  <!-- Scale: 960 units = 170 mm print width, so 1 unit ≈ 0.5 pt.
       Labels 18 units ≈ 9 pt; supporting notes 16–17 units ≈ 8–8.5 pt. -->
  <style>
    text { font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', 'Liberation Serif', serif; fill: #2b2925; }
    .fig-title    { font-size: 26px; font-weight: 600; }
    .panel-letter { font-size: 22px; font-weight: 700; }
    .panel-title  { font-size: 20px; font-weight: 600; }
    .phase        { font-size: 18px; }
    .label        { font-size: 18px; }
    .support      { font-size: 17px; }
    .key          { font-size: 16px; }
    .subtitle     { font-size: 17px; font-style: italic; fill: #6e6a63; }
    .note         { font-size: 16px; font-style: italic; fill: #6e6a63; }
    .muted        { fill: #6e6a63; }
    .teal-text    { fill: #2a7a73; }
    .coral-text   { fill: #b0604c; }
    .gray-text    { fill: #77726a; }
    .mid          { text-anchor: middle; }
    .end          { text-anchor: end; }
    .display      { fill: #24272d; }
    .axis         { fill: none; stroke: #4a4741; stroke-width: 1.4; }
    .teal-stroke  { fill: none; stroke: #3fa39b; stroke-width: 2.6; }
    .teal-fill    { fill: #3fa39b; }
  </style>

  <g id="background" inkscape:label="Background">
    <rect width="960" height="656" fill="#fcfaf5"/>
  </g>

  <g id="figure-title" inkscape:label="Figure title">
    <text class="fig-title" x="24" y="32">What a delayed saccade reveals</text>
  </g>

  <g id="layout-rules" inkscape:label="Layout rules" stroke="#e4ded2" stroke-width="1">
    <line x1="24" y1="270" x2="936" y2="270"/>
    <line x1="480" y1="284" x2="480" y2="500"/>
    <line x1="24" y1="510" x2="936" y2="510"/>
  </g>

  <!-- ===================== PANEL A ===================== -->
  <g id="panel-A" inkscape:label="Panel A – Memory-guided saccade">

    <g id="A-header" inkscape:label="A header">
      <text class="panel-letter" x="24" y="64">A</text>
      <text x="50" y="64"><tspan class="panel-title">Memory-guided saccade</tspan><tspan class="subtitle" dx="14">Rhesus macaque</tspan></text>
    </g>

    <g id="A-keys" inkscape:label="A keys">
      <g id="A-key-eye-movement">
        <line class="teal-stroke" x1="572" y1="58" x2="592" y2="58"/>
        <polygon class="teal-fill" points="601,58 591.5,53.5 591.5,62.5"/>
        <text class="key" x="609" y="64">Eye movement</text>
      </g>
      <text id="A-key-timing" class="note end" x="936" y="64">Timing not to scale</text>
    </g>

    <g id="A-phase-labels" inkscape:label="A phase labels">
      <text class="phase mid" x="144" y="92">Fixate</text>
      <text class="phase mid" x="368" y="92">Cue</text>
      <text class="phase mid" x="592" y="92">Delay</text>
      <text class="phase mid" x="816" y="92">Go / saccade</text>
    </g>

    <!-- All four windows share local coordinates: 156 × 100, centre (78,50), lower cue position (78,80). -->
    <g id="A-windows" inkscape:label="A display windows">
      <g id="A-window-fixate" transform="translate(66,102)">
        <rect class="display" width="156" height="100" rx="5"/>
        <circle id="A-fixate-point" cx="78" cy="50" r="3.2" fill="#ffffff"/>
      </g>
      <g id="A-window-cue" transform="translate(290,102)">
        <rect class="display" width="156" height="100" rx="5"/>
        <circle id="A-cue-fixation-point" cx="78" cy="50" r="3.2" fill="#ffffff"/>
        <rect id="A-cue-square" x="73.5" y="75.5" width="9" height="9" fill="#ffffff"/>
      </g>
      <g id="A-window-delay" transform="translate(514,102)">
        <rect class="display" width="156" height="100" rx="5"/>
        <circle id="A-delay-fixation-point" cx="78" cy="50" r="3.2" fill="#ffffff"/>
      </g>
      <g id="A-window-go" transform="translate(738,102)">
        <rect class="display" width="156" height="100" rx="5"/>
        <g id="A-saccade-arrow" inkscape:label="Saccade arrow (tip = cue centre 78,80)">
          <line class="teal-stroke" x1="78" y1="50" x2="78" y2="71"/>
          <polygon class="teal-fill" points="78,80 73,70.5 83,70.5"/>
        </g>
      </g>
    </g>

    <g id="A-progression-arrows" inkscape:label="A temporal arrows" fill="#a7a198" stroke="#a7a198" stroke-width="1.6">
      <line x1="236" y1="152" x2="270" y2="152"/>
      <polygon stroke="none" points="278,152 269,147.5 269,156.5"/>
      <line x1="460" y1="152" x2="494" y2="152"/>
      <polygon stroke="none" points="502,152 493,147.5 493,156.5"/>
      <line x1="684" y1="152" x2="718" y2="152"/>
      <polygon stroke="none" points="726,152 717,147.5 717,156.5"/>
    </g>

    <g id="A-timing-labels" inkscape:label="A timing labels">
      <text class="label muted mid" x="144" y="224">0.75 s</text>
      <text class="label muted mid" x="368" y="224">0.5 s</text>
      <text class="label muted mid" x="592" y="224">3 s example</text>
    </g>

    <g id="A-fixation-requirement" inkscape:label="A fixation bracket and labels">
      <path id="A-bracket" d="M66,230 V237 H670 V230" fill="none" stroke="#8a857d" stroke-width="1.2"/>
      <text class="support mid" x="368" y="256">Maintain central fixation</text>
      <text class="support mid" x="816" y="256">Fixation point off</text>
    </g>
  </g>

  <!-- ===================== PANEL B ===================== -->
  <g id="panel-B" inkscape:label="Panel B – Delay-period firing">

    <g id="B-header" inkscape:label="B header">
      <text class="panel-letter" x="24" y="298">B</text>
      <text class="panel-title" x="50" y="298">Delay-period firing</text>
      <text class="subtitle" x="50" y="320">Principal-sulcus DLPFC</text>
    </g>

    <g id="B-axes" inkscape:label="B axes">
      <line class="axis" x1="64" y1="448" x2="64" y2="361"/>
      <polygon fill="#4a4741" points="64,352 59.5,361 68.5,361"/>
      <line class="axis" x1="64" y1="448" x2="348" y2="448"/>
      <line id="B-go-boundary" x1="348" y1="358" x2="348" y2="448" stroke="#bdb6aa" stroke-width="1.2" stroke-dasharray="2 3"/>
    </g>

    <g id="B-axis-labels" inkscape:label="B axis labels">
      <text class="label" x="50" y="344">Firing rate</text>
      <text class="label mid" x="64" y="470">Cue off</text>
      <text class="label mid" x="206" y="470">Delay</text>
      <text class="label mid" x="348" y="470">Go</text>
    </g>

    <g id="B-traces" inkscape:label="B traces">
      <path id="B-trace-lower-cue" class="teal-stroke"
            d="M64,380.2 C102.4,374.6 134.4,370.8 168.9,374.6 S232.9,384 268.7,379.3 S325,370.8 348,375.5"/>
      <path id="B-trace-upper-cue" fill="none" stroke="#9c968c" stroke-width="2.2" stroke-dasharray="6 4"
            d="M64,425.4 C99.8,429.2 130.5,423.5 166.3,426.4 S232.9,432 268.7,428.2 S325,424.5 348,427.3"/>
    </g>

    <g id="B-trace-labels" inkscape:label="B trace labels">
      <text class="label teal-text" x="357" y="381.5">Lower cue</text>
      <text class="label gray-text" x="357" y="433.5">Upper cue</text>
    </g>

    <g id="B-footnote" inkscape:label="B schematic note">
      <text class="note" x="50" y="498">One neuron · schematic</text>
    </g>
  </g>

  <!-- ===================== PANEL C ===================== -->
  <g id="panel-C" inkscape:label="Panel C – Lesion evidence">

    <g id="C-header" inkscape:label="C header">
      <text class="panel-letter" x="504" y="298">C</text>
      <text class="panel-title" x="530" y="298">Lesion evidence</text>
      <text class="support end" x="936" y="298">Principal-sulcus lesion</text>
      <text class="subtitle" x="530" y="320">Contralateral cues</text>
      <text class="note end" x="936" y="320">Schematic summary</text>
    </g>

    <g id="C-axes" inkscape:label="C axes">
      <line class="axis" x1="544" y1="448" x2="544" y2="361"/>
      <polygon fill="#4a4741" points="544,352 539.5,361 548.5,361"/>
      <line class="axis" x1="544" y1="448" x2="768" y2="448"/>
      <polygon fill="#4a4741" points="777,448 768,443.5 768,452.5"/>
    </g>

    <g id="C-axis-labels" inkscape:label="C axis labels">
      <text class="label" x="530" y="344">Memory-guided errors</text>
      <text class="label mid" x="574" y="470">Short</text>
      <text class="label mid" x="656" y="470">Delay</text>
      <text class="label mid" x="744" y="470">Long</text>
    </g>

    <g id="C-curves" inkscape:label="C curves">
      <path id="C-curve-before" fill="none" stroke="#9c968c" stroke-width="2.2" stroke-dasharray="6 4"
            d="M550,430.1 C613.5,429.2 695.8,426.4 764,421.6"/>
      <path id="C-curve-after" fill="none" stroke="#dc8a74" stroke-width="2.6"
            d="M550,425.4 C637,423.5 707.6,408.5 764,378.4"/>
    </g>

    <g id="C-curve-labels" inkscape:label="C curve labels">
      <text class="label coral-text" x="774" y="384.5">After lesion</text>
      <text class="label gray-text" x="774" y="428">Before lesion</text>
    </g>

    <g id="C-footnote" inkscape:label="C footnote">
      <text class="support" x="530" y="498">Visually guided responses largely preserved</text>
    </g>
  </g>

  <!-- ===================== PANEL D ===================== -->
  <g id="panel-D" inkscape:label="Panel D – Cue location or response direction?">

    <g id="D-header" inkscape:label="D header">
      <text class="panel-letter" x="24" y="538">D</text>
      <text class="panel-title" x="50" y="538">Cue location or response direction?</text>
      <text class="subtitle" x="50" y="562">Response after the delay</text>
    </g>

    <g id="D-keys" inkscape:label="D keys">
      <g id="D-key-earlier-cue">
        <rect x="50" y="578" width="13" height="13" fill="none" stroke="#7d786f" stroke-width="1.3" stroke-dasharray="3 2"/>
        <text class="key" x="71" y="590">Earlier cue</text>
      </g>
      <g id="D-key-initial-gaze">
        <g stroke="#8b867e" stroke-width="1.6">
          <line x1="184" y1="584.5" x2="196" y2="584.5"/>
          <line x1="190" y1="578.5" x2="190" y2="590.5"/>
        </g>
        <text class="key" x="204" y="590">Initial gaze</text>
      </g>
    </g>

    <!-- Both maps share local coordinates: 150 × 96, initial gaze (75,48), earlier cue (75,80), opposite position (75,16). -->
    <g id="D-maps" inkscape:label="D response maps">
      <g id="D-map-prosaccade" transform="translate(520,546)">
        <text class="phase mid" x="75" y="-8">Prosaccade</text>
        <rect width="150" height="96" rx="6" fill="#f2eee6" stroke="#d6cfc2" stroke-width="1"/>
        <rect id="D-pro-earlier-cue" x="67.5" y="72.5" width="15" height="15" fill="none" stroke="#7d786f" stroke-width="1.3" stroke-dasharray="3 2"/>
        <g id="D-pro-arrow" inkscape:label="Prosaccade arrow (tip = cue centre 75,80)">
          <line class="teal-stroke" x1="75" y1="48" x2="75" y2="73.5"/>
          <polygon class="teal-fill" points="75,80 70.5,72.5 79.5,72.5"/>
        </g>
        <g id="D-pro-initial-gaze" stroke="#8b867e" stroke-width="1.6">
          <line x1="69" y1="48" x2="81" y2="48"/>
          <line x1="75" y1="42" x2="75" y2="54"/>
        </g>
      </g>
      <g id="D-map-antisaccade" transform="translate(726,546)">
        <text class="phase mid" x="75" y="-8">Antisaccade</text>
        <rect width="150" height="96" rx="6" fill="#f2eee6" stroke="#d6cfc2" stroke-width="1"/>
        <rect id="D-anti-earlier-cue" x="67.5" y="72.5" width="15" height="15" fill="none" stroke="#7d786f" stroke-width="1.3" stroke-dasharray="3 2"/>
        <g id="D-anti-arrow" inkscape:label="Antisaccade arrow (tip = mirrored position 75,16)">
          <line class="teal-stroke" x1="75" y1="48" x2="75" y2="22.5"/>
          <polygon class="teal-fill" points="75,16 70.5,23.5 79.5,23.5"/>
        </g>
        <g id="D-anti-initial-gaze" stroke="#8b867e" stroke-width="1.6">
          <line x1="69" y1="48" x2="81" y2="48"/>
          <line x1="75" y1="42" x2="75" y2="54"/>
        </g>
      </g>
    </g>
  </g>
</svg>
