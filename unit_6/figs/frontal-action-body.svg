<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1720" width="2000" height="1720" role="img" aria-labelledby="fig5-title fig5-desc">
<title id="fig5-title">Routes to action and bodily consequences</title>
<desc id="fig5-desc">Two-panel schematic. Panel A is a small top-down map: an animal, drawn as a triangle, is already moving toward a remembered shelter that a large opaque rock hides from its position; the region hidden from the animal is shaded. A curved arrow carries the animal around an obstacle in its immediate path and stops well short of the shelter. Panel B shows concurrent routes. Prefrontal territories (lateral PFC and orbital/medial PFC) sit at the top. Beneath them are three route groupings side by side: cortical action systems (pre-SMA, premotor cortex, cingulate motor areas, SMA/M1); basal-ganglia output (GPi and SNr) with a neighbouring thalamus; and hypothalamus and PAG. Solid arrows show selected direct projections: lateral PFC to pre-SMA, prefrontal territories to cingulate motor areas, orbital/medial PFC to hypothalamus and to PAG, basal-ganglia output to thalamus, and thalamus back to prefrontal territories and to cortical action systems. Dashed arrows summarize routes with intervening steps: lateral PFC to premotor cortex via frontal networks, prefrontal territories to basal-ganglia output via striatal and STN routes, cortical action systems and basal-ganglia output to brainstem/spinal motor circuits, hypothalamus to brainstem/spinal autonomic circuits, PAG to both lower systems, and the motor and autonomic circuits to the body in its environment. From the body, two families of dashed feedback routes return along the outer margins while the action continues: sensory feedback to lateral PFC, cortical action systems and brainstem/spinal motor circuits, and bodily feedback to orbital/medial PFC, hypothalamus and brainstem/spinal autonomic circuits. The local returns are shorter than the returns to cortex. Arrows show direction only; synaptic signs are omitted.</desc>
