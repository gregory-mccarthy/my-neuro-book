<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="170mm" height="129.62mm" viewBox="0 0 960 732">
  <title>When a distractor changes the task state</title>
  <desc>Schematic figure: a face working-memory trial with neutral or negative emotional picture distractors during the delay, a qualitative recognition comparison, and qualitative regional BOLD comparisons.</desc>

  <!-- Scale: 960 units = 170 mm print width, so 1 unit ≈ 0.5 pt.
       Labels 18 units ≈ 9 pt; supporting labels 16–17 units ≈ 8–8.5 pt. -->
  <style>
    text { font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', 'Liberation Serif', serif; fill: #2b2925; }
    .fig-title    { font-size: 26px; font-weight: 600; }
    .panel-letter { font-size: 22px; font-weight: 700; }
    .panel-title  { font-size: 20px; font-weight: 600; }
    .label        { font-size: 18px; }
    .support      { font-size: 17px; }
    .key          { font-size: 16px; }
    .result       { font-size: 18px; font-weight: 600; }
    .subtitle     { font-size: 17px; font-style: italic; fill: #6e6a63; }
    .note         { font-size: 16px; font-style: italic; fill: #6e6a63; }
    .instr        { font-size: 17px; font-style: italic; }
    .muted        { fill: #6e6a63; }
    .teal-text    { fill: #2a7a73; }
    .coral-text   { fill: #b0604c; }
    .mid          { text-anchor: middle; }
    .end          { text-anchor: end; }
    .seq          { fill: none; stroke: #a7a198; stroke-width: 1.6; }
    .seq-head     { fill: #a7a198; }
    .tile         { fill: #e8e4dc; stroke: #d2ccc0; stroke-width: 1; }
    .stage        { fill: #efebe4; stroke: #d2ccc0; stroke-width: 1; }
    .bracket      { fill: none; stroke: #8a857d; stroke-width: 1.2; }
    .fig          { fill: #77726a; }
    .limb         { fill: none; stroke: #77726a; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
