  <g id="background" inkscape:label="Background"><rect width="960" height="732" fill="#fcfaf5"/></g>
  <g id="figure-title" inkscape:label="Figure title">
    <text class="fig-title" x="24" y="32">When a distractor changes the task state</text>
  </g>
  <g id="layout-rules" inkscape:label="Layout rules" stroke="#e4ded2" stroke-width="1">
    <line x1="24" y1="402" x2="936" y2="402"/>
    <line x1="342" y1="416" x2="342" y2="682"/>
  </g>

  <!-- ===================== PANEL A ===================== -->
  <g id="panel-A" inkscape:label="Panel A – Remember the faces">
    <text class="panel-letter" x="24" y="64">A</text>
    <text class="panel-title" x="50" y="64">Remember the faces</text>
    <!-- Stage edges (x): memorize (79, 229), fixation (269, 323), distractors (363, 665), fixation (705, 759), probe (799, 871). Both distractor rows share the same interval. -->
    <g id="A-delay-bracket" inkscape:label="Delay bracket (sample offset to probe onset)">
      <path class="bracket" d="M229,112 V104 H799 V112"/>
      <text class="label mid" x="514" y="96">Delay: 11.5 s</text>
    </g>
    <g id="A-stage-names" inkscape:label="Stage names">
      <text class="label mid" x="154" y="132">Memorize</text>
      <text class="label" x="363" y="132">Distractors</text>
      <text class="note end" x="665" y="132">Alternative trials</text>
      <text class="label mid" x="835" y="132">Probe</text>
    </g>
    <g id="A-stages" inkscape:label="Task stages">
      <g id="A-memorize">
        <rect class="tile" x="79" y="142" width="150" height="140" rx="4"/>
        <use xlink:href="#face-1" x="89" y="188.8" width="38" height="46.4"/>
        <use xlink:href="#face-2" x="135" y="188.8" width="38" height="46.4"/>
        <use xlink:href="#face-3" x="181" y="188.8" width="38" height="46.4"/>
      </g>
      <g id="A-fixation-1">
        <rect class="tile" x="269" y="142" width="54" height="140" rx="4"/>
        <path d="M290,212 H302 M296,206 V218" stroke="#3f3b36" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <g id="A-distractors" inkscape:label="Distractor stage: two alternative rows">
        <rect class="stage" x="363" y="142" width="302" height="140" rx="4"/>
        <g id="A-row-neutral" inkscape:label="Neutral row">
          <text class="support teal-text" x="375" y="185.5">Neutral</text>
          <g id="A-scene-neutral-typing">
            <rect x="471" y="152" width="80" height="55" rx="4" fill="#fbf9f5" stroke="#6fb3ab" stroke-width="1.8"/>
            <use xlink:href="#scene-neutral-typing" x="471" y="152" width="80" height="55"/>
          </g>
          <g id="A-scene-neutral-writing">
            <rect x="575" y="152" width="80" height="55" rx="4" fill="#fbf9f5" stroke="#6fb3ab" stroke-width="1.8"/>
            <use xlink:href="#scene-neutral-writing" x="575" y="152" width="80" height="55"/>
          </g>
          <line class="seq" x1="551" y1="179.5" x2="567" y2="179.5"/>
          <polygon class="seq-head" points="575,179.5 566,175 566,184"/>
        </g>
        <g id="A-row-negative" inkscape:label="Negative emotional row">
          <text class="support coral-text" x="375" y="241"><tspan x="375">Negative</tspan><tspan x="375" dy="19">emotional</tspan></text>
          <g id="A-scene-negative-confrontation">
            <rect x="471" y="217" width="80" height="55" rx="4" fill="#fbf9f5" stroke="#df9a87" stroke-width="1.8"/>
            <use xlink:href="#scene-negative-confrontation" x="471" y="217" width="80" height="55"/>
          </g>
          <g id="A-scene-negative-followed">
            <rect x="575" y="217" width="80" height="55" rx="4" fill="#fbf9f5" stroke="#df9a87" stroke-width="1.8"/>
            <use xlink:href="#scene-negative-followed" x="575" y="217" width="80" height="55"/>
          </g>
          <line class="seq" x1="551" y1="244.5" x2="567" y2="244.5"/>
          <polygon class="seq-head" points="575,244.5 566,240 566,249"/>
        </g>
      </g>
      <g id="A-fixation-2">
        <rect class="tile" x="705" y="142" width="54" height="140" rx="4"/>
        <path d="M726,212 H738 M732,206 V218" stroke="#3f3b36" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <g id="A-probe">
        <rect class="tile" x="799" y="142" width="72" height="140" rx="4"/>
        <use xlink:href="#face-2" x="816" y="188.8" width="38" height="46.4"/>
      </g>
    </g>
    <g id="A-sequence-arrows" inkscape:label="Temporal-order arrows (stage edge to stage edge)">
      <line class="seq" x1="229" y1="212" x2="261" y2="212"/>
      <polygon class="seq-head" points="269,212 260,207.5 260,216.5"/>
      <line class="seq" x1="323" y1="212" x2="355" y2="212"/>
      <polygon class="seq-head" points="363,212 354,207.5 354,216.5"/>
      <line class="seq" x1="665" y1="212" x2="697" y2="212"/>
      <polygon class="seq-head" points="705,212 696,207.5 696,216.5"/>
      <line class="seq" x1="759" y1="212" x2="791" y2="212"/>
      <polygon class="seq-head" points="799,212 790,207.5 790,216.5"/>
    </g>
    <g id="A-durations" inkscape:label="Durations">
      <text class="support muted mid" x="154" y="304">3.5 s</text>
      <text class="support muted mid" x="296" y="304">2 s</text>
      <text class="support muted mid" x="511" y="304">3 s</text>
      <text class="support muted mid" x="615" y="304">3 s</text>
      <text class="support muted mid" x="732" y="304">3.5 s</text>
      <text class="support muted mid" x="835" y="304">1.5 s</text>
    </g>
    <g id="A-probe-response" inkscape:label="Probe response">
      <text class="support mid" x="835" y="328"><tspan x="835">Seen before?</tspan><tspan x="835" dy="20">Yes / No</tspan></text>
    </g>
    <text id="A-instruction" class="instr mid" x="480" y="384">Keep the faces in mind; look at the pictures.</text>
  </g>

  <!-- ===================== PANEL B ===================== -->
  <g id="panel-B" inkscape:label="Panel B – Recognition">
    <text class="panel-letter" x="24" y="432">B</text>
    <text class="panel-title" x="50" y="432">Recognition</text>
    <text id="B-measure" class="label mid" x="171" y="472">Corrected recognition</text>
    <g id="B-tiles" inkscape:label="Qualitative comparison tiles">
      <g id="B-tile-neutral">
        <rect x="24" y="486" width="294" height="56" rx="6" fill="#fbf9f5" stroke="#6fb3ab" stroke-width="1.8"/>
        <text class="label teal-text" x="40" y="520">Neutral</text>
        <text class="result end" x="302" y="520">Higher</text>
      </g>
      <g id="B-tile-negative">
        <rect x="24" y="558" width="294" height="56" rx="6" fill="#fbf9f5" stroke="#df9a87" stroke-width="1.8"/>
        <text class="label coral-text" x="40" y="592">Negative emotional</text>
        <text class="result end" x="302" y="592">Lower</text>
      </g>
    </g>
    <text id="B-definition" class="support muted mid" x="171" y="644">Hit rate − false-alarm rate</text>
  </g>

  <!-- ===================== PANEL C ===================== -->
  <g id="panel-C" inkscape:label="Panel C – Regional BOLD responses">
    <text class="panel-letter" x="362" y="432">C</text>
    <text class="panel-title" x="388" y="432">Regional BOLD responses</text>
    <text class="subtitle" x="388" y="456">Negative emotional versus neutral</text>
    <g id="C-row-separators" stroke="#ebe6dc" stroke-width="1">
      <line x1="388" y1="525" x2="936" y2="525"/>
      <line x1="388" y1="579" x2="936" y2="579"/>
      <line x1="388" y1="633" x2="936" y2="633"/>
    </g>
    <g id="C-rows" inkscape:label="Region rows">
      <g id="C-row-dlpfc">
        <text class="label" x="388" y="504">Dorsolateral PFC</text>
        <rect x="824" y="481" width="112" height="34" rx="17" fill="#dde6f0" stroke="#86a2c4" stroke-width="1.4"/>
        <text class="result mid" x="880" y="504" fill="#3d5d85" style="fill:#3d5d85">Lower</text>
      </g>
      <g id="C-row-parietal">
        <text class="label" x="388" y="558">Lateral parietal cortex</text>
        <rect x="824" y="535" width="112" height="34" rx="17" fill="#dde6f0" stroke="#86a2c4" stroke-width="1.4"/>
        <text class="result mid" x="880" y="558" fill="#3d5d85" style="fill:#3d5d85">Lower</text>
      </g>
      <g id="C-row-amygdala">
        <text class="label" x="388" y="612">Amygdala</text>
        <rect x="824" y="589" width="112" height="34" rx="17" fill="#f4e5c4" stroke="#c9a04e" stroke-width="1.4"/>
        <text class="result mid" x="880" y="612" fill="#7f5a18" style="fill:#7f5a18">Higher</text>
      </g>
      <g id="C-row-vlpfc">
        <text class="label" x="388" y="666">Ventrolateral PFC</text>
        <rect x="824" y="643" width="112" height="34" rx="17" fill="#f4e5c4" stroke="#c9a04e" stroke-width="1.4"/>
        <text class="result mid" x="880" y="666" fill="#7f5a18" style="fill:#7f5a18">Higher</text>
      </g>
    </g>
  </g>
  <g id="figure-note" inkscape:label="Footer">
    <text class="note mid" x="480" y="710">Schematic; timing not to scale</text>
  </g>
</svg>
