      <ellipse cx="18" cy="18" rx="14" ry="14.5" fill="#6f6a63"/>
      <ellipse cx="6.4" cy="23.5" rx="1.9" ry="3.3" fill="#c9c3ba"/>
      <ellipse cx="29.6" cy="23.5" rx="1.9" ry="3.3" fill="#c9c3ba"/>
      <ellipse cx="18" cy="23" rx="11.6" ry="15.2" fill="#d6d1c9"/>
      <path d="M6.6,20 C6.8,9 12.6,4.6 18,4.6 C23.4,4.6 29.2,9 29.4,20 C27.4,14 23,11.6 18,11.6 C13,11.6 8.6,14 6.6,20 Z" fill="#6f6a63"/>
      <path d="M11.6,17.6 L15.6,17.1 M20.4,17.1 L24.4,17.6" stroke="#57524c" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <ellipse cx="13.7" cy="20.8" rx="1.55" ry="1.1" fill="#3f3b36"/>
      <ellipse cx="22.3" cy="20.8" rx="1.55" ry="1.1" fill="#3f3b36"/>
      <path d="M18,22 L17,28.3 L19.1,28.6" stroke="#a39c92" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M14.8,32.6 L21.2,32.6" stroke="#8a8279" stroke-width="1.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="face-2" viewBox="0 0 36 44" inkscape:label="Face 2 (neutral; reused as probe)">
      <path d="M4.5,25 C4,10 10,2.8 18,2.8 C26,2.8 32,10 31.5,25 L32,35 C30,33 28,31 27,29 L9,29 C8,31 6,33 4,35 Z" fill="#9a9389"/>
      <ellipse cx="18" cy="23" rx="10.6" ry="14.6" fill="#e0d8cc"/>
      <path d="M7.4,20 C7.6,10 12.4,6.4 18.6,6.4 C24,6.4 28.6,10.4 28.6,19.5 C25.6,13 21,11.2 15.6,12 C12.4,12.6 9.6,15.6 7.4,20 Z" fill="#9a9389"/>
      <path d="M12.2,17.9 L15.8,17.6 M20.2,17.6 L23.8,17.9" stroke="#6e675e" stroke-width="1" stroke-linecap="round" fill="none"/>
      <ellipse cx="14" cy="21" rx="1.45" ry="1.05" fill="#3f3b36"/>
      <ellipse cx="22" cy="21" rx="1.45" ry="1.05" fill="#3f3b36"/>
      <path d="M18,22.4 L17.2,28 L18.9,28.3" stroke="#aea596" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M15.2,32.3 L20.8,32.3" stroke="#93897d" stroke-width="1.15" stroke-linecap="round"/>
    </symbol>
    <symbol id="face-3" viewBox="0 0 36 44" inkscape:label="Face 3 (neutral)">
      <ellipse cx="5.6" cy="23" rx="2.1" ry="3.6" fill="#bcb3a6"/>
      <ellipse cx="30.4" cy="23" rx="2.1" ry="3.6" fill="#bcb3a6"/>
      <ellipse cx="18" cy="22.5" rx="12.6" ry="15.4" fill="#cdc3b5"/>
      <path d="M5.8,17 C6.4,8.6 11.4,5 18,5 C24.6,5 29.6,8.6 30.2,17 C27.6,12.6 23.4,10.8 18,10.8 C12.6,10.8 8.4,12.6 5.8,17 Z" fill="#4f4a44"/>
      <path d="M7.4,26 C8.6,34 12.6,37.8 18,37.8 C23.4,37.8 27.4,34 28.6,26 C27,30.4 24.4,30.6 18,30.4 C11.6,30.6 9,30.4 7.4,26 Z" fill="#8a8178"/>
      <path d="M11.2,17.2 L15.4,16.9 M20.6,16.9 L24.8,17.2" stroke="#4f4a44" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <ellipse cx="13.4" cy="20.6" rx="1.6" ry="1.1" fill="#3f3b36"/>
      <ellipse cx="22.6" cy="20.6" rx="1.6" ry="1.1" fill="#3f3b36"/>
      <path d="M18,21.8 L16.9,27 L19.2,27.3" stroke="#9b9184" stroke-width="0.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M15,31.6 L21,31.6" stroke="#5f5850" stroke-width="1.25" stroke-linecap="round"/>
    </symbol>

    <symbol id="scene-neutral-typing" viewBox="0 0 80 55" inkscape:label="Neutral scene: typing at a laptop">
      <rect x="30" y="36" width="44" height="3" fill="#a39d93"/>
      <rect x="68" y="39" width="3" height="13" fill="#a39d93"/>
      <path d="M10,51 V36 M10,40 H22" fill="none" stroke="#b9b2a6" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="19" cy="15" r="5.5" class="fig"/>
      <path d="M13.5,22.5 Q19,20.5 24.5,22.5 L25.5,39 L13,39 Z" class="fig"/>
      <path d="M23,27 L36,32.5" class="limb"/>
      <path d="M15,39 H29 V51" class="limb"/>
      <rect x="35" y="33" width="19" height="2.6" fill="#4a4741"/>
      <path d="M53,35 L58,18.5" stroke="#4a4741" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="scene-neutral-writing" viewBox="0 0 80 55" inkscape:label="Neutral scene: writing at a desk">
      <rect x="6" y="36" width="46" height="3" fill="#a39d93"/>
      <rect x="9" y="39" width="3" height="13" fill="#a39d93"/>
      <rect x="11" y="33" width="9" height="3" fill="#4a4741"/>
      <path d="M15.5,33 L19,21 L27,17" fill="none" stroke="#4a4741" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="24.5,13.5 34,15.5 29.5,22" fill="#a39d93"/>
      <rect x="31" y="33.2" width="11" height="2.8" fill="#fbf9f5" stroke="#a39d93" stroke-width="0.8"/>
      <path d="M70,51 V36 M68,40 H72" fill="none" stroke="#b9b2a6" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="61" cy="15" r="5.5" class="fig"/>
      <path d="M55.5,22.5 Q61,20.5 66.5,22.5 L67,39 L54.5,39 Z" class="fig"/>
      <path d="M57,27 L43,32.5" class="limb"/>
      <path d="M65,39 H51 V51" class="limb"/>
    </symbol>
    <symbol id="scene-negative-confrontation" viewBox="0 0 80 55" inkscape:label="Negative scene: confrontation">
      <circle cx="22" cy="11.5" r="5.5" fill="#5c5751"/>
      <polygon points="16,19 27.5,18 32,36.5 18.5,37.5" fill="#5c5751"/>
      <path d="M22.5,37 L19.5,52 M28.5,36.5 L33,52" fill="none" stroke="#5c5751" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M26,20.5 L33.5,9" fill="none" stroke="#5c5751" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="34.6" cy="7.2" r="2.8" fill="#5c5751"/>
      <path d="M28,25 L41,23" fill="none" stroke="#5c5751" stroke-width="3" stroke-linecap="round"/>
      <circle cx="63" cy="12.5" r="5.4" fill="#8f8980"/>
      <polygon points="57.5,19.5 68,19.5 62,37.5 51.5,37.5" fill="#8f8980"/>
      <path d="M53.5,37.5 L50,52 M60,37.5 L63,52" fill="none" stroke="#8f8980" stroke-width="3" stroke-linecap="round"/>
      <path d="M59,22.5 L49,15.5 M61,24.5 L50.5,21.5" fill="none" stroke="#8f8980" stroke-width="2.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="scene-negative-followed" viewBox="0 0 80 55" inkscape:label="Negative scene: followed in a dark passage">
      <rect x="0" y="0" width="36" height="55" fill="#cfc9be"/>
      <path d="M3,55 V8 Q17,0 31,8 V55" fill="#b9b2a6"/>
      <circle cx="19" cy="13.5" r="6.4" fill="#4a4741"/>
      <ellipse cx="20.2" cy="14.6" rx="2.6" ry="3.4" fill="#77726a"/>
      <path d="M10.5,23 Q19,18.5 27.5,23 L26,44 L12,44 Z" fill="#4a4741"/>
      <path d="M15,44 L14,52 M24,44 L25,52" fill="none" stroke="#4a4741" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="52.5" x2="80" y2="52.5" stroke="#b9b2a6" stroke-width="1.2"/>
      <circle cx="59" cy="14" r="5.4" fill="#8f8980"/>
      <polygon points="53.5,21 64,21 65,38 52.5,38" fill="#8f8980"/>
      <path d="M55.5,38 L50.5,51 M61.5,38 L67,51" fill="none" stroke="#8f8980" stroke-width="3" stroke-linecap="round"/>
