<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1600" width="1500" height="1600" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" role="img" aria-labelledby="figure-03-title figure-03-description">
<title id="figure-03-title">Figure 3. Different OFC responses preserve different information</title>
<desc id="figure-03-description">Schematic functional response classes. Four example neurons, each on its own arbitrary scale: offer value A, offer value B, chosen value, and chosen juice. Uses the illustrative 1A ≈ 3B exchange rate. Not a reconstruction of published data. Four example neurons illustrate three functional response patterns. In panel C paired symbols share the same response height and are separated horizontally only for visibility. Equivalent amounts assume proportional value over the illustrated range.</desc>
<rect id="background" x="0" y="0" width="1500" height="1600" fill="#FBF8F2"/>
<g id="header">
<text x="40.0" y="58.0" font-size="32" font-weight="bold" text-anchor="start" fill="#333333" font-style="italic">Schematic functional response classes</text>
<text x="40.0" y="98.0" font-size="30" font-weight="normal" text-anchor="start" fill="#666159">Each plot shows a different example neuron</text>
<text x="1000.0" y="58.0" font-size="30" font-weight="normal" text-anchor="start" fill="#666159">Choice markers (C, D)</text>
