<text x="1040.0" y="98.0" font-size="32" font-weight="normal" text-anchor="start" fill="#333333">A chosen</text>
<circle class="marker-B-chosen" cx="1212.0" cy="88.0" r="14.5" fill="#2876A8" stroke="#FBF8F2" stroke-width="2.5"/>
<text x="1238.0" y="98.0" font-size="32" font-weight="normal" text-anchor="start" fill="#333333">B chosen</text>
</g>
