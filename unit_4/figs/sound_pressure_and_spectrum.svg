<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img">
<title>Sound as pressure and spectrum</title>
<desc>Four-panel scientific figure. Panel A: a tuning fork generating a longitudinal pressure wave in air, shown as alternating bands of high and low dot density labelled compression and rarefaction. Panel B: a sine wave on pressure versus distance axes with amplitude, wavelength, period and phase marked. Panel C: a sustained vowel waveform showing temporal fine structure and a temporal envelope. Panel D: the corresponding harmonic frequency spectrum with a fundamental frequency and higher harmonics.</desc>
