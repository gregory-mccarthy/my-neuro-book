<text class="ts" x="40" y="554" fill="#5F5E5A">A &#8594; B: molecular displacement resolves into a pressure function of distance at a fixed instant. C &#8594; D: the</text>
<text class="ts" x="40" y="572" fill="#5F5E5A">Fourier transform of a complex periodic wave yields discrete components at integer multiples of f&#8320;. In a</text>
<text class="ts" x="40" y="590" fill="#5F5E5A">vowel, f&#8320; is the glottal pulse rate and the relative harmonic amplitudes reflect vocal-tract resonances.</text>
